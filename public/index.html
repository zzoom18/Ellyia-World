  /* ---------- Food Chains (P4–P6) ---------- */
  function startFoodChain(world){
    var rounds = 5;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;
    var pool = deal(world.id, FOODCHAINS, keyer(), rounds);

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var chain = pool[i].slice(0, band() >= 3 ? 5 : 4).filter(Boolean);
      var placed = 0, wrongTaps = 0, done = false;

      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:"Build the food chain, starting with the producer"}));

      var slots = el("div",{"class":"cycleslots"});
      var slotEls = [];
      chain.forEach(function(_, k){
        if(k) slots.appendChild(el("div",{"class":"arrow", text:"→"}));
        var sl = el("div",{"class":"cslot"}, el("div",{"class":"cn", text:String(k+1)}));
        slots.appendChild(sl); slotEls.push(sl);
      });
      shell.stage.appendChild(slots);

      var tray = el("div",{"class":"tray"});
      shuffle(chain.map(function(o, idx){ return {o:o, idx:idx}; })).forEach(function(card){
        var btn = el("button",{"class":"stagecard"});
        btn.appendChild(el("div",{"class":"se", text:card.o.e}));
        btn.appendChild(el("div",{"class":"sl", text:card.o.n}));
        btn.addEventListener("click", function(){
          if(done || btn.classList.contains("used")) return;
          if(card.idx === placed){
            var sl = slotEls[placed];
            sl.textContent = "";
            sl.appendChild(el("div",{"class":"se", text:card.o.e}));
            sl.appendChild(el("div",{"class":"sl", text:card.o.n}));
            sl.classList.add("filled");
            btn.classList.add("used");
            placed++; sfx.tap();
            if(placed === chain.length){
              done = true;
              var ok = wrongTaps === 0;
              if(ok){ correct++; rightAnswer(); flash("⭐"); } else { wrongAnswer(); }
              shell.stage.appendChild(el("div",{"class":"fact",
                text:"💡 " + chain[0].n + " is the producer — it makes its own food. Everything after it is a consumer."}));
              markDot(shell.dots, i, ok); i++;
              setTimeout(next, 2100);
            }
          } else {
            wrongTaps++; sfx.bad();
            btn.classList.add("nope");
            setTimeout(function(){ btn.classList.remove("nope"); }, 400);
          }
        });
        tray.appendChild(btn);
      });
      shell.stage.appendChild(tray);
    }
    next();
  }

  /* ---------- Guess the Number ----------
     Higher-or-lower. With a small range the child taps the number; with a big
     one they move a slider, which is where halving the range starts to pay. */
  function startGuessNumber(world){
    var lv = schoolLevel();
    var max = (lv === "N" || lv === "K1") ? 10 : (lv === "K2" || lv === "P1") ? 20
            : (lv === "P2" || lv === "P3") ? 50 : 100;
    var allowed = Math.ceil(Math.log(max) / Math.log(2)) + 1;
    var rounds = 5;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var secret = ri(1, max), tries = 0, done = false;
      var lo = 1, hi = max;

      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:"I am thinking of a number from 1 to " + max}));
      var hint = el("div",{"class":"bigq", style:"font-size:clamp(26px,6vw,40px)", text:"Have a guess!"});
      shell.stage.appendChild(hint);
      var left = el("div",{"class":"prompt", text:allowed + " guesses left"});
      shell.stage.appendChild(left);

      function judge(g){
        if(done) return;
        tries++;
        if(g === secret){
          done = true;
          correct++; sfx.good(); flash("⭐");
          hint.textContent = "Yes! It was " + secret;
          markDot(shell.dots, i, true);
          i++; setTimeout(next, 1300);
          return;
        }
        if(g < secret){ lo = Math.max(lo, g + 1); hint.textContent = g + " is too LOW"; }
        else { hi = Math.min(hi, g - 1); hint.textContent = g + " is too HIGH"; }
        sfx.bad();
        left.textContent = Math.max(0, allowed - tries) + " guesses left";
        if(tries >= allowed){
          done = true;
          hint.textContent = "It was " + secret;
          markDot(shell.dots, i, false);
          i++; setTimeout(next, 1500);
        } else {
          paint();
        }
      }

      var holder = el("div",{style:"width:100%; max-width:560px"});
      shell.stage.appendChild(holder);

      function paint(){
        holder.textContent = "";
        if(max <= 20){
          var grid = el("div",{"class":"numpad"});
          for(var n = 1; n <= max; n++){
            (function(n){
              var out = n < lo || n > hi;
              var btn = el("button",{"class":"numkey" + (out ? " out" : ""), text:String(n)});
              if(!out) btn.addEventListener("click", function(){ judge(n); });
              grid.appendChild(btn);
            })(n);
          }
          holder.appendChild(grid);
        } else {
          var val = Math.round((lo + hi) / 2);
          var read = el("div",{"class":"bigq", style:"font-size:clamp(40px,10vw,64px)", text:String(val)});
          holder.appendChild(read);
          var sl = el("input",{type:"range", min:String(lo), max:String(hi), value:String(val), "class":"slider", id:"gn_slider"});
          sl.addEventListener("input", function(){ read.textContent = sl.value; });
          holder.appendChild(sl);
          holder.appendChild(el("div",{"class":"prompt", style:"margin-top:4px", text:"between " + lo + " and " + hi}));
          var go = el("button",{"class":"btn btn-lg btn-go", style:"width:100%; margin-top:12px", text:"Guess"});
          go.addEventListener("click", function(){ judge(Number(sl.value)); });
          holder.appendChild(go);
        }
      }
      paint();
    }
    next();
  }

  /* ---------- Guess the Animal ---------- */
  function startGuessAnimal(world){
    var rounds = 5;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;
    var pool = deal(world.id, ANIMAL_CLUES, keyer(), rounds);

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var item = pool[i];
      var shown = 1, done = false;

      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:"Guess the animal from the clues"}));
      var clueBox = el("div",{"class":"clues"});
      shell.stage.appendChild(clueBox);

      function paintClues(){
        clueBox.textContent = "";
        for(var c = 0; c < shown; c++){
          clueBox.appendChild(el("div",{"class":"clue"},
            el("span",{"class":"cnum", text:String(c+1)}),
            el("span",{text:item.clues[c]})));
        }
      }
      paintClues();

      var more = el("button",{"class":"btn btn-ghost", text:"Another clue"});
      more.addEventListener("click", function(){
        if(done || shown >= item.clues.length) return;
        shown++; sfx.tap(); paintClues();
        if(shown >= item.clues.length) more.hidden = true;
      });
      shell.stage.appendChild(more);

      var others = shuffle(ANIMAL_CLUES.filter(function(x){ return x.a !== item.a; })).slice(0, 3);
      var grid = el("div",{"class":"choices", style:"max-width:560px"});
      shuffle([item].concat(others)).forEach(function(o){
        var btn = el("button",{"class":"choice", style:"flex-direction:column; min-height:104px"});
        btn.appendChild(el("div",{style:"font-size:clamp(28px,6.5vw,38px)", text:o.e}));
        btn.appendChild(el("div",{style:"font-size:14px; font-weight:800; margin-top:4px", text:o.a}));
        btn.addEventListener("click", function(){
          if(done) return;
          done = true;
          var ok = o.a === item.a;
          btn.classList.add(ok ? "right" : "wrong");
          if(ok){ correct++; rightAnswer(); flash("⭐"); } else { wrongAnswer(); }
          shell.stage.appendChild(el("div",{"class":"fact",
            text: ok ? ("💡 Guessed it with " + shown + " clue" + (shown === 1 ? "" : "s") + ".")
                     : ("💡 It was the " + item.a.toLowerCase() + ".")}));
          markDot(shell.dots, i, ok);
          i++; setTimeout(next, 1800);
        });
        grid.appendChild(btn);
      });
      shell.stage.appendChild(grid);
    }
    next();
  }

  function buildFlags(level){
    var b = band(), count = b <= 1 ? 6 : 8;
    var maxBand = b <= 1 ? 0 : b === 2 ? 1 : 2;
    var pool = FLAGS.filter(function(f){ return f.b <= maxBand; });
    var used = [], qs = [], i;
    for(i = 0; i < count; i++){
      var choices = pool.filter(function(f){ return used.indexOf(f.n) < 0; });
      if(!choices.length) choices = pool;
      var item = pick(choices);
      used.push(item.n);
      var wrongs = shuffle(pool.filter(function(f){ return f.n !== item.n; })).slice(0, 3)
        .map(function(w){ return w.n; });
      qs.push({code: item.c, answer: item.n, opts: shuffle([item.n].concat(wrongs))});
    }
    return qs;
  }
  /* Flag EMOJI render as the bare two-letter code on Windows and on most
     Linux browsers — no picture at all, just text, which used to make this
     unplayable there. Real SVG flags (from the flag-icons project) render
     identically everywhere, so the country picture is never left to the
     platform's font. */
  function renderFlags(q, stage, done){
    stage.appendChild(el("div",{"class":"prompt", text:"Which country is this flag from?"}));
    var pic = el("div",{"class":"flagpic"});
    pic.innerHTML = FLAG_SVGS[q.code] || "";
    stage.appendChild(pic);
    stage.appendChild(choiceGrid(q.opts, q.answer, done, false));
  }

  /* ---------- Riddle Time ---------- */
  function startRiddles(world){
    var rounds = 6;
    var pool = dealBand(world.id, RIDDLES, rounds);
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var r = pool[i];
      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:"Riddle " + (i+1) + " of " + rounds}));
      /* A picture of the answer itself would give the riddle away, so every
         round gets the same puzzle-piece picture rather than one tied to
         what is actually being described. */
      var rscene = el("div",{"class":"quiz-scene", style:"width:100px; height:100px"});
      rscene.appendChild(el("div",{"class":"pic", style:"font-size:54px", text:"🧩"}));
      shell.stage.appendChild(rscene);
      shell.stage.appendChild(el("div",{"class":"story", style:"font-size:clamp(17px,4.4vw,22px)", text:r.q}));
      speak(r.q);
      lastSpoken = stageQuestion(shell.stage);
      shell.stage.appendChild(choiceGrid(shuffle([r.a].concat(r.w)), r.a, function(ok){
        if(ok){ correct++; rightAnswer(); flash("⭐"); speak(r.a); }
        else { wrongAnswer(); }
        if(r.why) shell.stage.appendChild(el("div",{"class":"fact", text:"💡 " + r.why}));
        if(!ok) speak(r.a + (r.why ? ". " + r.why : ""));
        markDot(shell.dots, i, ok); i++;
        afterSpeech(next, ok ? 1200 : 2400);
      }, false));
      var grid = shell.stage.lastChild;
      Array.prototype.forEach.call(grid.children, function(c){
        c.style.fontSize = "clamp(16px,4vw,21px)"; c.style.minHeight = "76px";
      });
    }
    next();
  }

  /* ---------- Mystery Picture ---------- */
  function startMystery(world){
    var rounds = 6;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var item = pick(PICS);
      var others = shuffle(PICS.filter(function(x){ return x.w !== item.w; })).slice(0, 3);
      var done = false, opened = 0;

      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:"Open a few squares, then guess"}));

      var box = el("div",{"class":"mystery"});
      box.appendChild(el("div",{"class":"myemo", text:item.e}));
      var cover = el("div",{"class":"cover"});
      var tiles = [];
      for(var k = 0; k < 9; k++){
        (function(){
          var t = el("button",{"class":"mtile"});
          t.addEventListener("click", function(){
            if(done || t.classList.contains("open")) return;
            t.classList.add("open"); opened++; sfx.tap();
          });
          cover.appendChild(t); tiles.push(t);
        })();
      }
      box.appendChild(cover);
      shell.stage.appendChild(box);

      var grid = el("div",{"class":"choices", style:"max-width:560px"});
      shuffle([item].concat(others)).forEach(function(o){
        var btn = el("button",{"class":"choice", style:"font-size:clamp(16px,4vw,21px); min-height:76px", text:o.w});
        btn.addEventListener("click", function(){
          if(done) return;
          done = true;
          var ok = o.w === item.w;
          tiles.forEach(function(t){ t.classList.add("open"); });
          btn.classList.add(ok ? "right" : "wrong");
          if(ok){ correct++; rightAnswer(); flash("⭐"); } else { wrongAnswer(); }
          markDot(shell.dots, i, ok);
          i++; setTimeout(next, 1500);
        });
        grid.appendChild(btn);
      });

  /* Count the Beats — steady pulse, how many */
  function startBeats(world){
    var b = band(), rounds = 8;

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var maxBeats = b === 0 ? 5 : b === 1 ? 7 : 9;
      var n = ri(2, maxBeats);
      var spacing = b === 0 ? 620 : b === 1 ? 520 : 420;

      shell.stage.textContent = "";

        for(var k = 0; k < n; k++){
          (function(k){
            setTimeout(function(){
              beep(160, .13, "triangle");
              pulse.textContent = "●";
              setTimeout(function(){ pulse.textContent = " "; }, 160);
            }, k * spacing);
          })(k);
        }
        return n * spacing;
      }));

      var opts = [n], guard = 0;
      while(opts.length < 4 && guard++ < 40){
        var d = ri(2, maxBeats + 1);
        if(opts.indexOf(d) < 0) opts.push(d);
      }
      shell.stage.appendChild(choiceGrid(shuffle(opts), n, function(ok){
        if(ok){ correct++; rightAnswer(); flash("⭐"); } else { wrongAnswer(); }
        markDot(shell.dots, i, ok); i++;
        setTimeout(next, ok ? 700 : 1150);
      }, false));
    }
    next();
  }

  /* Copy the Tune — a melody to repeat, on coloured notes */
  function startTune(world){
    var b = band(), rounds = 6;
    var startLen = b === 0 ? 2 : b === 1 ? 3 : 3;
    var pace = b === 0 ? 720 : b === 1 ? 600 : b === 2 ? 500 : 420;
    var pads = [
      {nm:"do", hex:"#FF5D8F", tone:SCALE[0]},
      {nm:"re", hex:"#FFC43D", tone:SCALE[1]},
      {nm:"mi", hex:"#35C48F", tone:SCALE[2]},
      {nm:"fa", hex:"#2FB6E6", tone:SCALE[3]},
      {nm:"so", hex:"#9B7BFF", tone:SCALE[4]}
    ];
    var shell = gameShell(world, rounds);
    var round = 0, correct = 0;

    shell.stage.appendChild(el("div",{"class":"prompt", text:"Listen to the tune, then play it back"}));
    var status = el("div",{"class":"bigq", style:"font-size:clamp(22px,5vw,32px)", text:"Get ready…"});
    shell.stage.appendChild(status);
    var row = el("div",{"class":"tunepads"});
    var padEls = pads.map(function(pd){
      var e = el("button",{"class":"tunepad", style:"background:"+pd.hex, "aria-label":pd.nm},
        el("span",{text:pd.nm}));
      row.appendChild(e);
      return e;
    });
    shell.stage.appendChild(row);

    function light(k, ms){
      padEls[k].classList.add("lit");
      beep(pads[k].tone, .3, null, MUSIC_GAME_VOL);
      setTimeout(function(){ padEls[k].classList.remove("lit"); }, ms * .6);
    }

    function playRound(){
      if(round >= rounds){ finish(world, correct, rounds); return; }
      var seq = [], k;
      for(k = 0; k < startLen + round; k++) seq.push(ri(0, pads.length - 1));
      status.textContent = "Listen…";
      var accepting = false, input = [];

      seq.forEach(function(idx, k2){
        setTimeout(function(){
          if(!document.body.contains(row)) return;
          light(idx, pace);
        }, 700 + k2 * pace);
      });
      setTimeout(function(){
        if(!document.body.contains(row)) return;
        accepting = true;
        status.textContent = "Your turn!";
      }, 700 + seq.length * pace + 200);

      padEls.forEach(function(e, idx){
        e.onclick = function(){
          if(!accepting) return;
          light(idx, 280);
          input.push(idx);
          if(input[input.length-1] !== seq[input.length-1]){
            accepting = false; sfx.bad();
            status.textContent = "Not quite!";
            markDot(shell.dots, round, false);
            round++; setTimeout(playRound, 1200);
            return;
          }
          if(input.length === seq.length){
            accepting = false; correct++; sfx.good(); flash("⭐");
            status.textContent = "Perfect!";
            markDot(shell.dots, round, true);
            round++; setTimeout(playRound, 1000);
          }
        };
      });
    }
    setTimeout(playRound, 600);
  }

  /* ---------- Music Maker ----------
     Every other music game grades listening; this one is the odd one out on
     purpose — no rounds, no right answer, just the same eight pads free to
     tap, record and play back. A star for the first tune actually finished
     is the only nod to the star economy the rest of the app runs on. */
  function startMusicMaker(world){
    var pads = [
      {nm:"do",  hex:"#FF5D8F"}, {nm:"re",  hex:"#FFC43D"}, {nm:"mi",  hex:"#35C48F"},
      {nm:"fa",  hex:"#2FB6E6"}, {nm:"so",  hex:"#9B7BFF"}, {nm:"la",  hex:"#FF8A5B"},
      {nm:"ti",  hex:"#FF5D8F"}, {nm:"do'", hex:"#FFD166"}
    ];
    var shell = gameShell(world, 0);
    shell.stage.appendChild(el("div",{"class":"prompt", text:"Tap the pads to play — press Record to save your tune!"}));

    var row = el("div",{"class":"tunepads"});
    var padEls = pads.map(function(pd){
      var e = el("button",{"class":"tunepad", style:"background:"+pd.hex, "aria-label":pd.nm},
        el("span",{text:pd.nm}));
      row.appendChild(e);
      return e;
    });
    shell.stage.appendChild(row);

    var controls = el("div",{style:"display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:16px"});
    var recBtn = el("button",{"class":"btn btn-lg btn-go", text:"⏺️ Record"});
    var playBtn = el("button",{"class":"btn btn-lg btn-ghost", text:"▶️ Play back"});
    var clearBtn = el("button",{"class":"btn btn-lg btn-ghost", text:"🗑️ Clear"});
    playBtn.disabled = true;
    controls.appendChild(recBtn); controls.appendChild(playBtn); controls.appendChild(clearBtn);
    shell.stage.appendChild(controls);

    var recording = false, recStart = 0, tape = [], awarded = false;

    function light(k){
      padEls[k].classList.add("lit");
      beep(SCALE[k], .35, null, MUSIC_GAME_VOL);
      setTimeout(function(){ if(padEls[k]) padEls[k].classList.remove("lit"); }, 260);
    }

    padEls.forEach(function(e, idx){
      e.addEventListener("click", function(){
        light(idx);
        if(recording) tape.push({idx:idx, t: Date.now() - recStart});
      });
    });

    recBtn.addEventListener("click", function(){
      sfx.tap();
      if(recording){
        recording = false;
        recBtn.textContent = "⏺️ Record";
        playBtn.disabled = tape.length === 0;
        if(tape.length >= 4 && !awarded){ awarded = true; award(world.id, 1, true); save(); }
        return;
      }
      tape = [];
      recording = true;
      recStart = Date.now();
      recBtn.textContent = "⏹️ Stop";
      playBtn.disabled = true;
    });

    playBtn.addEventListener("click", function(){
      if(!tape.length) return;
      sfx.tap();
      tape.forEach(function(note){
        setTimeout(function(){
          if(document.body.contains(row)) light(note.idx);
        }, note.t);
      });
    });

    clearBtn.addEventListener("click", function(){
      sfx.tap();
      tape = [];
      playBtn.disabled = true;
    });
  }

  /* Spot the Difference — two panels, one cell is not the same */
  function startSpotDiff(world){
    var b = band(), rounds = 6;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var n = b === 0 ? 3 : b === 1 ? 3 : b === 2 ? 4 : 4;   /* n x n */
      var cells = n * n;
      var base = pick(PICS).e;
      var other = pick(PICS.filter(function(x){ return x.e !== base; })).e;
      var oddAt = ri(0, cells - 1);
      var done = false;

      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:"One square is different. Tap it on the RIGHT."}));

      var pair = el("div",{"class":"spotpair"});
      function panel(withOdd){
        var g = el("div",{"class":"spotgrid", style:"grid-template-columns:repeat("+n+",1fr)"});
        for(var k = 0; k < cells; k++){
          (function(k){
            var isOdd = withOdd && k === oddAt;
            var cell = el("button",{"class":"spotcell", text: isOdd ? other : base});
            if(withOdd){
              cell.addEventListener("click", function(){
                if(done) return;
                done = true;
                var ok = k === oddAt;
                cell.classList.add(ok ? "right" : "wrong");
                if(!ok) g.children[oddAt].classList.add("right");
                if(ok){ correct++; rightAnswer(); flash("⭐"); } else { wrongAnswer(); }
                markDot(shell.dots, i, ok); i++;
                setTimeout(next, ok ? 750 : 1350);
              });
            } else {
              cell.disabled = true;
            }
            g.appendChild(cell);
          })(k);
        }
        return g;
      }
      pair.appendChild(panel(false));
      pair.appendChild(el("div",{"class":"spotvs", text:"vs"}));
      pair.appendChild(panel(true));
      shell.stage.appendChild(pair);
    }
    next();
  }

  /* Detective Clues — deduction: the clues rule everyone else out */
  function startDetective(world){
    var b = band(), rounds = 5;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;
    var FACES = ["🐶","🐱","🐼","🦊","🐯","🐨","🐸","🐵"];
    var COLS = [{nm:"red",hex:"#FF5D5D"},{nm:"blue",hex:"#3FA9FF"},{nm:"green",hex:"#44D69A"},{nm:"yellow",hex:"#FFC43D"}];
    var ACCS = [{nm:"a hat",e:"🎩"},{nm:"glasses",e:"👓"},{nm:"a scarf",e:"🧣"},{nm:"a cap",e:"🧢"}];

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      /* Every suspect gets a different face, colour and accessory, so any one
         attribute is enough to name somebody. */
      var faces = shuffle(FACES.slice()).slice(0, 4);
      var cols = shuffle(COLS.slice()).slice(0, 4);
      var accs = shuffle(ACCS.slice()).slice(0, 4);
      var suspects = faces.map(function(f, k){ return {face:f, col:cols[k], acc:accs[k]}; });
      var order = shuffle(suspects.slice());
      var culprit = order[0];
      var rest = order.slice(1);

      var clues;
      if(b <= 1){
        clues = ["The thief is wearing " + culprit.acc.nm + "."];
      } else if(b === 2){
        clues = ["The thief is NOT wearing " + rest[0].col.nm + ".",
                 "The thief is wearing " + culprit.acc.nm + "."];
      } else {
        clues = ["The thief is NOT wearing " + rest[0].col.nm + ".",
                 "The thief is NOT wearing " + rest[1].acc.nm + ".",
                 "The thief is NOT the " + rest[2].face + "."];
      }

      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:"🔍  Read the clues. Who did it?"}));
      var box = el("div",{"class":"clues"});
      clues.forEach(function(c, k){
        box.appendChild(el("div",{"class":"clue"},
          el("span",{"class":"cnum", text:String(k+1)}),
          el("span",{text:c})));
      });
      shell.stage.appendChild(box);

      var line = el("div",{"class":"lineup"});
      var locked = false;
      shuffle(suspects.slice()).forEach(function(s){
        var btn = el("button",{"class":"suspect", style:"background:"+s.col.hex});
        btn.appendChild(el("div",{"class":"sf", text:s.face}));
        btn.appendChild(el("div",{"class":"sa", text:s.acc.e}));
        btn.appendChild(el("div",{"class":"sc", text:s.col.nm}));
        btn.addEventListener("click", function(){
          if(locked) return;
          locked = true;
          var ok = s === culprit;
          btn.classList.add(ok ? "right" : "wrong");
          if(ok){ correct++; rightAnswer(); flash("⭐"); } else { wrongAnswer(); }
          shell.stage.appendChild(el("div",{"class":"fact",
            text: ok ? "💡 Case solved!" : ("💡 It was the " + culprit.face + " in " + culprit.col.nm + ", wearing " + culprit.acc.nm + ".")}));
          markDot(shell.dots, i, ok); i++;
          setTimeout(next, 1900);
        });
        line.appendChild(btn);
      });
      shell.stage.appendChild(line);
    }
    next();
  }

    if(world.id === "zhreadaloud") return startReadAloud(world, {items:READ_ALOUD_ZH, lang:"zh-CN", text:function(it){ return it.s; }, gloss:function(it){ return it.en; }, prompt:"请大声读出来"});
    if(world.id === "zhreadstory") return startReadAloud(world, {items:READ_STORY_ZH, lang:"zh-CN", text:function(it){ return it.s; }, gloss:function(it){ return it.en; }, prompt:"请大声读出来"});
  }









  /* ==========================================================================
     Number Line Leap
     --------------------------------------------------------------------------
     A number line with only its ends labelled. The frog has to land on a
     given number, so the child has to work out the spacing rather than count
     pictures. At P4 and up the same line carries fractions and decimals,
     which is where most of the confusion about "which is bigger" lives.
     ========================================================================== */

  function numberLineRound(b, level){
    var end, step, marks, want, labelOf;
    if(b === 0){        end = 10;  step = 1; }
    else if(b === 1){   end = 20;  step = 1; }
    else if(b === 2){   end = pick([50, 100]); step = end / 10; }
    else {              end = pick([1, 10, 100]); step = end / 10; }

    if(b === 3 && end === 1){
      /* A line from 0 to 1, marked in tenths: the question is whether 0.7 and
         7/10 land on the same place. */
      var tenth = ri(1, 9);
      want = tenth / 10;
      labelOf = function(v){ return Math.round(v * 10) / 10 === 0 ? "0" : String(Math.round(v * 10) / 10); };
      marks = 10;
      var asFrac = tenth + "/10";
      return {end:1, marks:10, want:want, prompt:"Where does " + asFrac + " go?",
        a:want, labelOf:labelOf, hint:asFrac};
    }
    marks = Math.round(end / step);
    want = step * ri(1, marks - 1);
    if(b === 3 && end === 10) want = Math.round(want * 10) / 10;
    labelOf = function(v){ return String(Math.round(v * 100) / 100); };
    return {end:end, marks:marks, want:want,
      prompt:"Where does " + labelOf(want) + " go?", a:want, labelOf:labelOf,
      hint:labelOf(want)};
  }

  function startNumberLine(world){
    var b = band(), rounds = b === 0 ? 5 : b === 1 ? 6 : 8;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var R = numberLineRound(b, levelOf(world.id));
      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:R.prompt}));
      speak(R.prompt);

      var line = el("div",{"class":"numline"});
      var rail = el("div",{"class":"numline-rail"});
      line.appendChild(rail);
      var frog = el("div",{"class":"numline-frog", text:"🐸"});
      line.appendChild(frog);
      var locked = false;

      for(var k = 0; k <= R.marks; k++){
        (function(k){
          var v = (R.end * k) / R.marks;
          var tick = el("button",{"class":"numline-tick", "aria-label":R.labelOf(v)});
          tick.style.left = ((k / R.marks) * 100) + "%";
          /* Only the two ends carry a number: labelling every tick would turn
             this into reading rather than working out. */
          if(k === 0 || k === R.marks)
            tick.appendChild(el("span",{"class":"numline-lab", text:R.labelOf(v)}));
          tick.addEventListener("click", function(){
            if(locked) return;
            locked = true;
            var ok = Math.abs(v - R.want) < 1e-9;
            frog.style.left = ((k / R.marks) * 100) + "%";
            frog.classList.add("hop");
            tick.classList.add(ok ? "right" : "wrong");
            if(!ok){
              var at = Math.round((R.want / R.end) * R.marks);
              var real = line.querySelectorAll(".numline-tick")[at];
              if(real) real.classList.add("right");
            }
            setTimeout(function(){
              if(ok){ correct++; sfx.good(); flash("⭐"); rightAnswer(frog); }
              else { sfx.bad(); wrongAnswer(); }
              markDot(shell.dots, i, ok);
              i++;
              setTimeout(next, ok ? 700 : 1200);
            }, 420);
          });
          line.appendChild(tick);
        })(k);
      }
      shell.stage.appendChild(line);
      shell.stage.appendChild(el("div",{"class":"hintline",
        text:"Tap the mark where " + R.hint + " belongs"}));
    }
    next();
  }

  /* ==========================================================================
     Pattern Train
     --------------------------------------------------------------------------
     Patterns are the first bit of algebra a child meets, years before anyone
     uses the word. Colours and shapes at nursery; growing number sequences by
     P2, where the step itself changes.
     ========================================================================== */

  var PATTERN_CARS = ["🔴","🟡","🔵","🟢","🟣","🟠"];
  var PATTERN_SHAPES = ["⭐","❤️","⚡","🌸","🍎","🌙"];

  function patternRound(b){
    if(b <= 1){
      /* ABAB, AABB or ABC, in colours or shapes. */
      var set = shuffle((Math.random() < 0.5 ? PATTERN_CARS : PATTERN_SHAPES).slice());
      var kind = b === 0 ? pick(["AB","ABC"]) : pick(["AB","ABC","AABB","ABB"]);
      var unit = kind === "AB"   ? [set[0], set[1]]
               : kind === "ABC"  ? [set[0], set[1], set[2]]
               : kind === "AABB" ? [set[0], set[0], set[1], set[1]]
               :                    [set[0], set[1], set[1]];
      var seq = [], n = 0;
      while(seq.length < (b === 0 ? 6 : 8)) seq.push(unit[n++ % unit.length]);
      var a = unit[seq.length % unit.length];
      var wrongs = set.filter(function(x){ return x !== a; }).slice(0, 3);
      return {seq:seq, a:a, opts:shuffle([a].concat(wrongs)), emo:true,
        prompt:"What comes next on the train?"};
    }
    /* Numbers, with a step that may itself grow. */
    var start = ri(1, 12), stepN = ri(2, b === 2 ? 6 : 9), seq2 = [], v = start, i;
    var growing = b === 3 && Math.random() < 0.45;
    var grow = ri(1, 3);
    for(i = 0; i < 5; i++){ seq2.push(v); v += growing ? stepN + grow * i : stepN; }
    var ans = v;
    return {seq:seq2.map(String), a:String(ans), emo:false,
      opts:shuffle(numberOptions(ans, Math.max(2, Math.round(stepN * 1.2)), 4).map(String)),
      prompt: growing ? "The step grows each time. What comes next?" : "What comes next?"};
  }

  function startPatterns(world){
    var b = band(), rounds = b === 0 ? 5 : 7;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;
    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var R = patternRound(b);
      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:R.prompt}));
      speak(R.prompt);
      var train = el("div",{"class":"train"});
      train.appendChild(el("div",{"class":"train-loco", text:"🚂"}));
      R.seq.forEach(function(v){
        train.appendChild(el("div",{"class":"train-car" + (R.emo ? " emo" : ""), text:String(v)}));
      });
      train.appendChild(el("div",{"class":"train-car gap", text:"?"}));
      shell.stage.appendChild(train);
      shell.stage.appendChild(choiceGrid(R.opts, R.a, function(ok){
        if(ok){ correct++; sfx.good(); flash("⭐"); } else { sfx.bad(); }
        markDot(shell.dots, i, ok);
        i++;
        setTimeout(next, ok ? 700 : 1100);
      }, R.emo));
    }
    next();
  }

  /* ==========================================================================
     Decimal Dash
     --------------------------------------------------------------------------
     P4 to P6 decimals. The four things that actually catch children out:
     which is bigger when the digits are the same length but the value is not,
     place value of a named digit, rounding, and the fraction it equals.
     ========================================================================== */

  function dec(n, dp){ return Number(n.toFixed(dp)); }

  function decimalRound(lvl){
    var kind = pick(["compare","place","round","convert","add"]);
    var a, bnum, ans, prompt, opts;
    if(kind === "compare"){
      /* The pair is built to look close on paper: same leading digits, and
         one of them longer, which is where "more digits means bigger" bites. */
      var whole = ri(1, 9);
      a = dec(whole + ri(1, 9) / 10, 1);
      bnum = dec(whole + ri(10, 99) / 100, 2);
      if(a === bnum) bnum = dec(bnum + 0.01, 2);
      ans = String(Math.max(a, bnum));
      return {prompt:"Which is bigger?", a:ans,
        opts:shuffle([String(a), String(bnum)]), wide:true};
    }
    if(kind === "place"){
      /* The three decimal digits have to differ from each other. When they do
         not, every choice in the grid is the same digit and the question has
         no wrong answer to offer. */
      var digits = shuffle([1,2,3,4,5,6,7,8,9]).slice(0, 4);
      var d1 = digits[0], d2 = digits[1], d3 = digits[2], spareD = digits[3];
      var w = ri(10, 99);
      var num = w + "." + d1 + d2 + d3;
      var slot = pick([1, 2, 3]);
      var names = {1:"tenths", 2:"hundredths", 3:"thousandths"};
      var digit = slot === 1 ? d1 : slot === 2 ? d2 : d3;
      return {prompt:"In " + num + ", which digit is in the " + names[slot] + " place?",
        a:String(digit),
        opts:shuffle([String(d1), String(d2), String(d3), String(spareD)])};
    }
    if(kind === "round"){
      var v = dec(ri(1, 60) + ri(1, 99) / 100, 2);
      var to = pick([0, 1]);
      ans = String(dec(Math.round(v * Math.pow(10, to)) / Math.pow(10, to), to));
      return {prompt:"Round " + v + " to " + (to === 0 ? "the nearest whole number" : "1 decimal place"),
        a:ans,
        opts:shuffle([ans, String(dec(Number(ans) + (to ? 0.1 : 1), to)),
          String(dec(Math.max(0, Number(ans) - (to ? 0.1 : 1)), to)), String(v)]
          .filter(uniqNum()))};
    }
    if(kind === "convert"){
      var t = ri(1, 9);
      var asDec = pick([true, false]);
      if(asDec) return {prompt:"What is " + t + "/10 as a decimal?", a:String(dec(t / 10, 1)),
        opts:shuffle([String(dec(t / 10, 1)), String(dec(t / 100, 2)), String(t), String(dec(t + 0.1, 1))]
          .filter(uniqNum()))};
      var h = ri(11, 99);
      return {prompt:"What is 0." + h + " as a fraction?", a:h + "/100",
        opts:shuffle([h + "/100", h + "/10", h + "/1000", (h * 10) + "/100"])};
    }
    var x = dec(ri(1, 20) + ri(1, 9) / 10, 1), y = dec(ri(1, 20) + ri(1, 9) / 10, 1);
    ans = dec(x + y, 1);
    return {prompt:x + " + " + y + " = ?", a:String(ans),
      opts:shuffle([String(ans), String(dec(ans + 0.1, 1)), String(dec(ans - 1, 1)),
        String(dec(ans + 1, 1))].filter(uniqNum()))};
  }

  function startDecimals(world){
    runSimple(world, 8, function(){ return decimalRound(levelOf(world.id)); });
  }

  /* ==========================================================================
     Ratio Rally
     --------------------------------------------------------------------------
     P5 and P6: ratio, rate and average. The wording is the PSLE wording,
     because half the difficulty of these questions is reading them.
     ========================================================================== */

  function ratioRound(){
    var kind = pick(["simplify","share","rate","average","part"]);
    var n1 = WP_NAMES[Math.floor(Math.random() * WP_NAMES.length)];
    var th = pick(WP_THINGS);
    var a, x, y, z, ans;
    if(kind === "simplify"){
      var g = pick([2, 3, 4, 5, 6]);
      x = ri(2, 9); y = ri(2, 9);
      while(gcd(x, y) !== 1){ x = ri(2, 9); y = ri(2, 9); }
      ans = x + " : " + y;
      return {prompt:"Write " + (x * g) + " : " + (y * g) + " in its simplest form", a:ans,
        opts:shuffle([ans, (x * g) + " : " + y, x + " : " + (y * g), (x + 1) + " : " + y])};
    }
    if(kind === "share"){
      x = ri(2, 5); y = ri(2, 5);
      var unit = ri(4, 14), total = unit * (x + y);
      ans = String(unit * x);
      return {prompt:total + " " + th.p + " are shared between " + n1 + " and a friend in the ratio " +
        x + " : " + y + ". How many does " + n1 + " get?", a:ans,
        opts:shuffle(numberOptions(unit * x, Math.max(2, unit), 4).map(String))};
    }
    if(kind === "rate"){
      var per = ri(3, 12), n = ri(3, 9);
      ans = String(per * n);
      return {prompt:"A machine makes " + per + " " + th.p + " a minute. How many in " + n + " minutes?",
        a:ans, opts:shuffle(numberOptions(per * n, Math.max(3, per), 4).map(String))};
    }
    if(kind === "average"){
      var cnt = ri(3, 5), mean = ri(4, 20), vals = [], sum = 0, i;
      for(i = 0; i < cnt - 1; i++){ var v = mean + ri(-3, 3); vals.push(v); sum += v; }
      vals.push(cnt * mean - sum);
      if(vals[vals.length - 1] < 0) vals[vals.length - 1] = 0;
      var realMean = vals.reduce(function(p, c){ return p + c; }, 0) / cnt;
      if(realMean !== Math.round(realMean)) return ratioRound();
      ans = String(realMean);
      return {prompt:"What is the average of " + vals.join(", ") + "?", a:ans,
        opts:shuffle(numberOptions(realMean, 4, 4).map(String))};
    }
    x = ri(2, 6); y = ri(2, 6);
    var u = ri(3, 11);
    ans = String(u * (x + y));
    return {prompt:n1 + " and a friend share " + th.p + " in the ratio " + x + " : " + y +
      ". " + n1 + " gets " + (u * x) + ". How many " + th.p + " altogether?", a:ans,
      opts:shuffle(numberOptions(u * (x + y), Math.max(3, u * 2), 4).map(String))};
  }
  function gcd(a, b){ return b ? gcd(b, a % b) : a; }

  function startRatio(world){
    runSimple(world, 7, ratioRound);
  }

  /* A prompt, four choices, read aloud. Half the games on this page are that
     shape; these ones build the round themselves. */
  function runSimple(world, rounds, build){
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;
    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var R = build();
      shell.stage.textContent = "";
      var row = el("div",{"class":"sayrow"});
      row.appendChild(el("div",{"class":R.prompt.length > 42 ? "wordprob" : "bigq",
        style: R.prompt.length > 42 ? "" : "font-size:clamp(24px,6vw,40px)", text:R.prompt}));
      var say = sayButton(R.prompt);
      if(say) row.appendChild(say);
      shell.stage.appendChild(row);
      speak(R.prompt);
      shell.stage.appendChild(choiceGrid(R.opts, R.a, function(ok){
        if(ok){ correct++; sfx.good(); flash("⭐"); } else { sfx.bad(); }
        markDot(shell.dots, i, ok);
        i++;
        setTimeout(next, ok ? 700 : 1200);
      }, false));
    }
    next();
  }

  /* ==========================================================================
     Basket Catch
     --------------------------------------------------------------------------
     Answers fall; slide the basket under the right one. Drag with a finger or
     use the arrows, because a phone and a laptop want different hands.
     ========================================================================== */

  function startCatch(world){
    var b = band(), rounds = b === 0 ? 5 : b === 1 ? 6 : 8;
    /* Pixels a second. Slow enough at the youngest that a child who reads the
       sum in time can always get there, brisk enough at the top that a round
       is over in a few seconds rather than a slow drift down the screen.
       Lowered across every band after it was reported too fast to actually
       work the sum out before the basket had to move. */
    var fall = b === 0 ? 54 : b === 1 ? 70 : b === 2 ? 88 : 108;

    var shell = gameShell(world, rounds);
    var i = 0, correct = 0, over = false;

    shell.stage.appendChild(el("div",{"class":"prompt",
      text:"Slide the basket under the right answer"}));
    var qline = el("div",{"class":"bigq"});
    shell.stage.appendChild(qline);

    var arena = el("div",{"class":"catch-arena"});
    var basket = el("div",{"class":"catch-basket", text:"🧺"});
    arena.appendChild(basket);
    shell.stage.appendChild(arena);

    var bx = 0.5;                                   /* basket, 0..1 across */
    function placeBasket(){ basket.style.left = (bx * 100) + "%"; }
    placeBasket();

    function moveTo(clientX){
      var r = arena.getBoundingClientRect();
      bx = Math.max(0.06, Math.min(0.94, (clientX - r.left) / r.width));
      placeBasket();
    }
    function onMove(e){
      var t = e.touches && e.touches[0];
      moveTo(t ? t.clientX : e.clientX);
      if(e.cancelable) e.preventDefault();
    }
    arena.addEventListener("pointerdown", onMove);
    arena.addEventListener("pointermove", function(e){ if(e.buttons) onMove(e); });
    arena.addEventListener("touchstart", onMove, {passive:false});
    arena.addEventListener("touchmove", onMove, {passive:false});
    function onKey(e){
      if(e.key === "ArrowLeft"){ bx = Math.max(0.06, bx - 0.08); placeBasket(); }
      if(e.key === "ArrowRight"){ bx = Math.min(0.94, bx + 0.08); placeBasket(); }
    }
    document.addEventListener("keydown", onKey);

    var arrows = el("div",{"class":"catch-arrows"});
    [["◀", -0.1], ["▶", 0.1]].forEach(function(pair){
      var bt = el("button",{"class":"btn btn-ghost catch-arrow", text:pair[0],
        "aria-label": pair[1] < 0 ? "Move left" : "Move right"});
      bt.addEventListener("click", function(){
        bx = Math.max(0.06, Math.min(0.94, bx + pair[1])); placeBasket();
      });
      arrows.appendChild(bt);
    });
    shell.stage.appendChild(arrows);

    function next(){
      if(over) return;
      if(i >= rounds){
        over = true;
        document.removeEventListener("keydown", onKey);
        finish(world, correct, rounds);
        return;
      }
      Array.prototype.slice.call(arena.querySelectorAll(".catch-drop"))
        .forEach(function(n){ n.parentNode.removeChild(n); });

      var Q = numberQuestion(b, Math.max(1, levelOf("numbers")));
      qline.textContent = qLine(Q);
      speak(Q.prompt ? Q.prompt : qLine(Q));

      var opts = shuffle(Q.opts.slice(0, b === 0 ? 3 : 4));
      var drops = opts.map(function(v, k){
        var d = el("div",{"class":"catch-drop", text:String(v)});
        d.style.left = (((k + 0.5) / opts.length) * 100) + "%";
        arena.appendChild(d);
        return {el:d, val:String(v), y: -40 - k * 40, done:false};
      });

      var last = null, settled = false;
      function frame(ts){
        if(over || settled) return;
        if(!document.body.contains(arena)){ over = true; return; }
        if(last === null) last = ts;
        var dt = Math.min(0.04, (ts - last) / 1000); last = ts;
        var h = arena.clientHeight || 260, w = arena.clientWidth || 320;
        var caughtAt = h - 62, gone = 0;

        drops.forEach(function(d){
          if(d.done){ gone++; return; }
          d.y += fall * dt;
          d.el.style.top = d.y + "px";
          if(d.y >= caughtAt && d.y <= caughtAt + 30){
            /* Caught if the basket is under it when it passes the rim. */
            var dropX = ((parseFloat(d.el.style.left) || 0) / 100) * w;
            if(Math.abs(dropX - bx * w) < w * 0.11){
              d.done = true; settled = true;
              d.el.classList.add("caught");
              judge(d.val === String(Q.a), Q);
              return;
            }
          }
          if(d.y > h + 30){ d.done = true; gone++; }
        });
        if(settled) return;
        if(gone >= drops.length){
          settled = true;
          qline.textContent = qLine(Q) + "  " + Q.a;
          judge(false, Q);
          return;
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      function judge(ok, Q){
        if(ok){ correct++; sfx.pop(); rightAnswer(basket); confettiBurst(22); }
        else { sfx.bad(); wrongAnswer(); }
        markDot(shell.dots, i, ok);
        i++;
        setTimeout(next, ok ? 700 : 1050);
      }
    }
    next();
  }

  /* ==========================================================================
     Sound Alike
     --------------------------------------------------------------------------
     Homophones, read aloud with a pause where the gap is, because hearing
     the sentence is exactly what does not help here and the child has to look.
     ========================================================================== */

  function startHomophones(world){
    var pool = dealBand(world.id, HOMOPHONES, 8);
    wordRound(world, 8, function(i){
      var it = pool[i];
      return {prompt:"Which word fits the gap?", subject:it.q, small:true,
        a:it.a, x:it.x, speak:it.q.replace("___", "..."),
        after:it.q.replace("___", it.a)};
    });
  }

  /* ==========================================================================
     Light It Up
     --------------------------------------------------------------------------
     P4 electricity, drawn rather than described. A circuit is shown and the
     child says whether the bulb lights. The four ways it fails are the four
     the paper asks about: a break, a dead cell, a plastic gap, and a short
     across the bulb.
     ========================================================================== */

  var CIRCUIT_FAULTS = [
    {k:"ok",     lit:true,  why:"A complete loop, a working cell and a metal gap-filler."},
    {k:"break",  lit:false, why:"There is a break in the wire, so the loop is not complete."},
    {k:"cell",   lit:false, why:"The cell is dead, so nothing pushes the current round."},
    {k:"plastic",lit:false, why:"Plastic does not conduct, so the loop is broken."},
    {k:"metal",  lit:true,  why:"The gap is bridged by metal, which conducts."},
    {k:"short",  lit:false, why:"The wire goes straight across the bulb, so the current misses it."}
  ];

  function circuitBoard(f){
    var g = board(300, 190, 380);
    var wire = "#4A4370", live = f.lit ? "#FFC53D" : "#8E88B8";
    /* The loop itself. */
    g.appendChild(sv("rect",{x:34,y:30,width:232,height:128,rx:12,fill:"none",
      stroke:wire,"stroke-width":7}));
    /* Cell on the left edge. */
    g.appendChild(sv("rect",{x:20,y:74,width:28,height:42,rx:5,
      fill: f.k === "cell" ? "#6E6890" : "#57C08A", stroke:"#2B2560","stroke-width":3}));
    g.appendChild(label(34, 130, f.k === "cell" ? "flat" : "1.5V", 11, "#C9C4EE"));
    /* Bulb at the top. */
    g.appendChild(sv("circle",{cx:150,cy:30,r:21,fill:live,stroke:"#2B2560","stroke-width":4}));
    if(f.lit){
      g.appendChild(sv("circle",{cx:150,cy:30,r:31,fill:"#FFC53D",opacity:"0.28"}));
      g.appendChild(sv("circle",{cx:150,cy:30,r:41,fill:"#FFC53D",opacity:"0.13"}));
    }
    g.appendChild(sv("path",{d:"M141 30 L147 22 L153 38 L159 30",fill:"none",
      stroke:"#8A5A00","stroke-width":3}));
    /* Whatever is wrong with it. */
    if(f.k === "break"){
      g.appendChild(sv("rect",{x:196,y:150,width:28,height:16,fill:"#1C1840"}));
      g.appendChild(label(210, 182, "gap", 12, "#FF9AA2"));
    }
    if(f.k === "plastic" || f.k === "metal"){
      g.appendChild(sv("rect",{x:120,y:148,width:60,height:20,rx:5,
        fill: f.k === "metal" ? "#C9CEDA" : "#E86BA0", stroke:"#2B2560","stroke-width":3}));
      g.appendChild(label(150, 184, f.k === "metal" ? "steel rod" : "plastic rod", 12, "#C9C4EE"));
    }
    if(f.k === "short"){
      g.appendChild(sv("line",{x1:110,y1:30,x2:190,y2:30,stroke:wire,"stroke-width":7}));

  /* Division facts, the other half of the times tables Table Tower already
     covers — generated fresh each round rather than from a fixed list, the
     same way Number Rally and Maths Quest make up their own sums. */
  function startDivision(world){
    var b = band();
    var divisors = b <= 1 ? [1,2,3,4,5] : b === 2 ? [2,3,4,5,6,8,10] : [3,4,6,7,8,9,11,12];
    var maxQ = b <= 1 ? 5 : b === 2 ? 10 : 12;
    var rounds = 8;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;
    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var divisor = divisors[Math.floor(Math.random() * divisors.length)];
      var quotient = 1 + Math.floor(Math.random() * maxQ);
      var dividend = divisor * quotient;
      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:"Divide it evenly"}));
      shell.stage.appendChild(el("div",{"class":"bigq", text: dividend + " ÷ " + divisor + " = ?"}));
      speak(dividend + " divided by " + divisor + "?");
      /* A small quotient (1 or 2) has too few distinct nearby positive
         numbers for a random-offset guess to reliably find three, so the
         candidate pool is built once and picked from rather than retried. */
      var pool = [];
      for(var off = -4; off <= 4; off++){
        var d = quotient + off;
        if(d > 0 && d !== quotient) pool.push(d);
      }
      var wrongs = shuffle(pool).slice(0, 3);
      shell.stage.appendChild(choiceGrid(shuffle([quotient].concat(wrongs)), quotient, function(ok){
        if(ok){ correct++; sfx.good(); flash("⭐"); } else { sfx.bad(); }
        markDot(shell.dots, i, ok);
        i++;
        setTimeout(next, ok ? 800 : 1300);
      }, false));
    }
    next();
  }

  /* Number-sequence rules — the arithmetic sibling of Pattern Train's shape
     sequences, generated fresh each round the same way. */
  function startPatternRule(world){
    var b = band();
    var rounds = 8;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;
    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var kind = b <= 2 || Math.random() < 0.6 ? "add" : (Math.random() < 0.5 ? "sub" : "mul");
      var start, step, seq = [], next4;
      if(kind === "add"){
        step = 1 + Math.floor(Math.random() * (b <= 1 ? 3 : b === 2 ? 5 : 9));
        start = 1 + Math.floor(Math.random() * 10);
        seq = [start, start + step, start + step * 2, start + step * 3];
        next4 = start + step * 4;
      } else if(kind === "sub"){
        step = 1 + Math.floor(Math.random() * 6);
        start = 30 + Math.floor(Math.random() * 40);
        seq = [start, start - step, start - step * 2, start - step * 3];
        next4 = start - step * 4;
      } else {
        step = 2 + Math.floor(Math.random() * 2);
        start = 1 + Math.floor(Math.random() * 4);
        seq = [start, start * step, start * step * step, start * step * step * step];
        next4 = start * Math.pow(step, 4);
      }
      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:"Find the rule, then the next number"}));
      shell.stage.appendChild(el("div",{"class":"bigq", style:"font-size:clamp(24px,6vw,38px)",
        text: seq.join(", ") + ", ?"}));
      speak(seq.join(", ") + ", what comes next?");
      var magnitude = Math.max(1, Math.round(Math.abs(next4 - seq[3]) * 0.3));
      var pool = [];
      [-3, -2, -1, 1, 2, 3].forEach(function(off){
        var d = next4 + off * magnitude;
        if(d > 0 && d !== next4 && pool.indexOf(d) < 0) pool.push(d);
      });
      var wrongs = shuffle(pool).slice(0, 3);
      shell.stage.appendChild(choiceGrid(shuffle([next4].concat(wrongs)), next4, function(ok){
        if(ok){ correct++; sfx.good(); flash("⭐"); } else { sfx.bad(); }
        markDot(shell.dots, i, ok);
        i++;
        var explain = kind === "add" ? ("Each number goes up by " + step + ": " + seq[3] + " + " + step + " = " + next4)
          : kind === "sub" ? ("Each number goes down by " + step + ": " + seq[3] + " − " + step + " = " + next4)
          : ("Each number is multiplied by " + step + ": " + seq[3] + " × " + step + " = " + next4);
        shell.stage.appendChild(el("div",{"class":"fact", text:"💡 " + explain}));
        speak(explain);
        afterSpeech(next, 1200);
      }, false));
    }
    next();
  }

  /* A shape/emoji repeating pattern rather than a numeric one — the logic
     skill of spotting a repeat unit, not the arithmetic of Pattern Rule. */
  var SEQUENCE_SETS = [
    ["🔴","🔵"], ["🟩","🟨","🟦"], ["⭐","🌙"], ["🐱","🐶","🐭"],
    ["🔺","🔻"], ["🍎","🍌"], ["🟢","🟣","🟠"], ["🌞","🌧️"]
  ];
  function startSequence(world){
    var rounds = 8;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;
    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var set = SEQUENCE_SETS[Math.floor(Math.random() * SEQUENCE_SETS.length)];
      var repeats = 3;
      var seq = [];
      for(var r = 0; r < repeats; r++) seq = seq.concat(set);
      var answer = set[0];
      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:"What comes next in the pattern?"}));
      shell.stage.appendChild(el("div",{"class":"bigq", style:"font-size:clamp(26px,7vw,42px); letter-spacing:6px",
        text: seq.join(" ") + " ?"}));
      var others = SEQUENCE_SETS.filter(function(s){ return s !== set; });
      var wrongs = [];
      shuffle(others.slice()).forEach(function(s){
        if(wrongs.length < 3 && s[0] !== answer && wrongs.indexOf(s[0]) < 0) wrongs.push(s[0]);
      });
      while(wrongs.length < 3) wrongs.push(set[1 + wrongs.length % (set.length - 1 || 1)]);
      shell.stage.appendChild(choiceGrid(shuffle([answer].concat(wrongs.slice(0,3))), answer, function(ok){
        if(ok){ correct++; sfx.good(); flash("⭐"); } else { sfx.bad(); }
        markDot(shell.dots, i, ok);
        i++;
        setTimeout(next, ok ? 900 : 1400);
      }, false));
    }
    next();
  }

  /* ==========================================================================
     Read It Aloud / Read a Story / 朗读句子 / 朗读短文
     --------------------------------------------------------------------------
     Shows a sentence (or a short story), lets a child hear it once, then
     listens back through the browser's speech recognition and scores how
     much of it came through — a plain word-overlap score, not a linguistic
     pronunciation judge, which is enough to tell "read it" from "skipped
     it" without pretending to be more precise than it is.
     ========================================================================== */
  function scoreReading(target, heard, zh){
    function tokenize(s){
      s = String(s || "").toLowerCase().replace(/[.,!?;:'"“”，。!?;:、\s]+/g, zh ? "" : " ").trim();
      return zh ? s.split("") : s.split(/\s+/).filter(Boolean);
    }
    var t = tokenize(target), h = tokenize(heard);
    if(!t.length) return 0;
    var pool = h.slice(), hits = 0;
    t.forEach(function(tok){
      var idx = pool.indexOf(tok);
      if(idx >= 0){ hits++; pool.splice(idx, 1); }
    });
    return Math.round((hits / t.length) * 100);
  }

  function startReadAloud(world, opts){
    var rounds = Math.min(6, opts.items.length);
    var shell = gameShell(world, rounds);
    var order = dealBand(world.id, opts.items, rounds);
    var i = 0, correct = 0;

    if(!CAN_LISTEN){
      shell.stage.appendChild(el("div",{"class":"prompt", text:"This game needs a browser that can listen"}));
      shell.stage.appendChild(el("div",{"class":"bigq", style:"font-size:19px; max-width:420px; line-height:1.5",
        text:"Reading practice works best in Chrome or Edge. Try opening " + (location.hostname || "kayden.sg") + " there to play this one."}));
      var back = el("button",{"class":"btn btn-lg btn-go", text:"Choose another game"});
      back.addEventListener("click", function(){ sfx.tap(); renderHome(); });
      shell.stage.appendChild(back);
      return;
    }

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var it = order[i];
      var target = opts.text(it);
      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text: opts.prompt || "Read this out loud"}));
      shell.stage.appendChild(el("div",{"class":"read-passage", text:target}));
      if(opts.gloss) shell.stage.appendChild(el("div",{"class":"hintline", text:opts.gloss(it)}));
      var hear = el("button",{"class":"btn btn-ghost btn-sm", text:"🔊 Hear it first"});
      hear.addEventListener("click", function(){ sfx.tap(); speak(target, {lang:opts.lang}); });
      shell.stage.appendChild(hear);

      var mic = el("button",{"class":"mic-btn", "aria-label":"Tap to read", text:"🎙️"});
      var status = el("div",{"class":"hintline", text:"Tap the mic, then read it out loud"});
      shell.stage.appendChild(mic);
      shell.stage.appendChild(status);
      var skip = el("button",{"class":"linkbtn", text:"Skip this one"});
      shell.stage.appendChild(skip);

      var rec = new SpeechRec();
      rec.lang = opts.lang;
      /* continuous:false is supposed to stop on its own once the browser
         detects silence, but that detection is unreliable — some browsers
         wait much longer than a child actually pauses, or never fire it at
         all with background noise. So the mic doubles as a stop button: a
         second tap while listening calls stop(), which still hands back
         whatever was heard so far, rather than waiting on the browser. */
      rec.continuous = false;
      rec.interimResults = true;
      var done = false, listening = false, watchdog = null;

      /* stop()/abort() asking the browser to end listening is not the same
         as the browser actually doing it — some browsers never fire 'end'
         (or any event at all) afterwards, which used to leave the mic stuck
         showing "stop" forever with no way back. Every path that starts or
         stops listening now also arms a plain timer that forces the button
         back to a tappable state if the browser stays silent too long. */
      function clearWatchdog(){ if(watchdog){ clearTimeout(watchdog); watchdog = null; } }

      function setListening(on){
        listening = on;
        mic.classList.toggle("listening", on);
        mic.textContent = on ? "⏹️" : "🎙️";
        mic.setAttribute("aria-label", on ? "Tap to stop" : "Tap to read");
      }

      function finishRound(score){
        clearWatchdog();
        if(done) return;
        done = true;
        mic.disabled = true; skip.disabled = true;
        var passed = score >= 40;
        if(passed){ correct++; sfx.good(); flash("⭐"); } else { sfx.bad(); }
        status.textContent = (score >= 90 ? "Amazing reading!" : score >= 70 ? "Nice reading!"
          : score >= 40 ? "Good try!" : "Let's try that kind again soon.") + "  (" + score + "%)";
        markDot(shell.dots, i, passed);
        i++;
        afterSpeech(next, 2200);
      }

      mic.addEventListener("click", function(){
        if(mic.disabled) return;
        sfx.tap();
        clearWatchdog();
        if(listening){
          try{ rec.stop(); }catch(e){}
          watchdog = setTimeout(function(){ setListening(false); status.textContent = "Tap the mic to try again."; }, 1500);
          return;
        }
        setListening(true);
        status.textContent = "Listening… tap again when you're done";
        try{
          rec.start();
          watchdog = setTimeout(function(){
            try{ rec.abort(); }catch(e){}
            setListening(false);
            status.textContent = "Didn't catch that — tap the mic and try again.";
          }, 12000);
        }
        catch(e){ setListening(false); status.textContent = "Couldn't start listening — tap the mic to try again."; }
      });
      rec.addEventListener("result", function(e){
        var last = e.results[e.results.length - 1];
        var heard = last[0].transcript;
        if(!last.isFinal){ status.textContent = "Hearing: " + heard; return; }
        clearWatchdog();
        setListening(false);
        finishRound(scoreReading(target, heard, opts.lang === "zh-CN"));
      });
      rec.addEventListener("error", function(e){
        clearWatchdog();
        setListening(false);
        if(done) return;
        status.textContent = e.error === "not-allowed" || e.error === "service-not-allowed"
          ? "Microphone access is blocked — allow it in the browser to play this game."
          : e.error === "no-speech" ? "Didn't catch that — tap the mic and try again."
          : "Something went wrong listening — tap the mic to try again.";
      });
      rec.addEventListener("end", function(){
        clearWatchdog();
        setListening(false);
      });
      skip.addEventListener("click", function(){ sfx.tap(); clearWatchdog(); try{ rec.abort(); }catch(e){} finishRound(0); });
    }
    next();
  }

  /* Counts out loud, one badge per stroke, so a wrong guess still leaves the
     child having actually counted to the real number rather than just being
     told it. Ticks fast enough that even a 12-stroke character doesn't feel
     like a stall — about 2s at most before the short "N strokes" line and
     the next character. */
  function revealStrokeCount(stage, n, onDone){
    var wrap = el("div",{"class":"strokecount"});
    stage.appendChild(wrap);
    var k = 0, stepMs = n > 8 ? 150 : 210;
    var timer = setInterval(function(){
      k++;
      wrap.appendChild(el("div",{"class":"strokebadge", text:String(k)}));
      if(k >= n){
        clearInterval(timer);
        setTimeout(onDone, 500);
      }
    }, stepMs);
  }
  function startZhStrokes(world){
    var pool = dealBand(world.id, ZH_STROKES, 8);
    var shell = gameShell(world, 8);
    var i = 0, correct = 0;
    function next(){

      shell.stage.appendChild(row);
      shell.stage.appendChild(el("div",{"class":"hintline", text:it.py + " — " + it.en}));
      speak(it.c, {lang:"zh-CN"});
      var qbox = el("div",{"class":"qbox"});
      shell.stage.appendChild(qbox);
      qbox.appendChild(choiceGrid(numberOptions(it.n, 3, 4).filter(function(n){ return n > 0; }),
        it.n, function(ok){
          if(ok){ correct++; sfx.good(); flash("⭐"); } else { sfx.bad(); }
          markDot(shell.dots, i, ok);
          i++;
          qbox.appendChild(el("div",{"class":"hintline", text:"Let's count together:"}));
          revealStrokeCount(qbox, it.n, function(){
            qbox.appendChild(el("div",{style:"font-weight:800; color:#FFD98A; margin-top:2px",
              text: it.c + " has " + it.n + " strokes"}));
            setTimeout(next, 900);
          });
        }, false));
    }
    next();

  /* ==========================================================================
     Table Tower
     --------------------------------------------------------------------------
     Times tables, which are learnt by repetition and nothing else. Every right
     answer stacks a block; a wrong one shakes the tower and the top block
     falls off. Nothing is ever lost below the ground floor.
     ========================================================================== */

  var TOWER_COLOURS = ["#F2A93B","#E8563C","#4AA8E8","#57C08A","#9C6BE8","#E85C9A","#2FB6E6","#FFD166"];

  function startTower(world){
    var b = band();
    var need = b <= 2 ? 8 : 10;
    /* The tables a child at this level is actually being tested on. Band 3
       covers P3 through P6, and every one of those had been getting the
       same 3-to-12-times-table facts a P3 child gets: a real complaint,
       since a P6 child answering "7 x 8" all day is not being tested on
       anything they have not known for three years. rankTier splits that
       one band by school level instead. */
    var tables = b <= 2 ? [2,3,4,5,10] : [3,4,6,7,8,9,11,12];
    var r = b === 3 ? rank() : -1;
    var rankTier = r >= 8 ? 3 : r === 7 ? 2 : r === 6 ? 1 : 0;   // P6 / P5 / P4 / P3-or-younger

    var shell = gameShell(world, need);
    var blocks = 0, asked = 0, correct = 0, over = false, missStreak = 0;

    shell.stage.appendChild(el("div",{"class":"prompt",
      text:"Every right answer adds a floor. Build " + need + " of them! " +
           "Two mistakes in a row and a floor falls off."}));

    var scene = el("div",{"class":"tower-scene"});
    var stack = el("div",{"class":"tower-stack"});
    var crane = el("div",{"class":"tower-crane", text:"👷"});
    scene.appendChild(crane); scene.appendChild(stack);
    scene.appendChild(el("div",{"class":"tower-ground"}));
    shell.stage.appendChild(scene);

    var qbox = el("div",{"class":"qbox"});
    shell.stage.appendChild(qbox);

    function addBlock(){
      var bl = el("div",{"class":"tower-block", text:"⭐"});
      bl.style.background = TOWER_COLOURS[blocks % TOWER_COLOURS.length];
      stack.insertBefore(bl, stack.firstChild);
      blocks++;
      crane.style.bottom = (52 + blocks * 34) + "px";
    }
    function dropBlock(){
      if(!stack.firstChild) return;
      var top = stack.firstChild;
      top.classList.add("falling");
      setTimeout(function(){ if(top.parentNode) top.parentNode.removeChild(top); }, 520);
      blocks = Math.max(0, blocks - 1);
      crane.style.bottom = (52 + blocks * 34) + "px";
      scene.classList.add("wobble");
      setTimeout(function(){ scene.classList.remove("wobble"); }, 500);
    }

    function nextQuestion(){
      if(over) return;
      qbox.textContent = "";
      var t = pick(tables);
      var other, ans, text;

      if(rankTier === 0){
        /* P3 and younger: the tables themselves, both ways round — a table
           is only half learnt until it can be read backwards. */
        other = ri(2, b <= 2 ? 10 : 12);
        var divide = b >= 3 && Math.random() < 0.4;
        if(divide){ ans = other; text = (t * other) + " ÷ " + t + " = ?"; }
        else { ans = t * other; text = t + " × " + other + " = ?"; }
      } else if(rankTier === 1){
        /* P4: the tables scaled to two digits, and by ten and a hundred —
           multiplying by a power of ten is that year's own new skill. */
        var byPower = Math.random() < 0.35;
        if(byPower){
          var pw = pick([10, 100]);
          ans = t * pw; text = t + " × " + pw + " = ?";
        } else {
          other = ri(11, 20);
          ans = t * other; text = t + " × " + other + " = ?";
        }
      } else if(rankTier === 2){
        /* P5: a two-digit number times a single digit, phrased the other
           way round from P4's, plus the odd two-digit-by-two-digit fact
           built from a table the child already has. */
        if(Math.random() < 0.5){
          other = ri(11, 25);
          ans = other * t; text = other + " × " + t + " = ?";
        } else {
          var tens = pick([10, 20, 30]) + t;      // e.g. 12, 23 — still one known table away
          other = ri(2, 9);
          ans = tens * other; text = tens + " × " + other + " = ?";
        }
      } else {
        /* P6: the missing factor, not the product — algebra dressed as a
           times table, and the genuine step up from every band below it. */
        var known = pick(tables);
        ans = ri(3, 15);
        var product = known * ans;
        text = "? × " + known + " = " + product;
      }
      asked++;

      qbox.appendChild(el("div",{"class":"bigq", text:text}));
      speak(text.replace("×"," times ").replace("÷"," divided by ").replace("= ?"," equals what")
        .replace("? ×", "blank times").replace(/= (\d+)$/, "equals $1"));
      qbox.appendChild(choiceGrid(numberOptions(ans, Math.max(2, Math.round(ans * 0.25)), 4), ans,
        function(ok){
          if(over) return;
          if(ok){
            correct++; missStreak = 0; addBlock(); sfx.pop(); rightAnswer();
            markDot(shell.dots, Math.min(blocks, need) - 1, true);
            if(blocks >= need){ over = true; setTimeout(function(){ finishTower(true); }, 700); return; }
          } else {
            /* One slip only shakes the tower. A child who is getting most of
               them right should still watch it grow, or the game is a
               treadmill and they stop playing it. */
            missStreak++;
            sfx.bad(); wrongAnswer();
            if(missStreak >= 2){ dropBlock(); missStreak = 0; }
            else {
              scene.classList.add("wobble");
              setTimeout(function(){ scene.classList.remove("wobble"); }, 500);
            }
          }
          setTimeout(nextQuestion, ok ? 480 : 900);
        }, false));

      /* A tower that can never be finished is not a game: after a generous
         number of tries we stop and score what was built. */
      if(asked > need * 4){ over = true; setTimeout(function(){ finishTower(false); }, 400); }
    }

    function finishTower(won){
      music.stop();
      if(won){ sfx.win(); confettiBurst(110); }
      var box = el("div",{"class":"result"});
      box.appendChild(el("div",{"class":"stars-big", text: won ? "🏙️" : "🏗️"}));
      box.appendChild(el("div",{"class":"score display",
        text: won ? "Tower finished!" : blocks + " floors built"}));
      box.appendChild(el("div",{style:"font-weight:800; color:#C9C4EE; font-size:16px",
        text: correct + " right out of " + asked}));
      award(world.id, won ? 3 : blocks >= need * 0.7 ? 2 : blocks >= need * 0.4 ? 1 : 0,
        won || blocks >= need * 0.7);
      var again = el("button",{"class":"btn btn-lg btn-go", style:"min-width:240px", text:"Build again"});
      again.addEventListener("click", function(){ sfx.tap(); startTower(world); });
      var home = el("button",{"class":"btn btn-lg btn-ghost", style:"min-width:240px", text:"Choose another game"});
      home.addEventListener("click", function(){ sfx.tap(); renderHome(); });
      box.appendChild(again); box.appendChild(home);
      show(box);
    }

    nextQuestion();
  }

  /* ==========================================================================
     Joystick Boss Battle
     --------------------------------------------------------------------------
     Designed by Kayden Bang (Mee Toh Primary School): the fight pauses on
     every sum. Get it right and you land a shot on Dal, then the fight
     unpauses — Dal moves and fires back while you dodge with the joystick,
     until the next sum pauses it again. Dal has 200 HP and takes 20 damage
     per correct answer, ten in a row wins. The player has 15 HP and loses 1
     for every shot that lands.
     ========================================================================== */
  var KB_BOSS_SVG =
    '<svg viewBox="0 0 120 100" width="72" height="60">' +
    '<circle cx="60" cy="42" r="26" fill="#3A2361" stroke="#fff" stroke-width="3"/>' +
    '<line x1="42" y1="30" x2="54" y2="37" stroke="#fff" stroke-width="4" stroke-linecap="round"/>' +
    '<line x1="78" y1="30" x2="66" y2="37" stroke="#fff" stroke-width="4" stroke-linecap="round"/>' +
    '<circle cx="50" cy="44" r="3.5" fill="#fff"/>' +
    '<circle cx="70" cy="44" r="3.5" fill="#fff"/>' +
    '<path d="M46 58 Q60 50 74 58" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>' +
    '<rect x="2" y="30" width="22" height="22" rx="5" fill="#fff"/>' +
    '<line x1="24" y1="41" x2="36" y2="41" stroke="#fff" stroke-width="5"/>' +
    '<rect x="96" y="30" width="22" height="22" rx="5" fill="#fff"/>' +
    '<line x1="84" y1="41" x2="96" y2="41" stroke="#fff" stroke-width="5"/>' +
    '</svg>';
  var KB_PLAYER_SVG =
    '<svg viewBox="0 0 64 84" width="40" height="54">' +
    '<circle cx="32" cy="14" r="10" fill="none" stroke="#fff" stroke-width="4"/>' +
    '<line x1="32" y1="24" x2="32" y2="54" stroke="#fff" stroke-width="4"/>' +
    '<line x1="32" y1="34" x2="12" y2="28" stroke="#fff" stroke-width="4" stroke-linecap="round"/>' +
    '<line x1="32" y1="34" x2="52" y2="40" stroke="#fff" stroke-width="4" stroke-linecap="round"/>' +
    '<rect x="50" y="36" width="14" height="7" rx="1.5" fill="#fff"/>' +
    '<line x1="32" y1="54" x2="18" y2="78" stroke="#fff" stroke-width="4" stroke-linecap="round"/>' +
    '<line x1="32" y1="54" x2="46" y2="78" stroke="#fff" stroke-width="4" stroke-linecap="round"/>' +
    '</svg>';

  function joyBossSum(b, level){
    var spread = b === 0 ? 6 : b === 1 ? 10 : b === 2 ? (16 + level * 4) : (24 + level * 6);
    var a = ri(1, spread), c = ri(1, spread);
    return {a: a, c: c, ans: a + c};
  }

  function startJoyBoss(world){
    var b = band(), level = Math.max(1, levelOf(world.id));
    var need = 10;
    var dalHp = 200, dalMax = 200, dmgToBoss = 20;
    var playerHp = 15, playerMax = 15;
    var correct = 0, over = false, phase = "question", invincible = false;
    var PLAYER_SPEED = 130, DAL_SPEED = 70, BOLT_SPEED = 150;
    var PLAYER_HW = 20, PLAYER_HH = 27, BOSS_HW = 36, BOSS_HH = 30, HIT_RADIUS = 20;

    function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

    var shell = gameShell(world, need);
    shell.stage.appendChild(el("div",{"class":"byline",
      text:"🎮 Created by Kayden Bang, Mee Toh Primary School"}));
    shell.stage.appendChild(el("div",{"class":"prompt",
      text:"Answer the sum to fire at Dal — then dodge with the joystick!"}));

    var dalRow = el("div",{"class":"kb-hprow"});
    dalRow.appendChild(el("div",{"class":"f-name", style:"min-width:64px", text:"Dal"}));
    var dalBarOuter = el("div",{"class":"hpbar"});
    var dalBar = el("div",{"class":"hpfill foehp"});
    dalBarOuter.appendChild(dalBar);
    dalRow.appendChild(dalBarOuter);
    var dalHpTxt = el("div",{"class":"hptxt", text:dalHp + " / " + dalMax});
    dalRow.appendChild(dalHpTxt);
    shell.stage.appendChild(dalRow);

    var youRow = el("div",{"class":"kb-hprow"});
    youRow.appendChild(el("div",{"class":"f-name", style:"min-width:64px", text:(state.name || "You")}));
    var youBarOuter = el("div",{"class":"hpbar"});
    var youBar = el("div",{"class":"hpfill mehp"});
    youBarOuter.appendChild(youBar);
    youRow.appendChild(youBarOuter);
    var youHpTxt = el("div",{"class":"hptxt", text:playerHp + " / " + playerMax});
    youRow.appendChild(youHpTxt);
    shell.stage.appendChild(youRow);

    var field = el("div",{"class":"kb-field paused"});
    shell.stage.appendChild(field);

    var dalSprite = el("div",{"class":"kb-sprite"});
    dalSprite.innerHTML = KB_BOSS_SVG;
    field.appendChild(dalSprite);

    var playerSprite = el("div",{"class":"kb-sprite"});
    playerSprite.innerHTML = KB_PLAYER_SVG;
    field.appendChild(playerSprite);

    var controls = el("div",{"class":"kb-controls"});
    var stickWrap = el("div",{"class":"kb-base"});
    var knob = el("div",{"class":"kb-knob"});
    stickWrap.appendChild(knob);
    controls.appendChild(stickWrap);
    var qwrap = el("div",{"class":"kb-qwrap"});
    controls.appendChild(qwrap);
    shell.stage.appendChild(controls);

    /* ---- movement input: joystick + arrow/WASD keys ---- */
    var joyVec = {x:0, y:0}, keyVec = {x:0, y:0}, activePointerId = null;
    function moveStick(e){
      var r = stickWrap.getBoundingClientRect();
      var dx = e.clientX - (r.left + r.width / 2);
      var dy = e.clientY - (r.top + r.height / 2);
      var dist = Math.sqrt(dx * dx + dy * dy);
      var max = r.width / 2 - 19;
      if(dist > max && dist > 0){ dx = dx / dist * max; dy = dy / dist * max; }
      knob.style.transform = "translate(" + dx + "px," + dy + "px)";
      joyVec.x = max ? dx / max : 0;
      joyVec.y = max ? dy / max : 0;
    }
    function endStick(e){
      if(e.pointerId !== activePointerId) return;
      activePointerId = null;
      joyVec.x = 0; joyVec.y = 0;
      knob.style.transform = "translate(0px,0px)";
    }
    stickWrap.addEventListener("pointerdown", function(e){
      activePointerId = e.pointerId;
      try{ stickWrap.setPointerCapture(e.pointerId); }catch(err){}
      moveStick(e);
    });
    stickWrap.addEventListener("pointermove", function(e){
      if(e.pointerId !== activePointerId) return;
      moveStick(e);
    });
    stickWrap.addEventListener("pointerup", endStick);
    stickWrap.addEventListener("pointercancel", endStick);

    function onKeyDown(e){
      if(e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keyVec.x = -1;
      else if(e.key === "ArrowRight" || e.key === "d" || e.key === "D") keyVec.x = 1;
      else if(e.key === "ArrowUp" || e.key === "w" || e.key === "W") keyVec.y = -1;
      else if(e.key === "ArrowDown" || e.key === "s" || e.key === "S") keyVec.y = 1;
    }
    function onKeyUp(e){
      if((e.key === "ArrowLeft" || e.key === "a" || e.key === "A") && keyVec.x < 0) keyVec.x = 0;
      else if((e.key === "ArrowRight" || e.key === "d" || e.key === "D") && keyVec.x > 0) keyVec.x = 0;
      else if((e.key === "ArrowUp" || e.key === "w" || e.key === "W") && keyVec.y < 0) keyVec.y = 0;
      else if((e.key === "ArrowDown" || e.key === "s" || e.key === "S") && keyVec.y > 0) keyVec.y = 0;
    }
    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("keyup", onKeyUp);
    var listenersOff = false;
    function offListeners(){
      if(listenersOff) return;
      listenersOff = true;
      window.removeEventListener("keydown", onKeyDown);
      window.removeEventListener("keyup", onKeyUp);
    }

    /* ---- arena geometry & sprites ---- */
    var fieldW = 0, fieldH = 0;
    var playerPos = {x:0, y:0}, dalPos = {x:0, y:0}, dalTarget = {x:0, y:0};
    var bolts = [];
    function updateFieldGeom(){
      var r = field.getBoundingClientRect();
      fieldW = r.width || 300; fieldH = r.height || 220;
    }
    function placeSprites(){
      updateFieldGeom();
      playerPos.x = fieldW / 2; playerPos.y = fieldH - 34;
      dalPos.x = fieldW / 2; dalPos.y = 56;
      dalTarget.x = dalPos.x; dalTarget.y = dalPos.y;
      renderSprites();
    }
    function renderSprites(){
      playerSprite.style.transform = "translate(" + (playerPos.x - PLAYER_HW) + "px," + (playerPos.y - PLAYER_HH) + "px)";
      dalSprite.style.transform = "translate(" + (dalPos.x - BOSS_HW) + "px," + (dalPos.y - BOSS_HH) + "px)";
    }
    window.addEventListener("resize", updateFieldGeom);
    setTimeout(placeSprites, 0);

    function clearBolts(){
      bolts.forEach(function(bo){ if(bo.el.parentNode) bo.el.parentNode.removeChild(bo.el); });
      bolts = [];
    }
    function spawnBolt(){
      var dx = playerPos.x - dalPos.x, dy = playerPos.y - dalPos.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      var boltEl = el("div",{"class":"kb-bolt"});
      field.appendChild(boltEl);
      bolts.push({x:dalPos.x, y:dalPos.y, vx:dx / d * BOLT_SPEED, vy:dy / d * BOLT_SPEED, el:boltEl});
    }
    function fireAtBoss(){
      var f = el("div",{"class":"kb-fire"});
      f.style.transform = "translate(" + (playerPos.x - 4) + "px," + (playerPos.y - 4) + "px)";
      field.appendChild(f);
      requestAnimationFrame(function(){
        f.style.transition = "transform .28s linear";
        f.style.transform = "translate(" + (dalPos.x - 4) + "px," + (dalPos.y - 4) + "px)";
      });
      setTimeout(function(){
        if(f.parentNode) f.parentNode.removeChild(f);
        dalSprite.classList.add("hurt");
        setTimeout(function(){ dalSprite.classList.remove("hurt"); }, 400);
      }, 290);
    }
