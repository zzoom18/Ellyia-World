    next();
  }

  /* ==========================================================================
     华文 Chinese

     Singapore children learn Chinese alongside English from Nursery, so it
     gets its own subject rather than being folded into English. The four games
     cover what the MOE primary syllabus asks for first: recognising a
     character, reading its 拼音, the numerals, and joining two characters into
     a word.

     Characters are shown large — a child reading 医 at 14px learns nothing —
     and the meaning is always in English so a parent who does not read Chinese
     can still help.
     ========================================================================== */

  /* Characters at this child's band, with the nearest ones as backup so the
     game never runs thin at the edges of a bank. */
  function zhPool(){ return forBand(ZH_CHARS, band()); }

  function zhCharCard(ch, size){
    return el("div",{"class":"zh-char", style: size ? "font-size:" + size : ""}, ch);
  }

  /* ---------- 看图认字 Picture & Character ---------- */
  function startZhPic(world){
    var pool = zhPool(), rounds = 8;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;
    var order = deal(world.id, pool, keyer(), rounds);

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var right = order[i];
      var others = shuffle(pool.filter(function(x){ return x.c !== right.c; })).slice(0, 3);
      /* Half the rounds go the other way round: picture first, then character.
         Reading a character and recalling one are different skills. */
      var charFirst = i % 2 === 0;

      shell.stage.textContent = "";
      if(charFirst){
        shell.stage.appendChild(el("div",{"class":"prompt", text:"这是什么？"}));
        /* Chinese is a spoken language first. The device's Mandarin voice
           reads the character, slowly, and will say it again on tap. */
        var crow = el("div",{"class":"sayrow"});
        crow.appendChild(zhCharCard(right.c));
        var csay = sayButton(right.c, {lang:"zh-CN", rate:0.72});
        if(csay) crow.appendChild(csay);
        shell.stage.appendChild(crow);
        shell.stage.appendChild(el("div",{"class":"zh-pinyin", text:right.p}));
        speak(right.c, {lang:"zh-CN", rate:0.72});
        shell.stage.appendChild(choiceGrid(
          shuffle([right].concat(others)).map(function(x){ return {label:x.e, value:x.e}; }),
          right.e, done, true));
      } else {
        shell.stage.appendChild(el("div",{"class":"prompt", text:"哪个字是这个意思？"}));
        shell.stage.appendChild(el("div",{"class":"bigq", text:right.e}));
        shell.stage.appendChild(el("div",{"class":"zh-pinyin", text:right.m}));
        shell.stage.appendChild(choiceGrid(
          shuffle([right].concat(others)).map(function(x){ return {label:x.c, value:x.c}; }),
          right.c, done, false, true));
      }

      function done(ok){
        if(ok){ correct++; rightAnswer(); flash("⭐"); } else { wrongAnswer(); }
        markDot(shell.dots, i, ok);
        if(!ok) say(right.c + "  " + right.p + "  —  " + right.m);
        i++;
        setTimeout(next, ok ? 620 : 1400);
      }
      function say(t){
        shell.stage.appendChild(el("div",{"class":"zh-tell", text:t}));
      }
    }
    next();
  }

  /* ---------- 拼音 Pinyin Match ---------- */
  function startZhPinyin(world){
    var pool = zhPool(), rounds = 8;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;
    var order = deal(world.id, pool, keyer(), rounds);

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var right = order[i];
      /* Wrong answers are drawn from other characters, so they are real pinyin
         a child might confuse it with rather than nonsense syllables. */
      var others = shuffle(pool.filter(function(x){ return x.p !== right.p; })).slice(0, 3);

      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:"这个字怎么读？"}));
      var prow = el("div",{"class":"sayrow"});
      prow.appendChild(zhCharCard(right.c));
      var psay = sayButton(right.c, {lang:"zh-CN", rate:0.72});
      if(psay) prow.appendChild(psay);
      shell.stage.appendChild(prow);
      shell.stage.appendChild(el("div",{"class":"zh-pinyin", text:right.e + "  " + right.m}));
      speak(right.c, {lang:"zh-CN", rate:0.72});
      shell.stage.appendChild(choiceGrid(
        shuffle([right].concat(others)).map(function(x){ return {label:x.p, value:x.p}; }),
        right.p, function(ok){
          if(ok){ correct++; rightAnswer(); flash("⭐"); } else { wrongAnswer(); }
          markDot(shell.dots, i, ok);
          i++;
          setTimeout(next, ok ? 620 : 1050);
        }, false));
    }
    next();
  }

  /* ---------- 数字 Chinese Numbers ---------- */
  function startZhNumbers(world){
    var pool = forBand(ZH_NUMBERS, band()), rounds = 8;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;
    var order = dealBand(world.id, ZH_NUMBERS, rounds);

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var right = order[i];
      var others = shuffle(pool.filter(function(x){ return x.n !== right.n; })).slice(0, 3);
      var toNumber = i % 2 === 0;

      shell.stage.textContent = "";
      if(toNumber){
        shell.stage.appendChild(el("div",{"class":"prompt", text:"这是数字几？"}));
        var nrow = el("div",{"class":"sayrow"});
        nrow.appendChild(zhCharCard(right.c, right.c.length > 2 ? "64px" : ""));
        var nsay = sayButton(right.c, {lang:"zh-CN", rate:0.72});
        if(nsay) nrow.appendChild(nsay);
        shell.stage.appendChild(nrow);
        shell.stage.appendChild(el("div",{"class":"zh-pinyin", text:right.p}));
        speak(right.c, {lang:"zh-CN", rate:0.72});
        shell.stage.appendChild(choiceGrid(
          shuffle([right].concat(others)).map(function(x){ return {label:String(x.n), value:String(x.n)}; }),
          String(right.n), done, false));
      } else {
        shell.stage.appendChild(el("div",{"class":"prompt", text:"哪一个是这个数字？"}));
        shell.stage.appendChild(el("div",{"class":"bigq", text:String(right.n)}));
        shell.stage.appendChild(choiceGrid(
          shuffle([right].concat(others)).map(function(x){ return {label:x.c, value:x.c}; }),
          right.c, done, false, true));
      }
      function done(ok){
        if(ok){ correct++; rightAnswer(); flash("⭐"); } else { wrongAnswer(); }
        markDot(shell.dots, i, ok);
        i++;
        setTimeout(next, ok ? 620 : 1050);
      }
    }
    next();
  }

  /* ---------- 词语 Make a Word ---------- */
  /* Two characters, one word. The child sees the picture and the first half,
     and picks the character that completes it. */
  function startZhWords(world){
    var pool = forBand(ZH_WORDS, band()), rounds = 8;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;
    var order = dealBand(world.id, ZH_WORDS, rounds);
    var allSecond = ZH_WORDS.map(function(x){ return x.z; });

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var right = order[i];
      var wrongs = shuffle(allSecond.filter(function(z){ return z !== right.z; }));
      var seen = {}, opts = [];
      wrongs.forEach(function(z){ if(!seen[z] && opts.length < 3){ seen[z] = 1; opts.push(z); } });

      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:"完成这个词语"}));
      shell.stage.appendChild(el("div",{"class":"bigq", text:right.e}));
      shell.stage.appendChild(el("div",{"class":"zh-build"},
        el("span",{"class":"zh-slot", text:right.a}),
        el("span",{"class":"zh-slot blank", text:"？"})));
      shell.stage.appendChild(el("div",{"class":"zh-pinyin", text:right.p + "  —  " + right.m}));
      shell.stage.appendChild(choiceGrid(
        shuffle([right.z].concat(opts)).map(function(z){ return {label:z, value:z}; }),
        right.z, function(ok){
          if(ok){ correct++; rightAnswer(); flash("⭐"); } else { wrongAnswer(); }
          markDot(shell.dots, i, ok);
          if(!ok) shell.stage.appendChild(el("div",{"class":"zh-tell", text: right.w + "  " + right.p}));
          i++;
          /* Right or wrong, the whole word is read out — that is the bit
             worth remembering, so the next word waits for it to finish
             rather than talking over it. */
          setTimeout(function(){
            speak(right.w, {lang:"zh-CN", rate:0.72});
            afterSpeech(next, ok ? 620 : 1400);
          }, 240);
        }, false, true));
    }
    next();
  }

  /* ==========================================================================
     Two-player games

     These are the only games in here without a right answer that belongs to
     one child. Two children share one iPad: the head-to-head pair put the
     tablet flat on the table and turn the far player's half upside down, and
     the take-turns pair are read the right way up by both.

     Questions come from the same banks and the same school level as the solo
     games, so a P3 child playing a P3 parent gets P3 sums. Nothing here is
     scored against the child's own stars — a duel is for fun, and losing to
     a big sister should never cost anybody a level.
     ========================================================================== */

  function duoNames(){
    var mine = (state.name || "Player 1").slice(0, 12);
    return [mine, "Player 2"];
  }

  /* The shell both duel games share: two coloured halves facing each other,
     a thin score strip between them, and a way back to the games. */
  function duoShell(world, target){
    var names = duoNames();
    var wrap = el("div",{style:"flex:1; min-height:0; display:flex; flex-direction:column"});
    var bar = el("div",{"class":"gamebar"});
    var back = el("button",{"class":"iconbtn","aria-label":"Back to the games", text:"←"});
    back.addEventListener("click", function(){ sfx.tap(); renderHome(); });
    bar.appendChild(back);
    bar.appendChild(el("div",{"class":"dots"}));
    bar.appendChild(el("div",{"class":"tally"}, world.emo, el("b",{text:"First to " + target})));
    wrap.appendChild(bar);

    var duo = el("div",{"class":"duo"});
    var top = el("div",{"class":"duo-half duo-b flip"});
    var mid = el("div",{"class":"duo-mid"});
    var bottom = el("div",{"class":"duo-half duo-a"});
    duo.appendChild(top); duo.appendChild(mid); duo.appendChild(bottom);
    wrap.appendChild(duo);
    show(wrap);
    return {top:top, bottom:bottom, mid:mid, names:names};
  }

  /* Halves are filled the same way for both players, so one function does it. */
  function duoRound(half, name, question, onAnswer){
    half.textContent = "";
    half.classList.remove("dim");
    half.appendChild(el("div",{"class":"duo-name", text:name}));
    half.appendChild(el("div",{"class":"duo-q", text:question.q}));
    var opts = el("div",{"class":"duo-opts"});
    var used = false;
    question.opts.forEach(function(o){
      var label = String(o && o.label != null ? o.label : o);
      var value = String(o && o.value != null ? o.value : o);
      var b = el("button",{"class":"duo-opt", text:label});
      b.addEventListener("click", function(){
        if(used) return;
        var ok = value === String(question.a);
        if(ok){
          used = true;
          b.classList.add("right");
        } else {
          /* A wrong tap costs you the round rather than ending the game —
             tapping wildly should not be the winning strategy. */
          b.classList.add("wrong");
          b.disabled = true;
        }
        onAnswer(ok, b);
      });
      opts.appendChild(b);
    });
    half.appendChild(opts);
    return {lock:function(){ used = true; }};
  }

  function duoScore(mid, names, a, b, note){
    mid.textContent = "";
    mid.appendChild(el("span",{}, names[1] + " ", el("b",{text:String(b)})));
    mid.appendChild(el("span",{"class":"duo-banner", text: note || "⚔️"}));
    mid.appendChild(el("span",{}, names[0] + " ", el("b",{text:String(a)})));
  }

  function duoFinish(world, names, a, b){
    music.stop();
    sfx.win();
    var winner = a === b ? null : (a > b ? names[0] : names[1]);
    var wrap = el("div",{"class":"result"});
    wrap.appendChild(el("div",{"class":"stars-big", text: winner ? "🏆" : "🤝"}));
    wrap.appendChild(el("div",{"class":"score display", text: winner ? winner + " wins!" : "It's a draw!"}));
    wrap.appendChild(el("div",{"class":"score display", style:"font-size:22px",
      text: names[0] + " " + a + "  ·  " + names[1] + " " + b}));
    wrap.appendChild(el("div",{style:"font-weight:800; color:#C9C4EE; font-size:16px",
      text: winner ? "Good game, both of you. Best of three?" : "Dead level — you will have to play again."}));
    var again = el("button",{"class":"btn btn-lg btn-go", style:"min-width:240px", text:"Play again"});
    again.addEventListener("click", function(){ sfx.tap(); startGame(world); });
    var home = el("button",{"class":"btn btn-lg btn-ghost", style:"min-width:240px", text:"Choose another game"});
    home.addEventListener("click", function(){ sfx.tap(); renderHome(); });
    wrap.appendChild(again); wrap.appendChild(home);
    show(wrap);
  }

  /* ---------- the duel engine, shared by Maths Duel and Word Duel ---------- */
  function runDuel(world, target, makeQuestion){
    var shell = duoShell(world, target);
    var a = 0, b = 0, over = false;

    function round(){
      if(over) return;
      var q = makeQuestion();
      var claimed = false;
      duoScore(shell.mid, shell.names, a, b, "Ready…");
      setTimeout(function(){ if(!over) duoScore(shell.mid, shell.names, a, b, "GO!"); }, 450);

      function settle(who, ok){
        if(!ok){ sfx.bad(); return; }
        if(claimed) return;
        claimed = true;
        sfx.good(); flash("⭐");
        if(who === 0){ a++; } else { b++; }
        var name = shell.names[who];
        duoScore(shell.mid, shell.names, a, b, name + " gets it!");
        shell.top.classList.toggle("dim", who === 0);
        shell.bottom.classList.toggle("dim", who === 1);
        bottomCtl.lock(); topCtl.lock();
        setTimeout(function(){
          if(a >= target || b >= target){ over = true; duoFinish(world, shell.names, a, b); }
          else round();
        }, 1000);
      }

      var bottomCtl = duoRound(shell.bottom, shell.names[0], q, function(ok){ settle(0, ok); });
      var topCtl    = duoRound(shell.top,    shell.names[1], q, function(ok){ settle(1, ok); });
    }
    round();
  }

  /* ---------- Maths Duel ---------- */
  function startDuoMaths(world){
    var b = band(), level = Math.max(1, levelOf("numbers"));
    runDuel(world, 5, function(){
      var q = numberQuestion(b, level);
      /* numberQuestion can hand back a counting picture instead of a sum, and
         the missing-number kind already carries its own "=". A duel needs one
         short line both children can read at a glance, with no second "= ?"
         stuck on the end of one that has one already. */
      return {q: qLine(q), a:q.a, opts:q.opts};
    });
  }

  /* ---------- Word Duel ---------- */
  function startDuoWord(world){
    var b = band();
    runDuel(world, 5, function(){
      /* Youngest: which picture starts with this letter. Older: rhymes, then
         the odd word out — the same skills as the solo English games. */
      if(b === 0 || (b === 1 && Math.random() < .5)){
        var right = pick(PICS);
        var letter = right.w.charAt(0);
        var others = shuffle(PICS.filter(function(x){ return x.w.charAt(0) !== letter; })).slice(0,3);
        return {q:"Starts with " + letter.toUpperCase() + "?", a:right.e,
          opts:shuffle([right].concat(others)).map(function(x){ return {label:x.e, value:x.e}; })};
      }
      if(Math.random() < .5){
        var fam = pick(RHYMES);
        var seed = pick(fam);
        var mate = pick(fam.filter(function(x){ return x.w !== seed.w; })) || fam[0];
        var pool = [];
        RHYMES.forEach(function(f){ if(f !== fam) pool = pool.concat(f); });
        var wrong = shuffle(pool).slice(0,3);
        return {q:"Rhymes with " + seed.w + "?", a:mate.w,
          opts:shuffle([mate].concat(wrong)).map(function(x){ return {label:x.w, value:x.w}; })};
      }
      var set = pick(forBand(ODD, b));
      var oddItem = set.items[set.odd];
      return {q:"Which does not belong?", a:oddItem,
        opts:set.items.map(function(x){ return {label:x, value:x}; })};
    });
  }

  /* ---------- Claim the Square ---------- */
  /* Noughts and crosses, except a square is only yours once you have answered
     a question at your level. It keeps the board honest: the quicker thinker
     wins, not whoever taps first. */
  function startDuoSquares(world){
    var b = band(), level = Math.max(1, levelOf("numbers"));
    var names = duoNames();
    var marks = ["⭕","❌"];
    var cells = [null,null,null,null,null,null,null,null,null];
    var turn = 0, over = false;
    var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    var wrap = el("div",{style:"flex:1; min-height:0; display:flex; flex-direction:column"});
    var bar = el("div",{"class":"gamebar"});
    var back = el("button",{"class":"iconbtn","aria-label":"Back to the games", text:"←"});
    back.addEventListener("click", function(){ sfx.tap(); renderHome(); });
    bar.appendChild(back);
    bar.appendChild(el("div",{"class":"dots"}));
    bar.appendChild(el("div",{"class":"tally"}, world.emo, el("b",{text:"3 in a row"})));
    wrap.appendChild(bar);
    var stage = el("div",{"class":"stage"});
    wrap.appendChild(stage);
    show(wrap);

    function winner(){
      for(var i=0;i<LINES.length;i++){
        var L = LINES[i];
        if(cells[L[0]] !== null && cells[L[0]] === cells[L[1]] && cells[L[1]] === cells[L[2]]) return {who:cells[L[0]], line:L};
      }
      return null;
    }

    function board(){
      stage.textContent = "";
      var turns = el("div",{"class":"duo-turn"});
      turns.appendChild(el("div",{"class":"duo-chip ca" + (turn===0?" on":""), text: marks[0] + "  " + names[0]}));
      turns.appendChild(el("div",{"class":"duo-chip cb" + (turn===1?" on":""), text: marks[1] + "  " + names[1]}));
      stage.appendChild(turns);
      stage.appendChild(el("div",{"class":"prompt", text: names[turn] + ", pick a square"}));
      var grid = el("div",{"class":"duo-board"});
      cells.forEach(function(v, idx){
        var cls = "duo-cell" + (v === 0 ? " a" : v === 1 ? " b" : "");
        var c = el("button",{"class":cls, text: v === null ? "" : marks[v]});
        if(v === null) c.addEventListener("click", function(){ sfx.tap(); askFor(idx); });
        grid.appendChild(c);
      });
      stage.appendChild(grid);
      var done = cells.every(function(v){ return v !== null; });
      var w = winner();
      if(w || done){
        over = true;
        if(w){
          [].slice.call(grid.children).forEach(function(c, i){ if(w.line.indexOf(i) >= 0) c.classList.add("win"); });
        }
        setTimeout(function(){
          var a = w && w.who === 0 ? 1 : 0, bb = w && w.who === 1 ? 1 : 0;
          duoFinish(world, names, a, bb);
        }, 900);
      }
    }

    function askFor(idx){
      if(over) return;
      var q = numberQuestion(b, level);
      stage.textContent = "";
      stage.appendChild(el("div",{"class":"prompt", text: names[turn] + " — answer to claim it"}));
      stage.appendChild(el("div",{"class":"bigq", text: qLine(q)}));
      stage.appendChild(choiceGrid(q.opts, q.a, function(ok){
        if(ok){ cells[idx] = turn; sfx.good(); flash(marks[turn]); }
        else { sfx.bad(); }
        turn = turn === 0 ? 1 : 0;
        setTimeout(board, ok ? 650 : 1050);
      }, false));
    }

    board();
  }

  /* ---------- Memory Duel ---------- */
  /* The solo memory game, played in turns: find a pair and you go again, miss
     and it passes over. Most pairs at the end wins. */
  function startDuoMemory(world){
    var b = band();
    var names = duoNames();
    var pairs = b === 0 ? 4 : b === 1 ? 6 : 8;
    var cols = pairs <= 4 ? 4 : 4;
    var chosen = shuffle(PICS.slice()).slice(0, pairs);
    var deck = shuffle(chosen.concat(chosen));
    var open = [], busy = false, turn = 0, scores = [0,0], found = 0;

    var wrap = el("div",{style:"flex:1; min-height:0; display:flex; flex-direction:column"});
    var bar = el("div",{"class":"gamebar"});
    var back = el("button",{"class":"iconbtn","aria-label":"Back to the games", text:"←"});
    back.addEventListener("click", function(){ sfx.tap(); renderHome(); });
    bar.appendChild(back);

      turns.appendChild(el("div",{"class":"duo-chip cb" + (turn===1?" on":""), text: names[1] + "  " + scores[1]}));

    deck.forEach(function(c){
      var card = el("button",{"class":"card", text:"?"});
      card.setAttribute("data-e", c.e);
      card.addEventListener("click", function(){
        if(busy || card.classList.contains("done") || card.classList.contains("up")) return;
        card.classList.add("up"); card.textContent = c.e; sfx.tap();
        open.push(card);
        if(open.length < 2) return;
        busy = true;
        var same = open[0].getAttribute("data-e") === open[1].getAttribute("data-e");
        setTimeout(function(){
          if(same){
            open.forEach(function(o){ o.classList.remove("up"); o.classList.add("done"); });
            scores[turn]++; found++;
            sfx.good(); flash("⭐");
            says.textContent = names[turn] + " found a pair — go again!";
          } else {
            open.forEach(function(o){ o.classList.remove("up"); o.textContent = "?"; });
            sfx.bad();
            turn = turn === 0 ? 1 : 0;
            says.textContent = names[turn] + "'s turn — find a pair";
          }
          open = []; busy = false;
          drawTurns();
          if(found >= pairs) setTimeout(function(){ duoFinish(world, names, scores[0], scores[1]); }, 700);
        }, same ? 420 : 900);
      });
      grid.appendChild(card);
    });
    stage.appendChild(grid);
    show(wrap);
  }

  /* A password box with a "show" button beside it. Typing a password on a
     phone keyboard is where most sign-in mistakes come from, and letting
     people see what they typed fixes more of them than any error message. */
  function passwordInput(id, autocomplete){
    var row = el("div",{"class":"pwrow"});
    var input = el("input",{type:"password", id:id, maxlength:"128", autocomplete:autocomplete || "current-password", spellcheck:"false"});
    var eye = el("button",{"class":"pweye", type:"button", "aria-pressed":"false", "aria-label":"Show password", text:"Show"});
    eye.addEventListener("click", function(){
      var show = input.type === "password";
      input.type = show ? "text" : "password";
      eye.textContent = show ? "Hide" : "Show";
      eye.setAttribute("aria-pressed", show ? "true" : "false");
      eye.setAttribute("aria-label", show ? "Hide password" : "Show password");
      input.focus();
    });
    row.appendChild(input); row.appendChild(eye);
    return {row:row, input:input};
  }

  /* Set a first password, or change the one the account has. Signed-in
     only: the token says which account, and the current password (when
     there is one) says it is really them. */
  function openPassword(){
    var token = getToken();
    if(!token || !accountEmail){ banner("Sign in with your email first."); return; }
    var box = el("div");
    box.appendChild(el("h2",{"class":"display", text: accountHasPassword ? "Change password" : "Set a password"}));
    box.appendChild(el("p",{text: accountHasPassword
      ? "Type your current password, then the new one twice."
      : "With a password, only you can sign in as " + accountEmail + " on another device."}));

    var curI = null;
    if(accountHasPassword){
      var fcur = el("div",{"class":"field"});
      fcur.appendChild(el("label",{text:"Current password", "for":"pc_pw_cur"}));
      var cur = passwordInput("pc_pw_cur", "current-password");
      curI = cur.input;
      fcur.appendChild(cur.row); box.appendChild(fcur);
    }

    var fnew = el("div",{"class":"field"});
    fnew.appendChild(el("label",{text:"New password", "for":"pc_pw_new"}));
    fnew.appendChild(el("div",{"class":"fieldnote", text:"At least 6 characters."}));
    var nw = passwordInput("pc_pw_new", "new-password");
    fnew.appendChild(nw.row); box.appendChild(fnew);

    var fagain = el("div",{"class":"field"});
    fagain.appendChild(el("label",{text:"New password again", "for":"pc_pw_again"}));
    var again = passwordInput("pc_pw_again", "new-password");
    fagain.appendChild(again.row); box.appendChild(fagain);

    var err = el("div",{"class":"err"}); box.appendChild(err);
    var m = modal(box);
    var go = el("button",{"class":"btn btn-lg btn-go", style:"width:100%; margin-top:8px", text:"Save password"});
    var back = el("button",{"class":"btn btn-lg btn-ghost", style:"width:100%; margin-top:10px", text:"Cancel"});
    back.addEventListener("click", function(){ m.close(); });
    go.addEventListener("click", function(){
      var next = nw.input.value || "", rep = again.input.value || "";
      if(curI && !curI.value){ err.textContent = "Please type your current password."; curI.focus(); return; }
      if(next.length < 6){ err.textContent = "Please use at least 6 characters."; nw.input.focus(); return; }
      if(next !== rep){ err.textContent = "Those two passwords are not the same."; again.input.focus(); return; }
      go.disabled = true; go.textContent = "Saving…"; err.textContent = "";
      api("/api/password", {token:token, current: curI ? curI.value : "", next:next}).then(function(res){
        if(res.status === 200 && res.body.ok){
          accountHasPassword = true;
          m.close();
          banner("🔒 Password saved");
          return;
        }
        err.textContent = res.body.message || "Something went wrong. Please try again.";
      })["catch"](function(){
        err.textContent = "Couldn't reach the server. Check your connection.";
      }).then(function(){ go.disabled = false; go.textContent = "Save password"; });
    });
    box.appendChild(go); box.appendChild(back);
    setTimeout(function(){ (curI || nw.input).focus(); }, 80);
  }

        applyLicence(res.body.licence, res.body.expiresAt || (Math.floor(Date.now()/1000) + (res.body.trialDays || 7) * 86400), res.body.ads);
        var kid = (kidI.value||"").trim();

  /* There is no key to buy or type any more: full access is switched on for
     an account from the admin side, by request, and the app picks it up the
     next time it checks in (see /api/verify). This screen used to ask for a
     KBW-XXXX key; it now just explains that and lets a child close it and
     keep playing what is already open to them. */
  /* ---------- write your own sentence ----------
     A child types one sentence. It goes to the server as 'pending' and sits
     there until a parent looks at it in the admin page; only once it is
     approved does anyone else ever see it, credited to whoever wrote it, as
     a one-round Sentence Builder made from their own words. Nothing here
     shows a child's sentence to another family before a parent has read it. */
  var WRITING_COLOURS = ["#20143A","#E8563C","#FFC43D","#57C08A","#4AA8E8","#9B7BFF","#FF5D8F","#ffffff"];

  function openWriting(){
    var box = el("div",{"class":"writebox"});
    box.appendChild(el("h2",{"class":"display", text:"Write or draw something of your own"}));
    box.appendChild(el("p",{text:"Write a sentence or draw a picture. If it's approved, it becomes a real game or a picture card — with your name on it."}));

    var token = getToken();
    if(!token){
      box.appendChild(el("p",{style:"font-weight:800; color:#FFD98A", text:"Sign in first so we know whose it is."}));
      var back0 = el("button",{"class":"btn btn-ghost", style:"width:100%; margin-top:10px", text:"Close"});
      back0.addEventListener("click", function(){ m0.close(); });
      box.appendChild(back0);
      var m0 = modal(box);
      return;
    }

    /* ---- mode tabs ---- */
    var tabs = el("div",{"class":"seg", style:"margin-bottom:14px"});
    var tabWrite = el("button",{"class":"active", text:"✍️ Write"});
    var tabDraw = el("button",{text:"🎨 Draw"});
    tabs.appendChild(tabWrite); tabs.appendChild(tabDraw);
    box.appendChild(tabs);

    var writePane = el("div",{"class":"writepane"});
    var f = el("div",{"class":"field"});
    f.appendChild(el("label",{text:"Your sentence or story", "for":"pc_sentence"}));
    var inp = el("textarea",{id:"pc_sentence", rows:"10", maxlength:"4000",
      placeholder:"The dog ran fast in the park… write as much as you like!"});
    f.appendChild(inp); writePane.appendChild(f);
    box.appendChild(writePane);

    /* ---- drawing pane ---- */
    var drawPane = el("div",{"class":"drawpane", style:"display:none"});
    var canvasWrap = el("div",{"class":"drawwrap"});
    var canvas = el("canvas",{width:"900", height:"680"});
    canvasWrap.appendChild(canvas);
    drawPane.appendChild(canvasWrap);

    var palette = el("div",{"class":"palette"});
    var swatches = [];
    var curColour = WRITING_COLOURS[0];
    WRITING_COLOURS.forEach(function(c, ci){
      var sw = el("button",{"class":"swatch" + (ci === 0 ? " on" : ""), style:"background:" + c});
      sw.addEventListener("click", function(){
        curColour = c;
        swatches.forEach(function(s2){ s2.classList.remove("on"); });
        sw.classList.add("on");
      });
      swatches.push(sw);
      palette.appendChild(sw);
    });
    var clearBtn = el("button",{"class":"btn btn-ghost btn-sm", text:"Clear"});
    palette.appendChild(clearBtn);
    drawPane.appendChild(palette);
    box.appendChild(drawPane);

    /* A plain 2D canvas, drawn on with Pointer Events so a finger, a mouse
       and a stylus all work the same way. touch-action:none stops the page
       itself scrolling while a child is mid-stroke. */
    var ctx2d = canvas.getContext("2d");
    function fillWhite(){ ctx2d.fillStyle = "#fff"; ctx2d.fillRect(0, 0, canvas.width, canvas.height); }
    fillWhite();
    var drawing = false, lastX = 0, lastY = 0;
    function pos(e){
      var r = canvas.getBoundingClientRect();
      return {x: (e.clientX - r.left) * (canvas.width / r.width),
              y: (e.clientY - r.top) * (canvas.height / r.height)};
    }
    canvas.addEventListener("pointerdown", function(e){
      drawing = true; canvas.setPointerCapture(e.pointerId);
      var p = pos(e); lastX = p.x; lastY = p.y;
      ctx2d.fillStyle = curColour;
      ctx2d.beginPath(); ctx2d.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx2d.fill();
    });
    canvas.addEventListener("pointermove", function(e){
      if(!drawing) return;
      var p = pos(e);
      ctx2d.strokeStyle = curColour; ctx2d.lineWidth = 10;
      ctx2d.lineCap = "round"; ctx2d.lineJoin = "round";
      ctx2d.beginPath(); ctx2d.moveTo(lastX, lastY); ctx2d.lineTo(p.x, p.y); ctx2d.stroke();
      lastX = p.x; lastY = p.y;
    });
    ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
      canvas.addEventListener(ev, function(){ drawing = false; });
    });
    clearBtn.addEventListener("click", function(){ sfx.tap(); fillWhite(); });

    var mode = "write";
    function setMode(m2){
      mode = m2;
      tabWrite.classList.toggle("active", m2 === "write");
      tabDraw.classList.toggle("active", m2 === "draw");
      writePane.style.display = m2 === "write" ? "" : "none";
      drawPane.style.display = m2 === "draw" ? "" : "none";

    tabWrite.addEventListener("click", function(){ sfx.tap(); setMode("write"); });
    tabDraw.addEventListener("click", function(){ sfx.tap(); setMode("draw"); });

    var err = el("div",{"class":"err"}); box.appendChild(err);
    var go = el("button",{"class":"btn btn-lg btn-pink", style:"width:100%", text:"Submit"});
    box.appendChild(go);

    var listWrap = el("div",{style:"margin-top:18px"});
    box.appendChild(listWrap);

    function statusLabel(st){
      return st === "approved" ? "✅ Now on the home screen!" : st === "rejected" ? "Not used this time" : "⏳ Waiting to be read";
    }
    function loadMine(){
      listWrap.textContent = "";
      api("/api/writing?token=" + encodeURIComponent(token), null, "GET").then(function(res){
        if(!(res.status === 200 && res.body.ok) || !res.body.writings.length) return;
        listWrap.appendChild(el("div",{style:"font-weight:800; color:#C9C4EE; font-size:13px; margin-bottom:8px", text:"YOUR SUBMISSIONS"}));
        res.body.writings.slice().reverse().forEach(function(w){
          var row = el("div",{"class":"prow"});
          if(w.type === "drawing"){
            row.appendChild(el("img",{src:w.imageDataUrl, alt:"Your drawing",
              style:"width:44px; height:32px; object-fit:cover; border-radius:8px; flex:none"}));
            row.appendChild(el("div",{"class":"n", style:"font-weight:700", text:"Your drawing"}));
          } else {
            var preview = w.sentence.length > 60 ? w.sentence.slice(0, 60) + "…" : w.sentence;
            row.appendChild(el("div",{"class":"n", style:"font-weight:700", text:"“" + preview + "”"}));
          }
          row.appendChild(el("div",{"class":"v", style:"font-size:13px", text:statusLabel(w.status)}));
          listWrap.appendChild(row);
        });
      })["catch"](function(){});
    }

    go.addEventListener("click", function(){
      go.disabled = true; err.textContent = "";
      var body = {token:token, childName:state.name || ""};
      if(mode === "draw") body.imageDataUrl = canvas.toDataURL("image/jpeg", 0.72);
      else body.sentence = (inp.value || "").trim();
      api("/api/writing", body).then(function(res){

          loadMine();

          err.textContent = (res.body && res.body.message) || "Couldn't send that. Try again.";
        }
      })["catch"](function(){
        err.textContent = "Couldn't reach the server. Check your connection.";
      }).then(function(){ go.disabled = false; });
    });

    var back = el("button",{"class":"btn btn-ghost", style:"width:100%; margin-top:14px", text:"Close"});
    back.addEventListener("click", function(){ m.close(); });
    box.appendChild(back);

    var m = modal(box, {full:true});
    loadMine();
    setTimeout(function(){ inp.focus(); }, 80);
  }

  /* A short sentence still becomes the drag-the-words-into-order game it
     always did; a long essay cannot sensibly be a reorder puzzle, so past
     this length it is read back instead. */
  var WRITING_GAME_MAX_WORDS = 14;

  /* Plays one approved sentence or story, credited to whoever wrote it.
     w carries {id, childName, sentence}. */
  function playWriting(w){
    var wordCount = w.sentence.trim().split(/\s+/).filter(Boolean).length;
    if(wordCount > WRITING_GAME_MAX_WORDS) return readOwnStory(w);

    var words = w.sentence.split(" ");
    var wrap = el("div",{style:"flex:1; min-height:0; display:flex; flex-direction:column"});
    var bar = el("div",{"class":"gamebar"});
    var back = el("button",{"class":"iconbtn","aria-label":"Back to the games", text:"←"});
    back.addEventListener("click", function(){ sfx.tap(); renderHome(); });
    bar.appendChild(back);
    bar.appendChild(el("div",{"class":"tally"}, "✍️", el("b",{text:"by " + (w.childName || "a player")})));
    wrap.appendChild(bar);
    var stage = el("div",{"class":"stage"});
    wrap.appendChild(stage);
    show(wrap);

    stage.appendChild(el("div",{"class":"prompt", text:"Drag the words into the right order"}));

    function finishRound(won){
      music.stop();
      var box = el("div",{"class":"result"});
      box.appendChild(el("div",{"class":"stars-big", text: won ? "⭐" : "✍️"}));
      box.appendChild(el("div",{"class":"score display", text: won ? "You got it!" : words.join(" ")}));
      box.appendChild(el("div",{style:"font-weight:800; color:#C9C4EE; font-size:15px",
        text:"Written by " + (w.childName || "a player")}));
      var again = el("button",{"class":"btn btn-lg btn-go", style:"min-width:240px", text:"Play again"});
      again.addEventListener("click", function(){ sfx.tap(); playWriting(w); });
      var home = el("button",{"class":"btn btn-lg btn-ghost", style:"min-width:240px", text:"Choose another game"});
      home.addEventListener("click", function(){ sfx.tap(); renderHome(); });
      box.appendChild(again); box.appendChild(home);
      show(box);
    }

    var orderer = buildWordOrderer(stage, words, function(built){
      orderer.lock();
      var ok = built.join(" ") === words.join(" ");
      if(ok){ sfx.good(); confettiBurst(60); speak(words.join(" ")); } else { sfx.bad(); }
      setTimeout(function(){ finishRound(ok); }, ok ? 1200 : 1600);
    });
  }

  /* A long story, read back rather than turned into a puzzle. w carries
     {id, childName, sentence}. */
  function readOwnStory(w){
    var wrap = el("div",{style:"flex:1; min-height:0; display:flex; flex-direction:column"});

  /* ---------- paying for full access ----------
     Whether a pay button is shown at all is the server's to say: it depends
     on Stripe being configured there. Asked for once, remembered after. */
  var payEnabled = null;
  function loadPayConfig(){
    if(payEnabled !== null) return Promise.resolve(payEnabled);
    return api("/api/pay/config", null, "GET").then(function(res){
      payEnabled = !!(res.status === 200 && res.body.ok && res.body.enabled);
      return payEnabled;
    })["catch"](function(){ payEnabled = false; return false; });
  }
  /* Starts a Stripe Checkout for this parent and sends the browser there.
     Stripe brings them back to /?paid=1, where handlePaidReturn picks up. */
  function startCheckout(btn, email){
    var was = btn.textContent;
    btn.disabled = true; btn.textContent = "Opening secure checkout…";
    var body = {token: getToken()};
    if(email) body.email = email;
    return api("/api/pay/checkout", body).then(function(res){
      if(res.status === 200 && res.body.ok && res.body.url){ window.location.href = res.body.url; return; }
      btn.disabled = false; btn.textContent = was;
      if(res.body && res.body.already){ banner("✅ This account already has full access — sign in to use it."); return; }
      if(res.body && res.body.error === "sign_in_first"){ banner("Sign in with your email first, then unlock."); return; }
      banner((res.body && res.body.message) || "Couldn't open checkout just now — please try again.");
    })["catch"](function(){
      btn.disabled = false; btn.textContent = was;
      banner("Couldn't reach the server. Check your connection.");
    });
  }
  function payButton(email){
    var b = el("button",{"class":"btn btn-lg btn-go", style:"width:100%", text:"🔓 Unlock full access"});
    b.addEventListener("click", function(){
      sfx.tap();
      var e = typeof email === "function" ? email() : email;
      if(typeof email === "function" && !e) return;   /* the picker already said what is missing */
      startCheckout(b, e);
    });
    return b;
  }
  /* Back from Stripe. The stored token is verified by the normal boot below,
     and the server upgrades it on the spot now that the grant exists, so all
     this has to do is say so and tidy the address bar. */
  var paidReturn = null;
  try{
    var qs = new URLSearchParams(window.location.search);
    if(qs.has("paid")){
      paidReturn = qs.get("paid") === "1" ? "yes" : "no";
      history.replaceState(null, "", window.location.pathname);
    }
  }catch(e){}
  function handlePaidReturn(){
    if(!paidReturn) return;
    var which = paidReturn; paidReturn = null;
    if(which === "yes"){
      confettiBurst(80);
      banner(getToken() ? "🎉 Payment received — every game is now unlocked!" : "🎉 Payment received! Sign in with the same email to unlock every game.");
    } else {
      banner("No payment was made — you can unlock any time.");
    }
  }

  function openKey(){
    var box = el("div");
    box.appendChild(el("h2",{"class":"display", text:"Unlock every game"}));
    var copy = el("p",{text: licence && licence.limited
      ? "Your free trial has ended. Unlock every game with a one-time payment — it's applied to your account straight away, and your stars are all still here."
      : "Your free trial opens every game while it lasts. Keep the whole app for good with a one-time payment — it's applied to your account straight away."});
    box.appendChild(copy);
    var pay = payButton(null);
    box.appendChild(pay);
    var ok = el("button",{"class":"btn btn-lg btn-ghost", style:"width:100%; margin-top:10px", text:"Not now"});
    box.appendChild(ok);

    var m = modal(box);
    loadPayConfig().then(function(on){
      if(on) return;
      pay.hidden = true;
      copy.textContent = (licence && licence.limited ? "Your free trial has ended. " : "")
        + "Full access is switched on for your account by whoever runs this site — ask them, and it will be there next time you open the app.";
      ok.textContent = "Got it";
    });
    ok.addEventListener("click", function(){ m.close(); if(!licence) openWelcome(false); });
  }

  /* The Movement switch already silences confetti and the fox in JS; this
     lets it silence every CSS entrance and press animation too. */
  function applyMotionClass(){
    document.body.classList.toggle("nomotion", state.motion === false);
  }

  /* ---------- boot ---------- */
  load();
  applyMotionClass();
  refreshWritings();
  renderHome();
  setTimeout(handlePaidReturn, 400);

  /* Edge-swipe back: the gesture fires a popstate. We keep one spare entry
     below this page, so the swipe lands on it instead of leaving the site, and
     immediately push another one ready for the next swipe. Nothing the child
     can do with a finger closes the app. */
  /* Whether Google sign-in is available is the server's to say — it depends on
     a client ID being configured there. Asked for once, at boot. */
  var googleClientId = null, googleReady = null, configReady = null;
  /* /api/config once per page: whether Google sign-in exists, and whether
     passwords are emailed here rather than chosen on the sheet. */
  function loadConfig(){
    if(configReady) return configReady;
    configReady = api("/api/config", null, "GET").then(function(res){
      return (res.status === 200 && res.body.ok) ? res.body : {};
    })["catch"](function(){ return {}; });
    return configReady;
  }
  function loadGoogle(){
    if(googleReady) return googleReady;
    googleReady = loadConfig().then(function(cfg){
      var res = {status:200, body:cfg};
      if(!(res.status === 200 && res.body.ok && res.body.googleClientId)) return null;
      googleClientId = res.body.googleClientId;
      return new Promise(function(resolve){
        if(window.google && window.google.accounts) return resolve(googleClientId);
        var sc = document.createElement("script");
        sc.src = "https://accounts.google.com/gsi/client";
        sc.async = true; sc.defer = true;
        sc.onload = function(){ resolve(googleClientId); };
        /* Blocked script, no network, an ad blocker — the typed form is still
           there, so the sheet must not break. */
        sc.onerror = function(){ resolve(null); };
        document.head.appendChild(sc);
      });
    })["catch"](function(){ return null; });
    return googleReady;
  }

  /* A ring wherever a finger lands, on every button in the app. One listener
     on the document rather than one per button, and it skips itself when
     motion is turned off. */
  function armRipples(){
    document.addEventListener("pointerdown", function(e){
      if(state.motion === false) return;
      var t = e.target;
      while(t && t !== document.body){
        if(t.tagName === "BUTTON" || t.getAttribute && t.getAttribute("role") === "button") break;
        t = t.parentElement;
      }
      if(!t || t === document.body) return;
      var r = el("div",{"class":"ripple"});
      r.style.left = e.clientX + "px";
      r.style.top = e.clientY + "px";
      document.body.appendChild(r);
      setTimeout(function(){ if(r.parentNode) r.parentNode.removeChild(r); }, 520);
    }, {passive:true});
  }
  armRipples();
  watchStage();

  /* ---------- installing ----------
     The service worker is what makes a browser treat this as an app rather
     than a bookmark; Android then fires beforeinstallprompt, which is the only
     way to show an install button of our own. iOS has no such event — Safari
     puts it in the Share menu — so iPhone and iPad get told where to look. */
  var installEvent = null;
  if("serviceWorker" in navigator && !PREVIEW){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("/sw.js").catch(function(){});
    });
  }
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    installEvent = e;
    showInstallBar();
  });
  window.addEventListener("appinstalled", function(){
    installEvent = null;
    try{ localStorage.setItem("papercub.installed", "1"); }catch(e){}
    var bar = document.querySelector(".installbar");
    if(bar && bar.parentNode) bar.parentNode.removeChild(bar);
  });

  function standalone(){
    try{
      return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    }catch(e){ return false; }
  }
  function isiOS(){
    return /iP(hone|ad|od)/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }
  function installDismissed(){
    try{ return localStorage.getItem("papercub.noinstall") === "1"; }catch(e){ return false; }
  }

  function showInstallBar(){
    if(standalone() || installDismissed()) return;
    if(document.querySelector(".installbar")) return;
    var bar = el("div",{"class":"installbar"});
    bar.appendChild(el("div",{"class":"ib-e", text:"🦊"}));
    var mid = el("div",{"class":"ib-mid"});
    mid.appendChild(el("div",{"class":"ib-t", text:"Add Fun Game to your home screen"}));
    mid.appendChild(el("div",{"class":"ib-s", text: installEvent
      ? "It opens like an app, full screen, and works without wifi."
      : "Tap Share, then \u201cAdd to Home Screen\u201d."}));
    bar.appendChild(mid);
    if(installEvent){
      var go = el("button",{"class":"btn btn-go ib-go", text:"Install"});
      go.addEventListener("click", function(){
        sfx.tap();
        var e = installEvent;
        installEvent = null;
        if(!e) return;
        e.prompt();
        e.userChoice["catch"](function(){})["then"](function(){});
        if(bar.parentNode) bar.parentNode.removeChild(bar);
      });
      bar.appendChild(go);
    }
    var no = el("button",{"class":"iconbtn ib-no","aria-label":"Not now", text:"✕"});
    no.addEventListener("click", function(){
      try{ localStorage.setItem("papercub.noinstall", "1"); }catch(e){}
      if(bar.parentNode) bar.parentNode.removeChild(bar);
    });
    bar.appendChild(no);
    document.body.appendChild(bar);
  }

  /* iOS never fires beforeinstallprompt, so the hint is shown on its own once
     the child has actually played a bit — nobody installs an app they have
     not tried. */
  function maybeOfferIOSInstall(){
    if(!isiOS() || standalone() || installDismissed()) return;
    if(playedCount() < 2) return;
    setTimeout(showInstallBar, 1200);
  }

  function holdHistory(){
    try{
      history.pushState({kbw:1}, "", location.href);
      window.addEventListener("popstate", function(){
        try{ history.pushState({kbw:1}, "", location.href); }catch(e){}
      });
    }catch(e){}
  }
  holdHistory();

  if(PREVIEW){
    applyLicence({id:"preview", name:"Preview", trial:false}, null);
    renderHome();
    if(!state.setup) openProfile();
  } else {
    var token = getToken();
    if(!token){
      openWelcome(false);
    } else {
      api("/api/verify", {token:token}).then(function(res){
        if(res.status === 200 && res.body.ok){
          /* The server hands back a new token when access has been widened
             since this browser last checked. */
          if(res.body.token){ setToken(res.body.token, rememberedHere()); }
          accountHasPassword = !!res.body.hasPassword;
          applyLicence(res.body.licence, res.body.expiresAt, res.body.ads);
          if(res.body.trialEnded) setTimeout(function(){ banner("Your free trial has ended — unlock every game to keep playing."); }, 900);
          /* Draw only once the account's stars are in, or the home screen
             would show this device's total and then quietly change. */
          syncProgress(function(){
            renderHome();
            if(!state.setup) openProfile();
            else if(licence && licence.limited) setTimeout(openKey, 700);
          });
        } else {
          clearToken();
          openWelcome(res.body && res.body.error === "expired");
        }
      })["catch"](function(){ openWelcome(false); });
    }
  }
})();
</script>
</body>
</html>
