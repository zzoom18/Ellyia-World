    function onPlayerHit(){
      if(over || invincible) return;
      playerHp = Math.max(0, playerHp - 1);
      youBar.style.width = (playerHp / playerMax * 100) + "%";
      youHpTxt.textContent = playerHp + " / " + playerMax;
      sfx.bad();
      playerSprite.classList.add("hurt");
      invincible = true;
      setTimeout(function(){ playerSprite.classList.remove("hurt"); }, 400);
      setTimeout(function(){ invincible = false; }, 700);
      if(playerHp <= 0 && !over){
        over = true;
        clearBolts();
        setTimeout(function(){ endBattle(false); }, 500);
      }
    }

    var lastTs = null, bossFireTimer = 0.6;
    function tick(ts){
      if(!document.body.contains(field)){ offListeners(); return; }
      if(lastTs == null) lastTs = ts;
      var dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;

      var ix = joyVec.x + keyVec.x, iy = joyVec.y + keyVec.y;
      var imag = Math.sqrt(ix * ix + iy * iy);
      if(imag > 1){ ix /= imag; iy /= imag; }
      playerPos.x = clamp(playerPos.x + ix * PLAYER_SPEED * dt, PLAYER_HW, fieldW - PLAYER_HW);
      playerPos.y = clamp(playerPos.y + iy * PLAYER_SPEED * dt, PLAYER_HH, fieldH - PLAYER_HH);

      if(phase === "action" && !over){
        var tdx = dalTarget.x - dalPos.x, tdy = dalTarget.y - dalPos.y;
        var td = Math.sqrt(tdx * tdx + tdy * tdy);
        if(td < 6){
          dalTarget.x = ri(BOSS_HW, Math.max(BOSS_HW + 1, fieldW - BOSS_HW));
          dalTarget.y = ri(BOSS_HH, Math.max(BOSS_HH + 1, fieldH * 0.55));
        } else {
          dalPos.x += tdx / td * DAL_SPEED * dt;
          dalPos.y += tdy / td * DAL_SPEED * dt;
        }
        bossFireTimer -= dt;
        if(bossFireTimer <= 0){ spawnBolt(); bossFireTimer = 0.9; }
      }

      for(var i = bolts.length - 1; i >= 0; i--){
        var bo = bolts[i];
        bo.x += bo.vx * dt; bo.y += bo.vy * dt;
        bo.el.style.transform = "translate(" + (bo.x - 6) + "px," + (bo.y - 6) + "px)";
        if(bo.x < -20 || bo.x > fieldW + 20 || bo.y < -20 || bo.y > fieldH + 20){
          if(bo.el.parentNode) bo.el.parentNode.removeChild(bo.el);
          bolts.splice(i, 1);
          continue;
        }
        var hdx = bo.x - playerPos.x, hdy = bo.y - playerPos.y;
        if(!over && !invincible && Math.sqrt(hdx * hdx + hdy * hdy) < HIT_RADIUS){
          if(bo.el.parentNode) bo.el.parentNode.removeChild(bo.el);
          bolts.splice(i, 1);
          onPlayerHit();
        }
      }

      renderSprites();
      if(!over) requestAnimationFrame(tick);
      else offListeners();
    }
    requestAnimationFrame(tick);

    function nextQuestion(){
      if(over) return;
      phase = "question";
      field.classList.add("paused");
      clearBolts();
      qwrap.textContent = "";
      var Q = joyBossSum(b, level);
      qwrap.appendChild(el("div",{"class":"bigq", text: Q.a + " + " + Q.c + " = ?"}));
      qwrap.appendChild(choiceGrid(numberOptions(Q.ans, Math.max(4, Math.round(Q.ans * 0.3)), 3), Q.ans, function(ok){
        if(over) return;
        if(ok){
          correct++;
          dalHp = Math.max(0, dalHp - dmgToBoss);
          dalBar.style.width = (dalHp / dalMax * 100) + "%";
          dalHpTxt.textContent = dalHp + " / " + dalMax;
          fireAtBoss();
          sfx.good();
          markDot(shell.dots, correct - 1, true);
        } else {
          sfx.bad();
        }
        if(dalHp <= 0){
          over = true;
          setTimeout(function(){ endBattle(true); }, 650);
          return;
        }
        setTimeout(startAction, ok ? 550 : 350);
      }, false));
    }

    function startAction(){
      if(over) return;
      phase = "action";
      field.classList.remove("paused");
      bossFireTimer = 0.5;
      setTimeout(function(){
        if(!over) nextQuestion();
      }, 2200);
    }

    function endBattle(won){
      music.stop();
      clearBolts();
      offListeners();
      if(won){ sfx.win(); confettiBurst(90); award(world.id, 3, true); }
      else { sfx.bad(); award(world.id, 0, false); }
      save();
      var box = el("div",{"class":"result"});
      box.appendChild(el("div",{"class":"stars-big", text: won ? "🏆" : "💫"}));
      box.appendChild(el("div",{"class":"score display", text: won ? "You defeated Dal!" : "Dal got you this time!"}));
      box.appendChild(el("div",{style:"font-weight:800; color:#C9C4EE; font-size:16px",
        text: won ? correct + " correct shots landed" : "You landed " + correct + " shots — have another go!"}));
      box.appendChild(el("div",{"class":"byline", text:"🎮 Created by Kayden Bang, Mee Toh Primary School"}));
      var again = el("button",{"class":"btn btn-lg btn-go", style:"min-width:240px", text: won ? "Fight again" : "Try again"});
      again.addEventListener("click", function(){ sfx.tap(); startJoyBoss(world); });
      var home = el("button",{"class":"btn btn-lg btn-ghost", style:"min-width:240px", text:"Choose another game"});
      home.addEventListener("click", function(){ sfx.tap(); renderHome(); });
      box.appendChild(again); box.appendChild(home);
      show(box);
    }

    nextQuestion();
  }

  /* ==========================================================================
     Snake and Ladders
     --------------------------------------------------------------------------
     Designed by Ellyia (K2): a short 30-square race against a rival rabbit.
     Answer a sum to roll — get it right and roll a full die (1-6), get it
     wrong and still roll, just a smaller one (1-3), so nobody is stuck
     watching the rabbit run away. Every roll moves both racers: yours,
     then the rabbit's, snakes and ladders included, straight through to
     whoever reaches square 30 first.
     ========================================================================== */
  var SNL_SIZE = 30;
  var SNL_SNAKES = {12:4, 19:7, 24:11, 27:16};
  var SNL_LADDERS = {3:14, 8:20, 17:26};
  function startSnake(world){
    var shell = gameShell(world, 0);
    shell.stage.appendChild(el("div",{"class":"byline", text:"🐍 Created by Ellyia, K2"}));
    shell.stage.appendChild(el("div",{"class":"prompt", text:"Answer to roll — race Bunny to square 30!"}));

    /* The grid is laid out top row first, but the numbers start bottom-left
       and snake back and forth, so each cell works out which square it is
       from where it sits. */
    var SNL_COLS = 6, SNL_ROWS = SNL_SIZE / SNL_COLS;
    var path = el("div",{"class":"snl-path"});
    var stones = [];
    for(var r = 0; r < SNL_ROWS; r++){
      for(var c = 0; c < SNL_COLS; c++){
        var fromBottom = SNL_ROWS - 1 - r;
        var s = fromBottom * SNL_COLS + (fromBottom % 2 === 0 ? c + 1 : SNL_COLS - c);
        var kind = SNL_SNAKES[s] ? "snake" : SNL_LADDERS[s] ? "ladder" : s === 1 ? "start" : s === SNL_SIZE ? "goal" : "";
        var stone = el("div",{"class":"snl-stone" + (kind ? " " + kind : "") + (s % 2 === 0 ? " alt" : "")});
        var icon = kind === "snake" ? "🐍" : kind === "ladder" ? "🪜" : kind === "start" ? "🚩" : kind === "goal" ? "🏆" : "";
        if(icon){
          stone.appendChild(el("span",{"class":"snl-num", text:String(s)}));
          stone.appendChild(el("span",{"class":"snl-icon", text:icon}));
        } else {
          stone.appendChild(el("span",{text:String(s)}));
        }
        stones[s - 1] = stone;
        path.appendChild(stone);
      }
    }
    var meToken = el("div",{"class":"snl-token", text: state.avatar || "🦊"});
    var rivalToken = el("div",{"class":"snl-token", text:"🐰"});
    path.appendChild(meToken); path.appendChild(rivalToken);
    shell.stage.appendChild(path);
    var legend = el("div",{"class":"snl-legend"});
    legend.appendChild(el("span",{text:(state.avatar || "🦊") + " you"}));
    legend.appendChild(el("span",{text:"🐰 Bunny"}));
    legend.appendChild(el("span",{text:"🐍 slide down"}));
    legend.appendChild(el("span",{text:"🪜 climb up"}));
    shell.stage.appendChild(legend);

    var status = el("div",{"class":"hintline", text:"Your turn — answer the sum to roll!"});
    shell.stage.appendChild(status);
    var card = el("div",{"class":"qbox"});
    shell.stage.appendChild(card);

    var mePos = 0, rivalPos = 0, over = false;

    function placeToken(tokenEl, pos, offsetX){
      var idx = Math.max(0, Math.min(SNL_SIZE - 1, pos - 1));
      var target = stones[idx];
      var pathRect = path.getBoundingClientRect();
      var tRect = target.getBoundingClientRect();
      if(!pathRect.width || !tRect.width) return;
      /* Absolute positions count from inside the board's border. */
      tokenEl.style.left = (tRect.left - pathRect.left - path.clientLeft + tRect.width / 2 + (offsetX || 0)) + "px";
      tokenEl.style.top = (tRect.top - pathRect.top - path.clientTop + tRect.height / 2 - 3) + "px";
    }
    function placeBoth(){ placeToken(meToken, mePos || 1, -10); placeToken(rivalToken, rivalPos || 1, 10); }
    setTimeout(placeBoth, 0);
    window.addEventListener("resize", placeBoth);

    function endGame(won){
      window.removeEventListener("resize", placeBoth);
      if(won){ sfx.win(); confettiBurst(90); award(world.id, 3, true); }
      else { sfx.bad(); award(world.id, 0, false); }
      save();
      var box = el("div",{"class":"result"});
      box.appendChild(el("div",{"class":"stars-big", text: won ? "🏆" : "🐰"}));
      box.appendChild(el("div",{"class":"score display", text: won ? "You beat Bunny to 30!" : "Bunny got there first!"}));
      box.appendChild(el("div",{"class":"byline", text:"🐍 Created by Ellyia, K2"}));
      var again = el("button",{"class":"btn btn-lg btn-go", text:"Play again"});
      again.addEventListener("click", function(){ sfx.tap(); startSnake(world); });
      var home = el("button",{"class":"btn btn-lg btn-ghost", text:"Choose another game"});
      home.addEventListener("click", function(){ sfx.tap(); renderHome(); });
      box.appendChild(again); box.appendChild(home);
      show(box);
    }

    function rivalTurn(){
      if(over) return;
      var roll = ri(1, 6);
      rivalPos = Math.min(SNL_SIZE, rivalPos + roll);
      placeToken(rivalToken, rivalPos, 10);
      status.textContent = "🐰 Bunny rolled a " + roll + "!";
      setTimeout(function(){
        if(rivalPos >= SNL_SIZE){ over = true; endGame(false); return; }
        var snake = SNL_SNAKES[rivalPos], ladder = SNL_LADDERS[rivalPos];
        if(snake){
          rivalPos = snake; rivalToken.classList.add("snl-slide");
          status.textContent = "🐍 Bunny hit a snake! Sliding back to " + snake + ".";
          setTimeout(function(){ rivalToken.classList.remove("snl-slide"); placeToken(rivalToken, rivalPos, 10); nextQuestion(); }, 500);
        } else if(ladder){
          rivalPos = ladder; rivalToken.classList.add("snl-slide");
          status.textContent = "🪜 Bunny found a ladder! Climbing to " + ladder + ".";
          setTimeout(function(){ rivalToken.classList.remove("snl-slide"); placeToken(rivalToken, rivalPos, 10); nextQuestion(); }, 500);
        } else {
          setTimeout(nextQuestion, 500);
        }
      }, 700);
    }

    function nextQuestion(){
      if(over) return;
      card.textContent = "";
      status.textContent = "Your turn — answer the sum to roll!";
      var Q = numberQuestion(Math.min(1, band()), Math.max(1, levelOf(world.id)));
      card.appendChild(el("div",{"class":"prompt", text:Q.prompt || "What is…"}));
      if(Q.emoji) card.appendChild(el("div",{"class":"countrow", text:Q.emoji.trim()}));
      else card.appendChild(el("div",{"class":"bigq", text: qLine(Q)}));
      card.appendChild(choiceGrid(Q.opts, Q.a, function(ok){
        var roll = ok ? ri(1, 6) : ri(1, 3);
        if(ok){ sfx.good(); flash("⭐"); } else { sfx.bad(); }
        mePos = Math.min(SNL_SIZE, mePos + roll);
        placeToken(meToken, mePos, -10);
        status.textContent = "🎲 You rolled a " + roll + "!";
        setTimeout(function(){
          if(mePos >= SNL_SIZE){ over = true; endGame(true); return; }
          var snake = SNL_SNAKES[mePos], ladder = SNL_LADDERS[mePos];
          if(snake){
            mePos = snake; meToken.classList.add("snl-slide");
            status.textContent = "🐍 Oh no, a snake! Sliding back to " + snake + ".";
            setTimeout(function(){ meToken.classList.remove("snl-slide"); placeToken(meToken, mePos, -10); rivalTurn(); }, 500);
          } else if(ladder){
            mePos = ladder; meToken.classList.add("snl-slide");
            status.textContent = "🪜 A ladder! Climbing up to " + ladder + ".";
            setTimeout(function(){ meToken.classList.remove("snl-slide"); placeToken(meToken, mePos, -10); rivalTurn(); }, 500);
          } else {
            setTimeout(rivalTurn, 500);
          }
        }, 700);
      }, false));
    }
    nextQuestion();
  }

  /* ==========================================================================
     Measure Up
     --------------------------------------------------------------------------
     Reading a scale is its own skill, separate from the arithmetic: a child
     who can add fluently will still read a ruler from the wrong end. Three
     instruments, all drawn rather than described.
     ========================================================================== */

  function rulerBoard(cm, maxCm){
    var g = board(360, 110, 460), i;
    g.appendChild(sv("rect",{x:10,y:34,width:340,height:44,rx:6,fill:"#FFE9B8",stroke:"#B07C2A","stroke-width":2}));
    for(i = 0; i <= maxCm; i++){
      var x = 10 + (340 * i) / maxCm;
      var tall = (i % (maxCm > 12 ? 5 : 1) === 0);
      g.appendChild(sv("line",{x1:x,y1:34,x2:x,y2:tall?58:48,stroke:"#B07C2A","stroke-width":tall?2:1}));
      if(tall) g.appendChild(label(x, 74, i, 11, "#7A5316"));
    }
    /* The object starts at zero, the way a ruler is meant to be used. */
    var end = 10 + (340 * cm) / maxCm;
    g.appendChild(sv("rect",{x:10,y:12,width:(end-10),height:18,rx:5,fill:"#E8563C"}));
    g.appendChild(sv("polygon",{points:(end)+",12 "+(end)+",30 "+(end+9)+",21",fill:"#E8563C"}));
    return g;
  }
  function jugBoard(ml, maxMl){
    var g = board(220, 230, 300), i;
    g.appendChild(sv("path",{d:"M55 20 L55 200 Q55 214 70 214 L150 214 Q165 214 165 200 L165 20",
      fill:"#EAF7FF",stroke:"#2E7FC2","stroke-width":4,"stroke-linecap":"round"}));
    var step = maxMl / 5;
    for(i = 1; i <= 5; i++){
      var y = 206 - (186 * (i * step)) / maxMl;
      g.appendChild(sv("line",{x1:55,y1:y,x2:92,y2:y,stroke:"#2E7FC2","stroke-width":2}));
      g.appendChild(label(118, y + 5, i * step + " ml", 13, "#2E6FA8", "start"));
    }
    var top = 206 - (186 * ml) / maxMl;
    g.appendChild(sv("path",{d:"M57 "+top+" L163 "+top+" L163 200 Q163 212 150 212 L70 212 Q57 212 57 200 Z",
      fill:"#5BC0F0",opacity:"0.85"}));
    return g;
  }
  function scaleBoard(gr, maxG){
    var g = board(240, 230, 300), i;
    g.appendChild(sv("circle",{cx:120,cy:120,r:92,fill:"#FFF7E4",stroke:"#B07C2A","stroke-width":5}));
    for(i = 0; i < 10; i++){
      var a = (-Math.PI * 1.25) + (i * Math.PI * 1.5) / 9;
      var x1 = 120 + Math.cos(a) * 76, y1 = 120 + Math.sin(a) * 76;
      var x2 = 120 + Math.cos(a) * 88, y2 = 120 + Math.sin(a) * 88;
      g.appendChild(sv("line",{x1:x1,y1:y1,x2:x2,y2:y2,stroke:"#B07C2A","stroke-width":2}));
      g.appendChild(label(120 + Math.cos(a) * 62, 120 + Math.sin(a) * 62 + 4,
        Math.round((i * maxG) / 9), 11, "#7A5316"));
    }
    var ang = (-Math.PI * 1.25) + ((gr / maxG) * Math.PI * 1.5);
    g.appendChild(sv("line",{x1:120,y1:120,x2:120 + Math.cos(ang) * 70,y2:120 + Math.sin(ang) * 70,
      stroke:"#E8563C","stroke-width":5,"stroke-linecap":"round"}));
    g.appendChild(sv("circle",{cx:120,cy:120,r:9,fill:"#E8563C"}));
    return g;
  }

  function measureQuestion(b){
    var kinds = b <= 1 ? ["ruler"] : b === 2 ? ["ruler","jug"] : ["ruler","jug","scale"];
    var kind = pick(kinds);
    if(kind === "ruler"){
      var maxCm = b <= 1 ? 10 : b === 2 ? 15 : 20;
      var cm = ri(2, maxCm - 1);
      return {node: rulerBoard(cm, maxCm), prompt:"How long is the red bar?",
        a: cm + " cm", opts: shuffle([cm, cm + 1, Math.max(1, cm - 1), cm + 2]
          .filter(uniqNum()).map(function(n){ return n + " cm"; }))};
    }
    if(kind === "jug"){
      var maxMl = pick([500, 1000]);
      var stepMl = maxMl / 10;
      var ml = stepMl * ri(2, 9);
      return {node: jugBoard(ml, maxMl), prompt:"How much water is in the jug?",
        a: ml + " ml", opts: shuffle([ml, ml + stepMl, Math.max(stepMl, ml - stepMl), ml + stepMl * 2]
          .filter(uniqNum()).map(function(n){ return n + " ml"; }))};
    }
    var maxG = pick([900, 1800]);
    var stepG = maxG / 9;
    var gr = Math.round(stepG * ri(1, 8));
    return {node: scaleBoard(gr, maxG), prompt:"What does the scale read?",
      a: gr + " g", opts: shuffle([gr, Math.round(gr + stepG), Math.max(10, Math.round(gr - stepG)),
        Math.round(gr + stepG * 2)].filter(uniqNum()).map(function(n){ return n + " g"; }))};
  }
  /* The four candidates can collide once a value is clamped, and a grid with
     the same number twice reads as a trick. */
  function uniqNum(){
    var seen = {};
    return function(n){ if(seen[n]) return false; seen[n] = 1; return true; };
  }

  function startMeasure(world){
    var b = band(), rounds = b <= 1 ? 6 : 8;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;
    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var Q = measureQuestion(b);
      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:Q.prompt}));
      speak(Q.prompt);
      var holder = el("div",{"class":"boardwrap"});
      holder.appendChild(Q.node);
      shell.stage.appendChild(holder);
      shell.stage.appendChild(choiceGrid(Q.opts, Q.a, function(ok){
        if(ok){ correct++; sfx.good(); flash("⭐"); } else { sfx.bad(); }
        markDot(shell.dots, i, ok);
        i++;
        setTimeout(next, ok ? 680 : 1050);
      }, false));
    }
    next();
  }

  /* ==========================================================================
     Word Problems
     --------------------------------------------------------------------------
     Built from templates rather than a fixed list, so the numbers are new
     every time and a child cannot learn the answers by heart. The wording
     follows the phrasing the papers use, and every problem is read aloud:
     half of what makes these hard is the reading, not the sum.
     ========================================================================== */

  function wordProblem(b){
    var n1 = WP_NAMES[Math.floor(Math.random() * WP_NAMES.length)];
    var n2 = pick(WP_NAMES.filter(function(x){ return x !== n1; }));
    var th = pick(WP_THINGS);
    var a, x, y, z, text;

    if(b <= 1){
      x = ri(3, 9); y = ri(2, 9);
      if(Math.random() < 0.5){ a = x + y;
        text = n1 + " has " + x + " " + th.p + ". " + n2 + " gives " + n1 + " " + y +
               " more. How many " + th.p + " does " + n1 + " have now?"; }
      else { x = ri(6, 14); y = ri(2, 5); a = x - y;
        text = n1 + " has " + x + " " + th.p + " and gives away " + y +
               ". How many " + th.p + " are left?"; }
    } else if(b === 2){
      var r = Math.random();
      if(r < 0.34){ x = ri(3, 9); y = ri(3, 8); a = x * y;
        text = "There are " + x + " boxes. Each box holds " + y + " " + th.p +
               ". How many " + th.p + " are there altogether?"; }
      else if(r < 0.67){ y = ri(3, 8); a = ri(3, 9); x = y * a;
        text = n1 + " shares " + x + " " + th.p + " equally among " + y +
               " friends. How many " + th.p + " does each friend get?"; }
      else {
        /* Each day has to take from what is actually left, or the story ends
           with a child owing someone eleven marbles. */
        x = ri(24, 60);
        y = ri(5, Math.floor(x / 3));
        z = ri(4, Math.floor((x - y) / 2));
        a = x - y - z;
        text = n1 + " had " + x + " " + th.p + ". " + n1 + " used " + y +
               " on Monday and " + z + " on Tuesday. How many " + th.p + " are left?"; }
    } else {
      var r2 = Math.random();
      if(r2 < 0.3){ y = ri(3, 9); x = ri(12, 40); a = x + y * x;
        text = n1 + " has " + x + " " + th.p + ". " + n2 + " has " + y +
               " times as many. How many " + th.p + " do they have altogether?"; }
      else if(r2 < 0.55){
        /* The stock has to divide cleanly by the percentage, or the answer is
           not a whole number of things and none of the choices is right. */
        var pc = pick([10, 20, 25, 50]);
        var unit = pc === 10 ? 10 : pc === 20 ? 5 : pc === 25 ? 4 : 2;
        x = unit * ri(4, 24); a = x * pc / 100;
        text = "A shop has " + x + " " + th.p + " and sells " + pc +
               "% of them. How many " + th.p + " were sold?"; }
      else if(r2 < 0.8){
        y = ri(4, 9);
        var bags = ri(6, 18), rem = ri(1, y - 1);
        a = y * bags; x = a + rem;
        text = x + " " + th.p + " are packed into bags of " + y + ". " + rem + " " +
               (rem === 1 ? th.s + " is" : th.p + " are") +
               " left over. How many " + th.p + " were packed?"; }
      else { x = ri(3, 8); y = ri(4, 9); a = x * y * 2;
        text = n1 + " buys " + x + " packets with " + y + " " + th.p +
               " in each, then buys the same again. How many " + th.p + " in total?"; }
    }
    var spread = Math.max(2, Math.round(Math.abs(a) * 0.3));
    return {text:text, emo:th.e, a:a, opts:numberOptions(a, spread, b <= 1 ? 3 : 4)};
  }

  function startWordProblems(world){
    var b = band(), rounds = b <= 1 ? 5 : 7;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;
    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var Q = wordProblem(b);
      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"countrow", text:Q.emo}));
      var row = el("div",{"class":"sayrow"});
      row.appendChild(el("div",{"class":"wordprob", text:Q.text}));
      var say = sayButton(Q.text);
      if(say) row.appendChild(say);
      shell.stage.appendChild(row);
      speak(Q.text);
      shell.stage.appendChild(choiceGrid(Q.opts, Q.a, function(ok){
        if(ok){ correct++; sfx.good(); flash("⭐"); } else { sfx.bad(); }
        markDot(shell.dots, i, ok);
        i++;
        setTimeout(next, ok ? 700 : 1200);
      }, false));
    }
    next();
  }

  /* ==========================================================================
     Word games: same meaning, tenses, one or many, animal groups
     --------------------------------------------------------------------------
     All four are the same shape — a prompt, four choices, read aloud — so they
     share one runner and differ only in how a round is built.
     ========================================================================== */

  function wordRound(world, rounds, build){
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;
    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var R = build(i);
      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:R.prompt}));
      if(R.emo) shell.stage.appendChild(el("div",{"class":"countrow", text:R.emo}));
      var row = el("div",{"class":"sayrow"});
      row.appendChild(el("div",{"class":R.small ? "wordprob" : "bigq",
        style: R.small ? "" : "font-size:clamp(28px,7vw,48px)", text:R.subject}));
      var say = sayButton(R.speak || R.subject);
      if(say) row.appendChild(say);
      shell.stage.appendChild(row);
      speak(R.speak || R.subject);
      /* The generic stage-watcher (readStage) would otherwise notice this
         same DOM change 320ms later and read it again itself — from raw
         text it doesn't know is meant to sound different, cutting this
         call off partway through. Priming lastSpoken with what it would
         have read tells it "already done", so this one call is the only
         one heard. */
      lastSpoken = stageQuestion(shell.stage);
      shell.stage.appendChild(choiceGrid(shuffle([R.a].concat(R.x.slice(0, 3))), R.a,
        function(ok){
          if(ok){ correct++; sfx.good(); flash("⭐"); }
          else { sfx.bad(); }
          if(R.after) speak(R.after);
          markDot(shell.dots, i, ok);
          if(R.after) shell.stage.appendChild(el("div",{"class":"fact", text:"💡 " + R.after}));
          i++;
          afterSpeech(next, ok ? 1200 : 1900);
        }, false));
    }
    next();
  }

  function startSynonyms(world){
    var pool = dealBand(world.id, SYNONYMS, 8);
    wordRound(world, 8, function(i){
      var it = pool[i];
      return {prompt:"Which word means nearly the same as…", subject:it.w,
        emo:"💬", a:it.s, x:it.x,
        after:"“" + it.w + "” means nearly the same as “" + it.s + "”"};
    });
  }

  function startTenses(world){
    var pool = dealBand(world.id, TENSES, 8);
    wordRound(world, 8, function(i){
      var it = pool[i];
      return {prompt:"Choose the right form of “" + it.v + "”", subject:it.q,
        small:true, a:it.a, x:it.x, speak:it.q.replace("___","..."),
        after:it.q.replace("___", it.a)};
    });
  }

  function startPlurals(world){
    var pool = dealBand(world.id, PLURALS, 8);
    wordRound(world, 8, function(i){
      var it = pool[i];
      return {prompt:"One " + it.w + ", two…?", subject:it.w,
        a:it.a, x:it.x, speak:"One " + it.w + ". Two what?",
        after:"One " + it.w + ", two " + it.a};
    });
  }

  function startAnimalGroups(world){
    var pool = deal(world.id, ANIMAL_GROUPS, keyer(), 8);
    var groups = [];
    ANIMAL_GROUPS.forEach(function(a){ if(groups.indexOf(a.g) < 0) groups.push(a.g); });
    wordRound(world, 8, function(i){
      var it = pool[i];
      var wrongs = shuffle(groups.filter(function(g){ return g !== it.g; })).slice(0, 3);
      return {prompt:"Which group does this animal belong to?", emo:it.e, subject:it.w,
        a:it.g, x:wrongs, after:"A " + it.w + " is a " + it.g.toLowerCase()};
    });
  }

  /* ==========================================================================
     Number Rally
     --------------------------------------------------------------------------
     A race where the accelerator is arithmetic. Three rivals drive at a steady
     pace down the track; your car only moves when you answer correctly. Get
     one wrong and you skid and lose a little ground.

     The rivals' pace is set from how long a child of that age actually needs
     to read a question and tap an answer, so the race is close rather than
     hopeless or free. A child who answers most questions right wins; one who
     guesses does not.
     ========================================================================== */

  var RIVALS = [
    {e:"🚙", nm:"Blue",   c:"#4AA8E8"},
    {e:"🚕", nm:"Yellow", c:"#F2A93B"},
    {e:"🚓", nm:"Black",  c:"#6B6799"}
  ];
  var MY_CARS = ["🏎️","🚗","🚐","🛻"];

  function startRace(world){
    var b = band();
    var toWin = b === 0 ? 6 : b === 1 ? 8 : 10;      /* correct answers to finish */
    /* Seconds a rival takes to cross. Built from a realistic time per question
       for that age, with enough slack that thinking is not punished. */
    var perQ = b === 0 ? 9 : b === 1 ? 8 : b === 2 ? 7 : 6.5;
    var raceSecs = toWin * perQ * 1.25;

    var shell = gameShell(world, toWin);
    var mine = 0, asked = 0, correct = 0, over = false;
    var myCar = MY_CARS[Math.floor(Math.random() * MY_CARS.length)];

    shell.stage.appendChild(el("div",{"class":"prompt",
      text:"Answer to drive. Every right answer moves you on!"}));

    var track = el("div",{"class":"track-r"});
    var lanes = [];

    /* Your lane first, so the child's eye starts there. */
    function lane(carEmoji, name, isMine){
      var l = el("div",{"class":"lane-r" + (isMine ? " mine" : "")});
      l.appendChild(el("div",{"class":"lane-name", text:name}));
      var strip = el("div",{"class":"lane-strip"});
      var car = el("div",{"class":"lane-car", text:carEmoji});
      strip.appendChild(car);
      l.appendChild(strip);
      track.appendChild(l);
      return {el:l, car:car, strip:strip, at:0};
    }
    var me = lane(myCar, (state.name || "You"), true);
    RIVALS.forEach(function(r){ lanes.push(lane(r.e, r.nm, false)); });

    var flag = el("div",{"class":"finishline", text:"🏁"});
    track.appendChild(flag);
    shell.stage.appendChild(track);

    var qbox = el("div",{"class":"qbox"});
    shell.stage.appendChild(qbox);

    function place(l, frac){
      /* The strip is the road; the car sits along it by percentage, with room
         at the right so it never overruns the flag. */
      l.car.style.left = (Math.max(0, Math.min(1, frac)) * 88) + "%";
    }
    function redraw(){
      place(me, mine / toWin);
      lanes.forEach(function(l){ place(l, l.at); });
    }
    redraw();

    var last = null, elapsed = 0;
    function frame(ts){
      if(over) return;
      if(!document.body.contains(track)){ over = true; return; }
      if(last === null) last = ts;
      var dt = Math.min(0.05, (ts - last) / 1000);
      last = ts;
      elapsed += dt;
      /* Rivals drive at slightly different speeds so the pack spreads out and
         there is always someone to chase. */
      lanes.forEach(function(l, i){
        l.at = Math.min(1, (elapsed / raceSecs) * (0.86 + i * 0.12));
      });
      redraw();
      var leader = Math.max.apply(null, lanes.map(function(l){ return l.at; }));
      if(leader >= 1){ over = true; finishRace(false); return; }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    function nextQuestion(){
      if(over) return;
      qbox.textContent = "";
      var Q = numberQuestion(b, Math.max(1, levelOf("numbers")));
      asked++;
      qbox.appendChild(el("div",{"class":"prompt", text: Q.prompt || "What is…"}));
      if(Q.emoji) qbox.appendChild(el("div",{"class":"countrow", text:Q.emoji.trim()}));
      else qbox.appendChild(el("div",{"class":"bigq", text: qLine(Q)}));
      qbox.appendChild(choiceGrid(Q.opts, Q.a, function(ok){
        if(over) return;
        if(ok){
          correct++; mine++;
          me.car.classList.add("zoom");
          setTimeout(function(){ me.car.classList.remove("zoom"); }, 420);
          sfx.pop();
          rightAnswer(me.car);
          markDot(shell.dots, Math.min(mine, toWin) - 1, true);
        } else {
          /* A skid costs a little ground but never all of it. */
          mine = Math.max(0, mine - 0.5);
          me.car.classList.add("skid");
          setTimeout(function(){ me.car.classList.remove("skid"); }, 420);
          wrongAnswer();
        }
        redraw();
        if(mine >= toWin){ over = true; setTimeout(function(){ finishRace(true); }, 600); return; }
        setTimeout(nextQuestion, ok ? 420 : 800);
      }, false));
    }

    function finishRace(won){
      music.stop();
      var beaten = lanes.filter(function(l){ return l.at < 1; }).length;
      var placeN = won ? 1 : (4 - beaten);
      if(won){ sfx.win(); confettiBurst(90); }
      else sfx.bad();

      var box = el("div",{"class":"result"});
      box.appendChild(el("div",{"class":"stars-big", text: won ? "🏆" : "🏁"}));
      box.appendChild(el("div",{"class":"score display",
        text: won ? "First place!" : (placeN === 2 ? "Second place" : placeN === 3 ? "Third place" : "Fourth place")}));
      box.appendChild(el("div",{style:"font-weight:800; color:#C9C4EE; font-size:16px",
        text: correct + " right out of " + asked + (won ? "" : " — a bit quicker next time and you have them")}));

      /* Scored on the driving, not only the winning: getting them right is the
         point, and a child who answers well but reads slowly still earns. */
      var score = Math.min(toWin, Math.round(correct));
      award(world.id, won ? 3 : score >= toWin * 0.7 ? 2 : score >= toWin * 0.4 ? 1 : 0, won || score >= toWin * 0.7);

      var again = el("button",{"class":"btn btn-lg btn-go", style:"min-width:240px", text:"Race again"});
      again.addEventListener("click", function(){ sfx.tap(); startRace(world); });
      var home = el("button",{"class":"btn btn-lg btn-ghost", style:"min-width:240px", text:"Choose another game"});
      home.addEventListener("click", function(){ sfx.tap(); renderHome(); });
      box.appendChild(again); box.appendChild(home);
      show(box);
    }

    nextQuestion();
  }

  /* ==========================================================================
     Maths Quest
     --------------------------------------------------------------------------
     A hero, an enemy, and a sum between them. Answer correctly and you strike;
     get it wrong and the enemy strikes you. Beat the enemy and the next one is
     a little tougher.

     250 levels, built rather than written out: twenty-five creatures across
     ten tiers gives exactly 250 named enemies, each stronger than the last,
     and a boss on every tenth level. Gear unlocks as you climb, and it has to
     keep pace with the enemies or the whole thing stalls — so damage and hit
     points are tuned against each other and checked by a test that plays all
     250 levels.

     The maths is the same numberQuestion() every other game uses, so a P3
     child fights with times tables and a P6 child fights with ratio and
     speed. The fighting is the wrapper; the syllabus is underneath.

     Nothing is ever lost. Running out of hearts restarts the level, never the
     quest — a nine-year-old who has climbed to level 40 is not going to be
     sent back to the start by this app.
     ========================================================================== */

  var HEROES = [
    {id:"warrior",  nm:"Warrior",  e:"🗡️", c:"#FF8A5B"},
    {id:"princess", nm:"Princess", e:"👸", c:"#FF8AB0"},
    {id:"knight",   nm:"Knight",   e:"🛡️", c:"#63D6FF"},
    {id:"mage",     nm:"Mage",     e:"🧙", c:"#C9B4FF"},
    {id:"ranger",   nm:"Ranger",   e:"🏹", c:"#6FE0B4"},
    {id:"ninja",    nm:"Ninja",    e:"🥷", c:"#9B7BFF"}
  ];

  var FOES = [
    {e:"🟢",nm:"Slime"},    {e:"🦇",nm:"Bat"},      {e:"🕷️",nm:"Spider"},  {e:"🐀",nm:"Rat"},
    {e:"🐺",nm:"Wolf"},     {e:"🦂",nm:"Scorpion"}, {e:"🐍",nm:"Serpent"}, {e:"👻",nm:"Ghost"},
    {e:"🧟",nm:"Zombie"},   {e:"🦈",nm:"Shark"},    {e:"🐗",nm:"Boar"},    {e:"🦅",nm:"Hawk"},
    {e:"🦉",nm:"Owl"},      {e:"🐊",nm:"Croc"},     {e:"🦏",nm:"Rhino"},   {e:"👹",nm:"Ogre"},
    {e:"🗿",nm:"Golem"},    {e:"🧛",nm:"Vampire"},  {e:"🧌",nm:"Troll"},   {e:"🦑",nm:"Kraken"},
    {e:"🔥",nm:"Fire Spirit"}, {e:"❄️",nm:"Ice Spirit"}, {e:"⚡",nm:"Storm Spirit"},
    {e:"🐉",nm:"Dragon"},   {e:"☠️",nm:"Reaper"}
  ];
  var FOE_TIERS = ["Baby","Wild","Fierce","Elder","Shadow","Crystal","Storm","Ancient","Royal","Eternal"];
  var QUEST_LEVELS = FOES.length * FOE_TIERS.length;   /* 250 */

  /* Gear unlocks on the way up. Attack keeps pace with enemy hit points and
     defence keeps pace with their damage; without both, the climb stalls
     somewhere around level 60. */
  var GEAR = [
    {at:1,   slot:"weapon", nm:"Wooden Stick",   e:"🥢", atk:2},
    {at:1,   slot:"armour", nm:"Cloth Shirt",    e:"👕", def:1},
    {at:5,   slot:"weapon", nm:"Short Sword",    e:"🗡️", atk:5},
    {at:10,  slot:"armour", nm:"Leather Vest",   e:"🦺", def:3},
    {at:18,  slot:"weapon", nm:"Battle Axe",     e:"🪓", atk:9},
    {at:26,  slot:"shield", nm:"Round Shield",   e:"🛡️", def:4},
    {at:35,  slot:"weapon", nm:"Silver Blade",   e:"⚔️", atk:15},
    {at:45,  slot:"armour", nm:"Chain Mail",     e:"⛓️", def:8},
    {at:60,  slot:"weapon", nm:"War Hammer",     e:"🔨", atk:23},
    {at:75,  slot:"shield", nm:"Tower Shield",   e:"🔰", def:12},
    {at:90,  slot:"weapon", nm:"Flame Sword",    e:"🔥", atk:34},
    {at:105, slot:"armour", nm:"Knight Plate",   e:"🥋", def:18},
    {at:125, slot:"weapon", nm:"Thunder Spear",  e:"⚡", atk:48},
    {at:145, slot:"shield", nm:"Mirror Shield",  e:"💠", def:26},
    {at:165, slot:"weapon", nm:"Frost Glaive",   e:"❄️", atk:66},
    {at:185, slot:"armour", nm:"Dragon Scale",   e:"🐲", def:36},
    {at:205, slot:"weapon", nm:"Star Blade",     e:"🌟", atk:92},
    {at:225, slot:"shield", nm:"Aegis",          e:"✨", def:50},
    {at:240, slot:"weapon", nm:"Sword of Dawn",  e:"☀️", atk:125}
  ];

  /* Enemies are built from what the hero can actually do at that level, not
     from a curve of their own. Scaling the two separately looked fine on
     paper and produced a wall at level 8 that no amount of correct answers
     could pass: enemy hit points outgrew the gear table, and enemy damage
     outgrew the hearts. Deriving both from the player's numbers means a
     fight is always worth roughly the same number of right answers, and
     surviving always costs roughly the same number of wrong ones, for all
     250 levels and every age. */
  function questHearts(level, def){ return 20 + level * 2 + def * 3; }

  function questFoe(level){
    var n = Math.max(1, Math.min(QUEST_LEVELS, level));
    var idx = (n - 1) % FOES.length;
    var tier = Math.floor((n - 1) / FOES.length);
    var foe = FOES[idx];
    var boss = n % 10 === 0;

    var b = band();
    /* The youngest fight shorter battles, not weaker-looking ones: the level
       number should mean "how far I have come", not "how long this takes". */
    var ease = b === 0 ? 0.55 : b === 1 ? 0.75 : b === 2 ? 0.9 : 1;

    var gear = gearAt(n);
    var myHit = 3 + gear.atk;                 /* the lowest roll, so the worst case */
    var hearts = questHearts(n, gear.def);

    /* What actually decides whether a level is beatable is the accuracy it
       demands: you need `swings` right answers before `survive` wrong ones.
       Four swings early creeping to seven at level 250, against eight wrong
       answers, keeps that around half — a child who gets half their sums
       right still advances. A boss asks for about two thirds. */
    var swings = (4 + n / 84) * ease * (boss ? 1.3 : 1);
    var hp = Math.max(4, Math.round(myHit * swings));

    var survive = (boss ? 6 : 8) / ease;
    var dmg = Math.max(1, Math.round(hearts / survive));

    return {
      name: (boss ? "\u2605 " : "") + FOE_TIERS[tier] + " " + foe.nm,
      emoji: foe.e,
      hp: hp, maxHp: hp, dmg: dmg, boss: boss, level: n
    };
  }

  function gearAt(level){
    var out = {weapon:null, armour:null, shield:null, owned:[]};
    GEAR.forEach(function(g){
      if(g.at <= level){
        out.owned.push(g);
        out[g.slot] = g;           /* the newest of each slot wins */
      }
    });
    out.atk = (out.weapon ? out.weapon.atk : 0);
    out.def = (out.armour ? out.armour.def : 0) + (out.shield ? out.shield.def : 0);
    return out;
  }

  function questState(){
    if(!state.quest || typeof state.quest !== "object"){
      state.quest = {hero:null, level:1, best:1, wins:0};
    }
    var q = state.quest;
    q.level = Math.max(1, Math.min(QUEST_LEVELS, Number(q.level) || 1));
    q.best = Math.max(Number(q.best) || 1, q.level);
    q.wins = Math.max(0, Number(q.wins) || 0);
    return q;
  }

  function startQuest(world){
    var q = questState();
    if(!q.hero){ chooseHero(world); return; }
    runQuestLevel(world);
  }

  function chooseHero(world){
    var box = el("div");
    box.appendChild(el("h2",{"class":"display", text:"Choose your hero"}));
    box.appendChild(el("p",{text:"You will fight 250 enemies with maths. Pick who you want to be — you can change later."}));
    var grid = el("div",{"class":"herogrid"});
    HEROES.forEach(function(h){
      var b = el("button",{"class":"herocard", style:"background:linear-gradient(150deg," + h.c + ",rgba(0,0,0,.25))"});
      b.appendChild(el("div",{"class":"he", text:h.e}));
      b.appendChild(el("div",{"class":"hn", text:h.nm}));
      b.addEventListener("click", function(){
        sfx.pop();
        questState().hero = h.id;
        save();
        m.close();
        runQuestLevel(world);
      });
      grid.appendChild(b);
    });
    box.appendChild(grid);
    var m = modal(box);
    var back = el("button",{"class":"btn btn-lg btn-ghost", style:"width:100%; margin-top:14px", text:"Not now"});
    back.addEventListener("click", function(){ m.close(); renderHome(); });
    box.appendChild(back);
  }

  function heroById(id){
    for(var i=0;i<HEROES.length;i++) if(HEROES[i].id === id) return HEROES[i];
    return HEROES[0];
  }

  function runQuestLevel(world){
    var q = questState();
    var hero = heroById(q.hero);
    var gear = gearAt(q.level);
    var foe = questFoe(q.level);

    var heroMaxHp = questHearts(q.level, gear.def);
    var heroHp = heroMaxHp;
    var asked = 0, hits = 0, over = false;

    var wrap = el("div",{style:"flex:1; min-height:0; display:flex; flex-direction:column"});
    var bar = el("div",{"class":"gamebar"});
    var back = el("button",{"class":"iconbtn","aria-label":"Back to the games", text:"←"});
    back.addEventListener("click", function(){ sfx.tap(); music.stop(); renderHome(); });
    bar.appendChild(back);
    bar.appendChild(el("div",{"class":"dots"}));
    bar.appendChild(el("div",{"class":"tally"}, "⚔️", el("b",{text:"Lv " + q.level})));
    wrap.appendChild(bar);

    var stage = el("div",{"class":"stage questStage"});
    wrap.appendChild(stage);

    /* ---- the arena ---- */
    var arena = el("div",{"class":"arena-q"});

    var foeBox = el("div",{"class":"fighter foe" + (foe.boss ? " boss" : "")});
    foeBox.appendChild(el("div",{"class":"f-name", text:foe.name}));
    var foeSprite = el("div",{"class":"f-e", text:foe.emoji});
    foeBox.appendChild(foeSprite);
    var foeBarOuter = el("div",{"class":"hpbar"});
    var foeBar = el("div",{"class":"hpfill foehp"});
    foeBarOuter.appendChild(foeBar);
    foeBox.appendChild(foeBarOuter);
    var foeHpTxt = el("div",{"class":"hptxt", text:foe.hp + " / " + foe.maxHp});
    foeBox.appendChild(foeHpTxt);
    arena.appendChild(foeBox);

    arena.appendChild(el("div",{"class":"versus", text:"⚔️"}));

    var meBox = el("div",{"class":"fighter me"});
    meBox.appendChild(el("div",{"class":"f-name", text:(state.name || "You") + "  ·  " + hero.nm}));
    var meSprite = el("div",{"class":"f-e", text:hero.e});
    meBox.appendChild(meSprite);
    var meBarOuter = el("div",{"class":"hpbar"});
    var meBar = el("div",{"class":"hpfill mehp"});
    meBarOuter.appendChild(meBar);
    meBox.appendChild(meBarOuter);
    var meHpTxt = el("div",{"class":"hptxt", text:heroHp + " / " + heroMaxHp});
    meBox.appendChild(meHpTxt);
    var kit = el("div",{"class":"kit"});
    ["weapon","armour","shield"].forEach(function(slot){
      var g = gear[slot];
      kit.appendChild(el("div",{"class":"kitslot" + (g ? "" : " empty"),
        title: g ? g.nm : "nothing yet", text: g ? g.e : "·"}));
    });
    meBox.appendChild(kit);
    arena.appendChild(meBox);
    stage.appendChild(arena);

    /* The reward the fight is for. Shown on every level on the way to it,
       not sprung only on the level that hands it over, so "what am I
       playing for" has an answer the whole climb. GEAR is in ascending
       order of level, so the first entry still ahead of us is the next one. */
    var nextGear = null, gi;
    for(gi = 0; gi < GEAR.length; gi++){ if(GEAR[gi].at > q.level){ nextGear = GEAR[gi]; break; } }
    if(nextGear){
      var toGo = nextGear.at - q.level;
      var soon = toGo <= 1;
      var ng = el("div",{"class":"nextgear" + (soon ? " soon" : "")});
      ng.appendChild(el("span",{"class":"ng-e", text:nextGear.e}));
      ng.appendChild(el("span",{}, soon
        ? el("span",{}, el("b",{text:"Win this fight"}), " to unlock " + nextGear.nm +
            " (+" + (nextGear.atk || nextGear.def) + " " + (nextGear.atk ? "attack" : "defence") + ")")
        : el("span",{}, "Next reward: ", el("b",{text:nextGear.nm}),
            " in " + toGo + (toGo === 1 ? " win" : " wins") + " (Level " + nextGear.at + ")")));
      stage.appendChild(ng);
    } else {
      stage.appendChild(el("div",{"class":"nextgear soon"},
        el("span",{"class":"ng-e", text:"👑"}),
        el("span",{}, el("b",{text:hero.nm}), " carries the strongest gear in the realm.")));
    }

    var qbox = el("div",{"class":"qbox"});
    stage.appendChild(qbox);

    show(wrap);
    music.start("heroic");

    function redraw(){
      foeBar.style.width = Math.max(0, foe.hp / foe.maxHp * 100) + "%";
      meBar.style.width = Math.max(0, heroHp / heroMaxHp * 100) + "%";
      foeHpTxt.textContent = Math.max(0, foe.hp) + " / " + foe.maxHp;
      meHpTxt.textContent = Math.max(0, heroHp) + " / " + heroMaxHp;
    }
    redraw();

    function floater(node, text, cls){
      var f = el("div",{"class":"dmg " + cls, text:text});
      node.appendChild(f);
      setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); }, 900);
    }

    function nextQuestion(){
      if(over) return;
      qbox.textContent = "";
      var b = band(), lvl = Math.max(1, levelOf("numbers"));
      var Q = numberQuestion(b, lvl);
      asked++;
      qbox.appendChild(el("div",{"class":"prompt", text: Q.prompt || "What is…"}));
      if(Q.emoji) qbox.appendChild(el("div",{"class":"countrow", text:Q.emoji.trim()}));
      else qbox.appendChild(el("div",{"class":"bigq", text: qLine(Q)}));
      qbox.appendChild(choiceGrid(Q.opts, Q.a, function(ok){
        if(over) return;
        if(ok){
          hits++;
          var dmg = 3 + gear.atk + ri(0, Math.max(1, Math.round(gear.atk * 0.35)));
          foe.hp -= dmg;
          sfx.pop();
          meSprite.classList.add("swing");
          foeSprite.classList.add("hurt");
          floater(foeBox, "-" + dmg, "bad-dmg");
          rightAnswer();
          setTimeout(function(){ meSprite.classList.remove("swing"); foeSprite.classList.remove("hurt"); }, 420);
        } else {
          var taken = Math.max(1, foe.dmg - ri(0, gear.def));
          heroHp -= taken;
          wrongAnswer();
          foeSprite.classList.add("swing");
          meSprite.classList.add("hurt");
          floater(meBox, "-" + taken, "bad-dmg");
          setTimeout(function(){ foeSprite.classList.remove("swing"); meSprite.classList.remove("hurt"); }, 420);
        }
        redraw();

        if(foe.hp <= 0){ over = true; setTimeout(victory, 700); return; }
        if(heroHp <= 0){ over = true; setTimeout(defeat, 700); return; }
        setTimeout(nextQuestion, ok ? 620 : 1000);
      }, false));
    }

    function victory(){
      music.stop();
      sfx.win();
      confettiBurst(foe.boss ? 110 : 55);
      q.wins++;
      var wasLevel = q.level;
      q.level = Math.min(QUEST_LEVELS, q.level + 1);
      q.best = Math.max(q.best, q.level);
      /* The quest is its own ladder, but a win still feeds the stars the rest
         of the app runs on. */
      award(world.id, foe.boss ? 3 : 1, true);
      save();

      var newGear = GEAR.filter(function(g){ return g.at === q.level; });

      var box = el("div",{"class":"result"});
      box.appendChild(el("div",{"class":"stars-big", text: foe.boss ? "🏆" : "⚔️"}));
      box.appendChild(el("div",{"class":"score display", text: foe.name + " defeated!"}));
      box.appendChild(el("div",{style:"font-weight:800; color:#C9C4EE; font-size:16px",
        text: hits + " of " + asked + " right  ·  level " + wasLevel + " cleared"}));

      if(q.level > wasLevel){
        box.appendChild(el("div",{style:"font-weight:800; color:#FFD98A; font-size:17px",
          text:"⬆️  Level " + q.level + " of " + QUEST_LEVELS}));
      }
      newGear.forEach(function(g){
        box.appendChild(el("div",{"class":"gearwin"},
          el("span",{"class":"gw-e", text:g.e}),
          el("span",{}, el("b",{text:"New " + g.slot + "!  "}), g.nm +
            (g.atk ? "  +" + g.atk + " attack" : "  +" + g.def + " defence"))));
        setTimeout(function(){ sfx.levelup(); }, 400);
      });

      var on = el("button",{"class":"btn btn-lg btn-go", style:"min-width:240px", text:
        q.level > wasLevel ? "Fight level " + q.level : "Fight again"});
      on.addEventListener("click", function(){ sfx.tap(); runQuestLevel(world); });
      var home = el("button",{"class":"btn btn-lg btn-ghost", style:"min-width:240px", text:"Choose another game"});
      home.addEventListener("click", function(){ sfx.tap(); renderHome(); });
      box.appendChild(on); box.appendChild(home);
      show(box);
    }

    function defeat(){
      music.stop();
      sfx.bad();
      /* No penalty beyond trying again. Losing a level you have already
         reached would be a cruel thing to do to a child learning tables. */
      var box = el("div",{"class":"result"});
      box.appendChild(el("div",{"class":"stars-big", text:"💫"}));
      box.appendChild(el("div",{"class":"score display", text:"Out of hearts!"}));
      box.appendChild(el("div",{style:"font-weight:800; color:#C9C4EE; font-size:16px",
        text: foe.name + " was too strong this time. You keep level " + q.level + " — have another go."}));
      var again = el("button",{"class":"btn btn-lg btn-go", style:"min-width:240px", text:"Try level " + q.level + " again"});
      again.addEventListener("click", function(){ sfx.tap(); runQuestLevel(world); });
      var home = el("button",{"class":"btn btn-lg btn-ghost", style:"min-width:240px", text:"Choose another game"});
      home.addEventListener("click", function(){ sfx.tap(); renderHome(); });
      box.appendChild(again); box.appendChild(home);
      show(box);
    }

    nextQuestion();
  }

  /* ---------- Harbour Cannon ----------
   *
   * Boats sail across the harbour carrying a number. The cannon holds a shell
   * with a number of its own, and a boat can only be sunk when the shell beats
   * it. Everything else in here teaches "greater than" with a symbol between
   * two numbers; this asks a child to do it twenty times a minute with a boat
   * getting away.
   *
   * Boat size follows the number: the little skiffs carry the small numbers
   * and the cargo ships the big ones, so the picture and the arithmetic agree.
   * That is the whole point of the sizes, not decoration.
   *
   * From P3 the shell stops being a plain number and becomes a sum, so the
   * child works it out before deciding — the comparison is the easy half by
   * then.
   */
  function cannonSpec(r){
    if(r <= 2) return {                       // Nursery to K2
      lo:1, hi:12, shellLo:2, shellHi:14,
      shot:function(v){ return {label:String(v), value:v}; }
    };
    if(r <= 4) return {                       // P1, P2
      lo:5, hi:80, shellLo:8, shellHi:99,
      shot:function(v){ return {label:String(v), value:v}; }
    };
    if(r <= 6) return {                       // P3, P4 — work the shell out first
      lo:10, hi:110, shellLo:12, shellHi:144,
      shot:function(v){
        /* Find a times-table pair that lands near the wanted value, so the
           shell is a sum but still beats what it needs to. */
        var best = null, a, c;
        for(a = 2; a <= 12; a++){
          c = Math.round(v / a);
          if(c < 2 || c > 12) continue;
          var got = a * c;
          if(got < v) continue;
          if(!best || got < best.value) best = {label:a + " × " + c, value:got};
        }
        return best || {label:String(v), value:v};
      }
    };
    return {                                  // P5, P6 — percentages and fractions
      lo:10, hi:200, shellLo:12, shellHi:240,
      shot:function(v){
        var kinds = [
          function(){ var pc = pick([10,20,25,50,75]); var whole = Math.ceil(v / (pc/100) / 10) * 10;
            return {label:pc + "% of " + whole, value:whole * pc / 100}; },
          function(){ var den = pick([2,3,4,5]); var num = ri(1, den - 1);
            var whole = Math.ceil(v / (num/den) / den) * den;
            return {label:num + "/" + den + " of " + whole, value:whole / den * num}; },
          function(){ var a = ri(4, 15); return {label:a + " × " + Math.ceil(v / a), value:a * Math.ceil(v / a)}; }
        ];
        var s = pick(kinds)();
        return (s.value >= v && isFinite(s.value)) ? s : {label:String(v), value:v};
      }
    };
  }

  /* The hull and sails are mirrored for a boat sailing the other way, but the
     number is drawn outside that group — flipping the whole thing printed the
     numbers backwards, which is a cruel thing to do in a comparison game. */
  function boatSvg(w, h, hull, sail, num, facingLeft){
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 120 100");
    svg.setAttribute("width", w); svg.setAttribute("height", h);

    function make(tag, attrs, into){
      var e = document.createElementNS(ns, tag), k;
      for(k in attrs) e.setAttribute(k, attrs[k]);
      (into || svg).appendChild(e); return e;
    }

    var g = make("g", facingLeft ? {transform:"translate(120,0) scale(-1,1)"} : {});
    make("path", {d:"M14 92 L4 64 H116 L106 92 Z", fill:hull}, g);          // hull
    make("path", {d:"M4 64 H116 L113 58 H7 Z", fill:"rgba(0,0,0,.24)"}, g); // deck line
    make("rect", {x:"56", y:"8", width:"5", height:"52", rx:"2.5", fill:"#6B4A2A"}, g);
    make("path", {d:"M61 10 L104 56 H61 Z", fill:sail}, g);                 // main sail
    make("path", {d:"M55 18 L26 56 H55 Z", fill:sail, opacity:".8"}, g);    // fore sail
    make("path", {d:"M0 92 H120 L118 100 H2 Z", fill:"rgba(255,255,255,.34)"}, g); // wake

    /* The number sits on a white plate so it reads against any sail colour. */
    var label = String(num);
    var plateW = Math.max(34, 15 + label.length * 15);
    make("rect", {x:String(60 - plateW/2), y:"26", width:String(plateW), height:"34",
      rx:"12", fill:"#FFFFFF", opacity:".94"});
    var t = make("text", {x:"60", y:"51", "text-anchor":"middle",
      "font-family":"Baloo 2, sans-serif", "font-weight":"800",
      "font-size": label.length > 3 ? "20" : "26", fill:"#1B1743"});
    t.textContent = label;
    return svg;
  }

  function startCannon(world){
    var r = rank(), spec = cannonSpec(r);
    var shots = 10;
    var shell = gameShell(world, shots);
    var fired = 0, hits = 0, running = true, live = [];

    /* Three classes of boat. The number a boat carries is drawn from its own
       slice of the range, so size really does mean magnitude. */
    var span = spec.hi - spec.lo;
    /* A three-year-old aiming at a moving target needs longer than a P6 child.
       Small boats are the quick ones, so this matters most to them. */
    var pace = r <= 2 ? 0.58 : r <= 4 ? 0.78 : 1;
    var CLASSES = [
      {nm:"small",  w:88,  speed:0.30, lo:spec.lo,                     hi:spec.lo + Math.round(span*0.33), hull:"#FF8A5B", sail:"#FFE3B0"},
      {nm:"medium", w:120, speed:0.21, lo:spec.lo + Math.round(span*0.33), hi:spec.lo + Math.round(span*0.66), hull:"#35C48F", sail:"#D6F5E7"},
      {nm:"big",    w:146, speed:0.14, lo:spec.lo + Math.round(span*0.66), hi:spec.hi,                        hull:"#9B7BFF", sail:"#E7DEFF"}
    ];

    /* Every lane is as tall as the largest boat, so lane geometry needs it. */
    var BOAT_RATIO = 0.72;
    var maxBoatH = 0;
    CLASSES.forEach(function(c){ maxBoatH = Math.max(maxBoatH, Math.round(c.w * BOAT_RATIO)); });

    shell.stage.appendChild(el("div",{"class":"prompt",
      text:"Sink a boat only if your shell is BIGGER than its number"}));

    /* A round ends on ten shots or when the clock runs out, whichever comes
       first. Without the clock a child who never fires sits there forever. */
    var seconds = r <= 2 ? 75 : 60;
    var timer = el("div",{"class":"timerpill"}, "⏱", el("b",{text:String(seconds)}));
    shell.stage.appendChild(timer);

    var sea = el("div",{"class":"sea"});
    sea.appendChild(el("div",{"class":"sea-sun", text:"☀️"}));
    sea.appendChild(el("div",{"class":"sea-sky"}));
    sea.appendChild(el("div",{"class":"sea-wave"}));
    shell.stage.appendChild(sea);

    var deck = el("div",{"class":"gundeck"});
    var gun = el("div",{"class":"gun"});
    gun.appendChild(el("div",{"class":"gun-barrel", text:"🔫"}));
    var shellBox = el("div",{"class":"gun-shell"});
    shellBox.appendChild(el("div",{"class":"gs-l", text:"YOUR SHELL"}));
    var shellVal = el("div",{"class":"gs-v", text:"—"});
    shellBox.appendChild(shellVal);
    gun.appendChild(shellBox);
    deck.appendChild(gun);
    var reload = el("button",{"class":"btn btn-ghost reloadbtn", text:"🔄  New shell"});
    deck.appendChild(reload);
    shell.stage.appendChild(deck);

    var current = null;

    /* The shell is always rolled so that something on the water can be sunk —
       otherwise a child can be handed a 3 with nothing but cargo ships in
       sight and told to try harder. */
    function rollShell(){
      var beatable = live.filter(function(bt){ return !bt._gone; })
                         .map(function(bt){ return bt._n; }).sort(function(a,b){ return a-b; });
      var want;
      if(beatable.length){
        var floorN = beatable[0];
        var ceilN = beatable[beatable.length - 1] + 6;
        want = ri(floorN + 1, Math.max(floorN + 1, Math.min(ceilN, spec.shellHi)));
      } else {
        want = ri(spec.shellLo, spec.shellHi);
      }
      current = spec.shot(want);
      shellVal.textContent = current.label;
      shellVal.classList.remove("swap"); void shellVal.offsetWidth; shellVal.classList.add("swap");
    }

    reload.addEventListener("click", function(){
      if(!running) return;
      sfx.swoosh(); rollShell();
    });

    function spawn(){
      if(!running) return;
      var cls = pick(CLASSES);
      var n = ri(cls.lo, Math.max(cls.lo, cls.hi));
      var rightToLeft = Math.random() < .5;
      var w = cls.w, h = Math.round(w * BOAT_RATIO);

      var bt = el("button",{"class":"boat", "aria-label":"Boat carrying " + n});
      bt.appendChild(boatSvg(w, h, cls.hull, cls.sail, n, rightToLeft));
      bt._n = n; bt._w = w;
      bt._dir = rightToLeft ? -1 : 1;
      bt._speed = cls.speed * pace * (0.85 + Math.random() * 0.35);
      var W = sea.clientWidth || 320;
      bt._x = rightToLeft ? W + 10 : -w - 10;

      /* One boat to a lane. Guarding only the lane entrance was not enough:
         a quick little skiff put behind a slow cargo ship in the same lane
         catches up and sits on top of it, and two numbers on top of each
         other is the one thing this game cannot afford. A lane is taken until
         its boat has sailed out. */
      var seaH = sea.clientHeight || 300;
      /* The lane pitch is the height of the biggest boat, not of this one.
         Spacing lanes by the current boat's height let a cargo ship in one
         lane hang into the skiff's lane below it. Every boat then sits on the
         bottom of its band, so they all share a waterline. */
      var laneTop = Math.round(seaH * 0.29);
      var band = maxBoatH + 6;
      var lanes = Math.max(2, Math.min(4, Math.floor((seaH - 12 - laneTop) / band)));
      var free = [], li;
      for(li = 0; li < lanes; li++){
        if(live.some(function(o){ return o._lane === li; })) continue;
        free.push({i:li, y: laneTop + li * band + (maxBoatH - h)});
      }
      if(!free.length) return;
      var lane = pick(free);
      bt._lane = lane.i;
      bt.style.top = lane.y + "px";

      bt.addEventListener("click", function(){
        if(!running || bt._gone || !current) return;
        bt._gone = true;
        fired++;
        var won = current.value > bt._n;
        if(won){
          hits++;
          bt.classList.add("sunk");
          sfx.pop();
          rightAnswer(bt);
          splash(bt);
        } else {
          bt.classList.add("bounced");
          wrongAnswer();
          banner(current.label + " is not bigger than " + bt._n);
          /* A boat that shrugged off the shell keeps sailing. */
          setTimeout(function(){ if(bt.parentNode) bt._gone = false, bt.classList.remove("bounced"); }, 700);
        }
        markDot(shell.dots, Math.min(fired, shots) - 1, won);
        if(won){
          setTimeout(function(){
            if(bt.parentNode) bt.parentNode.removeChild(bt);
            var ix = live.indexOf(bt); if(ix >= 0) live.splice(ix, 1);
          }, 560);
        }
        if(fired >= shots){ end(); return; }
        setTimeout(rollShell, won ? 520 : 260);
      });

      sea.appendChild(bt);
      live.push(bt);
      if(!current) rollShell();
    }

    function splash(bt){
      var s = el("div",{"class":"splash", text:"💦"});
      s.style.left = (bt._x + bt._w / 2) + "px";
      s.style.top = bt.style.top;
      sea.appendChild(s);
      setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 800);
    }

    /* Spawns are attempted often because some are refused for want of a free
       lane; the lanes themselves are what limit how busy the water gets. */
    var spawner = setInterval(spawn, r <= 2 ? 900 : 700);
    spawn(); spawn(); spawn();

    var tick = setInterval(function(){
      if(!running) return;
      seconds--;
      timer.lastChild.textContent = String(seconds);
      if(seconds <= 0) end();
    }, 1000);

    var last = null;
    function frame(ts){
      if(!running) return;
      if(!document.body.contains(sea)){ running = false; clearInterval(spawner); clearInterval(tick); return; }
      if(last === null) last = ts;
      var dt = Math.min(0.05, (ts - last) / 1000);
      last = ts;
      var W2 = sea.clientWidth || 320, i, bt;
      for(i = live.length - 1; i >= 0; i--){
        bt = live[i];
        bt._x += bt._dir * W2 * bt._speed * dt;
        bt.style.transform = "translateX(" + bt._x + "px)";
        if(bt._x > W2 + bt._w + 20 || bt._x < -bt._w - 20){
          if(bt.parentNode) bt.parentNode.removeChild(bt);
          live.splice(i, 1);
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    function end(){
      if(!running) return;
      running = false;
      clearInterval(spawner); clearInterval(tick);
      /* Out of time with shots to spare is scored on what was fired, so a
           careful child is not punished for taking aim. */
      var outOf = fired > 0 ? Math.max(fired, Math.min(shots, fired)) : shots;
      setTimeout(function(){ finish(world, hits, outOf); }, 700);
    }
  }

  /* ==========================================================================
     English, P1 to P6

     The subject had three games and nothing above P4. These seven cover what
     the MOE syllabus asks for at each level, and between them they reach from
     K1 opposites to P6 comprehension.
     ========================================================================== */

  /* ---------- Opposites ---------- */
  function startOpposites(world){
    var pool = forBand(OPPOSITES, band()), rounds = 8;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0, order = dealBand(world.id, OPPOSITES, rounds);

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var it = order[i];
      /* One extra distractor is pulled from another pair, so three of the four
         are real words a child has met. */
      var extra = pick(pool.filter(function(x){ return x.w !== it.w; }));
      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:"What is the opposite of…"}));
      var row = el("div",{"class":"sayrow"});
      row.appendChild(el("div",{"class":"bigq", style:"font-size:clamp(34px,8vw,56px)", text:it.w}));
      var say = sayButton(it.w);
      if(say) row.appendChild(say);
      shell.stage.appendChild(row);
      speak(it.w);
      var wrongs = it.x.slice();
      if(extra && extra.o !== it.o && wrongs.indexOf(extra.o) < 0) wrongs.push(extra.o);
      shell.stage.appendChild(choiceGrid(
        shuffle([it.o].concat(wrongs.slice(0, 3))),
        it.o, function(ok){
          if(ok){ correct++; sfx.good(); flash("⭐"); speak(it.w + " … " + it.o); } else { sfx.bad(); }
          markDot(shell.dots, i, ok);
          i++;
          afterSpeech(next, ok ? 700 : 1100);
        }, false));
    }
    next();
  }

  /* ---------- Grammar Fix ---------- */
  function startGrammar(world){
    var pool = forBand(GRAMMAR, band()), rounds = 8;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0, order = dealBand(world.id, GRAMMAR, rounds);

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var it = order[i];
      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:"Which word fits the gap?"}));
      shell.stage.appendChild(el("div",{"class":"sentence", text:it.q}));
      shell.stage.appendChild(choiceGrid(shuffle([it.a].concat(it.x)), it.a, function(ok){
        if(ok){ correct++; rightAnswer(); flash("⭐"); } else { wrongAnswer(); }
        /* The rule matters more than the mark, so it is always shown. */
        shell.stage.appendChild(el("div",{"class":"why", text: it.r}));
        if(ok) speak(it.q.replace("___", it.a));
        else speak(it.a + ". " + it.r);
        markDot(shell.dots, i, ok);
        i++;
        afterSpeech(next, ok ? 1100 : 2400);
      }, false));
    }
    next();
  }

  /* A drag-to-reorder word tray shared by Sentence Builder and the "hear a
     kid's own sentence as a game" screen: chips start jumbled in a tray and
     get dragged into a line to build the sentence, reordered within the
     line, or dragged back out to the tray — rather than only being
     tappable in one fixed correct order that fails the round on the first
     slip. Touch and mouse both work through Pointer Events, since native
     HTML5 drag-and-drop does not work reliably on touch devices. Calls
     onSubmit(builtWords) once a child taps Submit with every word placed,
     and returns {lock} to disable further dragging once that happens. */
  function buildWordOrderer(stage, words, onSubmit){
    var line = el("div",{"class":"sentline dropzone"});
    var tray = el("div",{"class":"wordtray dropzone"});
    stage.appendChild(line);
    stage.appendChild(tray);
    var submitBtn = el("button",{"class":"btn btn-lg btn-pink", style:"margin-top:4px; visibility:hidden", text:"Submit"});
    stage.appendChild(submitBtn);

    function refreshGhost(){
      var hasChip = !!line.querySelector(".wordchip");
      var ghost = line.querySelector(".sentghost");
      if(hasChip){ if(ghost) ghost.remove(); }
      else if(!ghost){ line.appendChild(el("span",{"class":"sentghost", text:"Drag words here"})); }
    }
    function refreshSubmit(){
      submitBtn.style.visibility = line.querySelectorAll(".wordchip").length === words.length ? "visible" : "hidden";
    }

    /* Which existing chip in a row-wrapping flex container a dropped chip
       should land before: above a later row, or before the first sibling
       on the same row that sits to the right of the pointer. */
    function insertAtPoint(container, chip, x, y){
      var siblings = Array.prototype.filter.call(container.children, function(c){
        return c !== chip && c.classList.contains("wordchip");
      });
      var before = null;
      for(var k = 0; k < siblings.length; k++){
        var r = siblings[k].getBoundingClientRect();
        if(y < r.top - 4){ before = siblings[k]; break; }
        if(y <= r.bottom + 4 && x < r.left + r.width / 2){ before = siblings[k]; break; }
      }
      container.insertBefore(chip, before);
    }

    var drag = null;
    /* Moving the dragged chip to a new parent mid-drag (insertAtPoint, for
       the live reordering below) can silently release its pointer capture
       in some browsers — Chromium in this app's own test harness among
       them — so the final pointerup can land on whatever is now
       underneath instead of on the chip that captured it. A document-level
       listener is the fallback that always sees it regardless of which
       element the browser decided was the target; drag is nulled the
       first time either this or the chip's own handler runs, so having
       both wired is harmless on a browser where capture behaves normally. */
    function endDrag(e){
      if(!drag) return;
      var chip = drag.chip;
      var over = document.elementFromPoint(e.clientX, e.clientY);
      var zone = (over && over.closest(".dropzone")) || tray;
      chip.classList.remove("dragging");
      chip.style.left = ""; chip.style.top = ""; chip.style.width = "";
      line.classList.remove("dragover"); tray.classList.remove("dragover");
      if(zone === line) insertAtPoint(line, chip, e.clientX, e.clientY);
      else tray.appendChild(chip);
      drag = null;
      refreshGhost(); refreshSubmit();
    }
    document.addEventListener("pointerup", endDrag);
    document.addEventListener("pointercancel", endDrag);

    function wire(chip){
      chip.addEventListener("pointerdown", function(e){
        if(submitBtn.disabled) return;
        e.preventDefault();
        try{ chip.setPointerCapture(e.pointerId); }catch(err){}
        var r = chip.getBoundingClientRect();
        drag = {chip:chip, offX:e.clientX - r.left, offY:e.clientY - r.top};
        chip.style.width = r.width + "px";
        chip.style.left = r.left + "px";
        chip.style.top = r.top + "px";
        chip.classList.add("dragging");
        sfx.tap();
      });
      chip.addEventListener("pointermove", function(e){
        if(!drag || drag.chip !== chip) return;
        chip.style.left = (e.clientX - drag.offX) + "px";
        chip.style.top = (e.clientY - drag.offY) + "px";
        var over = document.elementFromPoint(e.clientX, e.clientY);
        var zone = over && over.closest(".dropzone");
        line.classList.toggle("dragover", zone === line);
        tray.classList.toggle("dragover", zone === tray);
        if(zone === line) insertAtPoint(line, chip, e.clientX, e.clientY);
      });
      /* Not also wired here: with capture unreliable across reparenting,
         a pointerup landing on both this chip and the document listener
         for the same event risks endDrag reparenting the node mid-bubble.
         The document-level listener alone is sufficient — it reads
         clientX/clientY directly rather than relying on e.target. */
    }

    var jumbled = shuffle(words.slice());
    if(jumbled.length > 2 && jumbled.join(" ") === words.join(" ")) jumbled = shuffle(jumbled);
    jumbled.forEach(function(w){
      var chip = el("button",{"class":"wordchip", text:w});
      wire(chip);
      tray.appendChild(chip);
    });
    refreshGhost(); refreshSubmit();

    submitBtn.addEventListener("click", function(){
      sfx.tap();
      var built = Array.prototype.map.call(line.querySelectorAll(".wordchip"), function(c){ return c.textContent; });
      onSubmit(built);
    });

    return {
      lock: function(){
        submitBtn.disabled = true;
        submitBtn.style.display = "none";
        document.removeEventListener("pointerup", endDrag);
        document.removeEventListener("pointercancel", endDrag);
      }
    };
  }

  /* ---------- Sentence Builder ---------- */
  function startSentence(world){
    var pool = forBand(SENTENCES, band()), rounds = 5;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0, order = dealBand(world.id, SENTENCES, rounds);

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var words = order[i].s.split(" ");
      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:"Drag the words into the right order"}));
      var orderer = buildWordOrderer(shell.stage, words, function(built){
        orderer.lock();
        var ok = built.join(" ") === words.join(" ");
        if(ok){ correct++; sfx.good(); flash("⭐"); speak(words.join(" ")); }
        else {
          sfx.bad();
          shell.stage.appendChild(el("div",{"class":"why", text:"The right order was: " + words.join(" ")}));
        }
        markDot(shell.dots, i, ok);
        i++;
        afterSpeech(next, ok ? 1500 : 2200);
      });
    }
    next();
  }

  /* ---------- Punctuation ---------- */
  function startPunct(world){
    var pool = forBand(PUNCT, band()), rounds = 6;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0, order = dealBand(world.id, PUNCT, rounds);

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var it = order[i];
      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:"Which one is written correctly?"}));
      var opts = shuffle([it.a].concat(it.x));
      var grid = el("div",{"class":"sentchoices"});
      var locked = false;
      opts.forEach(function(o){
        var btn = el("button",{"class":"sentchoice", text:o});
        btn.addEventListener("click", function(){
          if(locked) return;
          locked = true;
          var ok = o === it.a;
          btn.classList.add(ok ? "right" : "wrong");
          if(!ok){
            Array.prototype.forEach.call(grid.children, function(c){
              if(c.textContent === it.a) c.classList.add("right");
            });
            sfx.bad();
          } else { correct++; sfx.good(); flash("⭐"); }
          markDot(shell.dots, i, ok);
          i++;
          setTimeout(next, ok ? 800 : 1700);
        });
        grid.appendChild(btn);
      });
      shell.stage.appendChild(grid);
    }
    next();
  }

  /* ---------- Word Meaning ---------- */
  function startMeaning(world){
    var pool = forBand(MEANINGS, band()), rounds = 8;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0, order = dealBand(world.id, MEANINGS, rounds);

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var it = order[i];
      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:"What does the word in bold mean?"}));
      /* The sentence is given because context is how the syllabus wants these
         worked out, not a bare dictionary lookup. */
      shell.stage.appendChild(el("div",{"class":"sentence", text:it.s}));
      var row = el("div",{"class":"sayrow"});
      row.appendChild(el("div",{"class":"bigq", style:"font-size:clamp(28px,6.5vw,44px)", text:it.w}));
      var say = sayButton(it.s);
      if(say) row.appendChild(say);
      shell.stage.appendChild(row);
      speak(it.s);
      shell.stage.appendChild(choiceGrid(shuffle([it.a].concat(it.x)), it.a, function(ok){
        if(ok){ correct++; rightAnswer(); flash("⭐"); } else { wrongAnswer(); }
        markDot(shell.dots, i, ok);
        i++;
        setTimeout(next, ok ? 750 : 1300);
      }, false));
    }
    next();
  }

  /* ---------- Idioms ---------- */
  function startIdioms(world){
    var pool = forBand(IDIOMS, band()), rounds = 6;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0, order = dealBand(world.id, IDIOMS, rounds);

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var it = order[i];
      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:"What does this saying mean?"}));
      var row = el("div",{"class":"sayrow"});
      row.appendChild(el("div",{"class":"idiom", text:"\u201c" + it.i + "\u201d"}));
      var say = sayButton(it.i);
      if(say) row.appendChild(say);
      shell.stage.appendChild(row);
      speak(it.i);
      shell.stage.appendChild(choiceGrid(shuffle([it.a].concat(it.x)), it.a, function(ok){
        if(ok){ correct++; rightAnswer(); flash("⭐"); } else { wrongAnswer(); }
        markDot(shell.dots, i, ok);
        i++;
        setTimeout(next, ok ? 800 : 1400);
      }, false));
    }
    next();
  }

  /* ---------- Prefix & Suffix ---------- */
  function startAffix(world){
    var pool = forBand(AFFIXES, band()), rounds = 8;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0, order = dealBand(world.id, AFFIXES, rounds);

      shell.stage.appendChild(choiceGrid(shuffle([it.a].concat(it.x)), it.a, function(ok){

        markDot(shell.dots, i, ok);

  /* ---------- Reading Detective ---------- */
  /* A short passage, then one question about what it says and one about what
     it means — the two halves of comprehension the syllabus separates. */
  function startReading(world){
    var piece = dealBand(world.id, PASSAGES, 1)[0];
    var qs = piece.qs;
    var shell = gameShell(world, qs.length);
    var i = 0, correct = 0;

      shell.stage.appendChild(el("div",{"class":"prompt", text: piece.t}));
      var prow = el("div",{"class":"sayrow"});

      if(say){
        var sr = el("div",{"class":"sayrow"});
        sr.appendChild(say);
        sr.appendChild(el("div",{"class":"sayhint", text:"Tap to hear the passage"}));
        shell.stage.appendChild(sr);
      }
      shell.stage.appendChild(el("div",{"class":"sentence", text: q.q}));
      shell.stage.appendChild(choiceGrid(shuffle([q.a].concat(q.x)), q.a, function(ok){
        if(ok){ correct++; rightAnswer(); flash("⭐"); } else { wrongAnswer(); }
        markDot(shell.dots, i, ok);
        i++;
        setTimeout(next, ok ? 850 : 1500);
      }, false));
