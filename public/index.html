    /* The classic Chinese pentatonic (gong mode: do-re-mi-sol-la, no fa or
       ti) is what actually reads as "Chinese" to most ears — Mo Li Hua and
       most folk melodies are built on it. leadDur is much shorter than the
       other moods' so the same oscillator envelope plucks rather than
       sustains, closer to a guzheng than a held pad. */
    eastern: {root:220.00, scale:[0,2,4,7,9],      chords:[[0,4,7],[2,7,11],[0,4,9],[5,9,14]],   bpm:58, wave:"triangle",  pad:0.030, lead:0.052, leadDur:0.55},
    curious: {root:233.08, scale:[0,2,5,7,10],     chords:[[0,5,10],[3,7,12],[5,10,15],[0,7,12]],bpm:68, wave:"triangle", pad:0.028, lead:0.040},
    mystery: {root:174.61, scale:[0,3,5,7,10],     chords:[[0,3,7],[5,8,12],[3,7,10],[7,10,14]], bpm:54, wave:"sine",     pad:0.034, lead:0.038},
    sea:     {root:196.00, scale:[0,2,4,7,9,11],   chords:[[0,4,7],[2,7,11],[5,9,12],[4,7,11]],  bpm:70, wave:"sine",     pad:0.030, lead:0.044},
    bouncy:  {root:293.66, scale:[0,2,4,7,9],      chords:[[0,4,7],[5,9,12],[7,11,14],[0,4,9]],  bpm:92, wave:"triangle", pad:0.022, lead:0.040},
    heroic:  {root:174.61, scale:[0,2,3,5,7,8,10],  chords:[[0,3,7],[5,8,12],[7,10,14],[3,7,10]], bpm:84, wave:"triangle", pad:0.030, lead:0.046},
    sunny:   {root:246.94, scale:[0,2,4,7,9,11],   chords:[[0,4,7],[7,11,14],[2,5,9],[5,9,12]],  bpm:80, wave:"sine",     pad:0.026, lead:0.042}
  };

  /* Which mood a subject gets. Related games share one so moving between
     them does not feel like changing radio station. */
  var SUBJECT_MOOD = {
    maths:"calm", english:"bright", chinese:"eastern", think:"curious",
    science:"sunny", inspect:"mystery", music:"bright", guess:"curious",
    quick:"bouncy", duo:"bouncy"
  };
  /* A few games are distinctive enough to deserve their own. */
  var GAME_MOOD = { quest:"heroic", race:"bouncy", cannon:"sea", homes:"sunny", lifecycle:"sunny", foodchain:"sunny",
    detective:"mystery", shadow:"mystery", mystery:"mystery", riddle:"curious",
    duomaths:"bouncy", duoword:"bouncy", reading:"calm" };

  var music = (function(){
    var master = null, timer = null, mood = null;
    var step = 0, nextTime = 0, playing = false;
    var LOOKAHEAD = 0.35, TICK = 90;

    function ctx(){
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      return actx;
    }
    function freq(root, semi){ return root * Math.pow(2, semi / 12); }

    function voice(f, at, dur, wave, vol){
      var c = ctx();
      var o = c.createOscillator(), g = c.createGain();
      o.type = wave; o.frequency.setValueAtTime(f, at);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(vol, at + 0.06);
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      o.connect(g); g.connect(master);
      o.start(at); o.stop(at + dur + 0.05);
    }

    function schedule(){
      if(!playing || !mood) return;
      var c = ctx();
      var beat = 60 / mood.bpm;
      while(nextTime < c.currentTime + LOOKAHEAD){
        var bar = Math.floor(step / 8) % mood.chords.length;
        var chord = mood.chords[bar];
        var inBar = step % 8;

        /* A soft pad on the first beat of each bar, long and very quiet. */
        if(inBar === 0){
          chord.forEach(function(semi, i){
            voice(freq(mood.root, semi - 12), nextTime, beat * 7.5,
              "sine", mood.pad * (i === 0 ? 1 : 0.7));
          });
        }
        /* An arpeggio that wanders rather than repeats: mostly chord tones,
           sometimes a passing note from the scale, and some beats left silent
           so it breathes. */
        if(Math.random() > 0.22){
          var semi;
          if(Math.random() < 0.72) semi = chord[Math.floor(Math.random() * chord.length)];
          else semi = mood.scale[Math.floor(Math.random() * mood.scale.length)];
          if(Math.random() < 0.3) semi += 12;
          voice(freq(mood.root, semi), nextTime, beat * (mood.leadDur || 1.7), mood.wave, mood.lead);
        }
        nextTime += beat;
        step++;
      }
    }

    return {
      start: function(key){
        if(state && (state.sound === false || state.music === false)) return;
        if(!MOODS[key]) key = "calm";
        if(playing && mood === MOODS[key]) return;
        this.stop();
        try{
          var c = ctx();
          if(c.state === "suspended") c.resume();
          master = c.createGain();
          master.gain.setValueAtTime(0.0001, c.currentTime);
          /* Fade in over a couple of seconds so it arrives rather than starts. */
          master.gain.exponentialRampToValueAtTime(1, c.currentTime + 2.2);
          master.connect(c.destination);
          mood = MOODS[key];
          step = 0;
          nextTime = c.currentTime + 0.12;
          playing = true;
          /* Visible in the DOM so what is playing can be checked without
             guessing from oscillator counts. */
          try{ document.body.setAttribute("data-music", key); }catch(e){}
          schedule();
          timer = setInterval(schedule, TICK);
        }catch(e){ playing = false; }
      },
      stop: function(){
        playing = false; mood = null;
        try{ document.body.removeAttribute("data-music"); }catch(e){}
        if(timer){ clearInterval(timer); timer = null; }
        if(master){
          try{
            var c = ctx(), m = master;
            m.gain.cancelScheduledValues(c.currentTime);
            m.gain.setValueAtTime(Math.max(0.0001, m.gain.value), c.currentTime);
            m.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.5);
            setTimeout(function(){ try{ m.disconnect(); }catch(e){} }, 700);
          }catch(e){}
          master = null;
        }
      },
      playing: function(){ return playing; }
    };
  })();

  function moodFor(world){
    if(!world) return "calm";
    return GAME_MOOD[world.id] || SUBJECT_MOOD[world.cat] || "calm";
  }

  /* ---------- speech ----------
     Everything else in here is an oscillator blip, which is fine for "right"
     and "wrong" but cannot say a letter. "Match the sound to a picture" was a
     promise the game did not keep, so the phonics, rhyme, spelling and Chinese
     games now speak, using the voice already on the device. Nothing to
     download, and it works in Chinese as well as English.

     iOS will not speak until the page has had a tap, which entering a game
     always is, and it ignores a second utterance while one is in flight —
     hence the cancel before each. */
  var CAN_SPEAK = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
  /* Reading-aloud scoring needs the browser to listen back, not just talk —
     a separate, less universally supported API. Safari and Firefox mostly
     don't have it, so the read-aloud games check this and say so plainly
     rather than showing a mic button that does nothing. */
  var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  var CAN_LISTEN = !!SpeechRec;
  var voices = [];
  function refreshVoices(){
    try{ voices = window.speechSynthesis.getVoices() || []; }catch(e){ voices = []; }
  }
  if(CAN_SPEAK){
    refreshVoices();
    /* Safari fills the list asynchronously, and on a cold load it is empty. */
    try{ window.speechSynthesis.onvoiceschanged = refreshVoices; }catch(e){}
  }
  /* Most engines mark a voice's sex only in its name, not a field we can
     read, so this is a name-matching heuristic rather than a real property.
     It is wrong for a voice named after nobody in either list, but right far
     more often than picking whichever voice happened to load first, which
     on Android and Windows is frequently male. */
  var FEMALE_VOICE_HINTS = /female|woman|girl|zira|susan|samantha|karen|serena|moira|tessa|fiona|kate|amy|emma|joanna|salli|ivy|kendra|jenny|aria|libby|olivia|sonia|natasha|yuna|xiaoxiao|xiaoyi|mei[-\s]?jia/i;
  var MALE_VOICE_HINTS = /\bmale\b|\bman\b|\bboy\b|daniel|david|mark|james|george|oliver|ryan|guy|brian|matthew|justin|kevin|eric/i;
  /* The flat, clipped read a parent calls "robotic" is almost always the
     device's default compact voice — most platforms also ship a better one
     that the default picker never reaches for. iOS/macOS label theirs
     "Enhanced" or "Premium"; some Android and Chrome builds expose a
     "Natural" or "Neural" voice alongside the plain one. Given a choice,
     take the better-sounding voice over an earlier one in the list. */
  var QUALITY_HINTS = /enhanced|premium|neural|natural|wavenet|studio|hd\b/i;

  /* Chooses a voice for a language, preferring, in order: an exact match for
     the requested locale (en-SG, spoken to sound Singaporean rather than
     British or American); a voice that sounds female, because a primary
     school child hears mostly female teachers and that is the voice a
     parent expects reading these questions; any voice in the same language
     at all, so the app never falls silent just because en-SG is not
     installed on this device. */
  function voiceFor(lang){
    if(!voices.length) refreshVoices();
    var want = lang.toLowerCase(), base = want.split("-")[0];
    var sameLocale = [], sameLang = [], i, v, vl;
    for(i = 0; i < voices.length; i++){
      v = voices[i]; vl = String(v.lang || "").toLowerCase().replace("_","-");
      if(vl === want) sameLocale.push(v);
      else if(vl.split("-")[0] === base) sameLang.push(v);
    }
    function female(v){ return FEMALE_VOICE_HINTS.test(v.name || ""); }
    function notMale(v){ return !MALE_VOICE_HINTS.test(v.name || ""); }
    function quality(v){ return QUALITY_HINTS.test(v.name || ""); }
    function pickFrom(list){
      if(!list.length) return null;
      /* A high-quality female voice first; then any high-quality voice at
         all, since a smoother male voice still beats a robotic female one;
         then the same female-over-male fallback as before. */
      var qf = list.filter(function(v){ return quality(v) && female(v); }); if(qf.length) return qf[0];
      var q = list.filter(quality); if(q.length) return q[0];
      var f = list.filter(female); if(f.length) return f[0];
      var n = list.filter(notMale); if(n.length) return n[0];
      return list[0];
    }
    return pickFrom(sameLocale) || pickFrom(sameLang) || null;
  }
  function speak(text, opts){
    if(!CAN_SPEAK || !text) return false;
    if(state && state.sound === false) return false;
    opts = opts || {};
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(text));
      /* en-SG so a device that has it sounds like a Singaporean teacher
         rather than a British or American one; voiceFor() falls back
         through plain "en" if this device has no en-SG voice installed. */
      u.lang = opts.lang || "en-SG";
      /* Slower than default: these are children hearing a word once. */
      u.rate = opts.rate || 0.9;
      u.pitch = opts.pitch || 1.0;
      var v = voiceFor(u.lang);
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
      return true;
    }catch(e){ return false; }
  }
  /* Games that speak the answer as feedback ("that's the right form",
     the correct pinyin, the missing word) used to move on after a fixed
     short delay regardless of how long that took to say, so a longer
     sentence got cut off by the next question appearing. This waits for
     the browser to actually finish speaking — polling rather than relying
     on the utterance's own 'end' event, so it works with any speak() call
     already made, not just ones written to expect it — then adds the
     pause a game asks for so the answer has a moment to sink in. A
     ceiling guards against a browser that never reports speaking as
     finished. */
  function afterSpeech(fn, pauseMs){
    var settled = false;
    function go(){ if(settled) return; settled = true; setTimeout(fn, pauseMs == null ? 900 : pauseMs); }
    if(!CAN_SPEAK || !window.speechSynthesis.speaking){ go(); return; }
    var check = setInterval(function(){
      if(!window.speechSynthesis.speaking){ clearInterval(check); go(); }
    }, 120);
    setTimeout(function(){ clearInterval(check); go(); }, 6000);
  }
  /* ---------- reading the question out loud ----------
     Rather than adding a speak() call to each of fifty-odd games — and
     forgetting it on the next one — this watches the stage and reads whatever
     question has just appeared. One place, every game, including games not
     written yet.

     Action games are skipped: a cannon arena has no question to read, and the
     stage changes on every shot. */
  var lastSpoken = "";
  function stageQuestion(stage){
    if(!stage) return "";
    if(stage.querySelector(".sea, .arena, .memgrid, .pads, .duo-board, canvas")) return "";
    var bits = [];
    var p = stage.querySelector(".prompt");
    if(p) bits.push(p.textContent.trim());
    var q = stage.querySelector(".bigq, .sentence, .idiom, .passage");
    if(q) bits.push(q.textContent.trim());
    /* A fill-in-the-blank sentence has "___" right in its text. Read
       literally, that comes out as the TTS engine spelling out
       "underscore" once per character. A child hearing a gap does not
       need it named at all — just a short breath, then the sentence
       carries on. */
    return bits.filter(Boolean).join(". ").replace(/_{2,}/g, "...").replace(/\s+/g, " ").trim();
  }
  var CJK_RE = /[一-鿿]/;
  function readStage(){
    if(!CAN_SPEAK || (state && state.sound === false) || (state && state.readAloud === false)) return;
    var stage = document.querySelector(".stage");
    var text = stageQuestion(stage);
    /* Chinese games say their own character in Mandarin a moment later, and
       that call cancels this one, which is the order we want. Now that a
       Chinese game's own .prompt line is itself in Chinese, this needs to
       recognise that and reach for the Mandarin voice too — the default
       en-SG one would otherwise try to sound out hanzi as English. */
    if(!text || text === lastSpoken || text.length > 240) return;
    lastSpoken = text;
    speak(text, CJK_RE.test(text) ? {lang:"zh-CN", rate:0.8} : undefined);
  }
  var readTimer = null;
  function watchStage(){
    if(!window.MutationObserver) return;
    var obs = new MutationObserver(function(){
      if(readTimer) clearTimeout(readTimer);
      readTimer = setTimeout(readStage, 320);
    });
    obs.observe($("screen"), {childList:true, subtree:true});
  }

  /* A round speaker the child can tap to hear it again. Returns null when the
     device has no voices at all, so callers can leave the layout alone. */
  function sayButton(text, opts){
    if(!CAN_SPEAK) return null;
    var b = el("button",{"class":"saybtn", "aria-label":"Hear it again", text:"🔊"});
    b.addEventListener("click", function(e){
      e.stopPropagation();
      speak(typeof text === "function" ? text() : text, opts);
    });
    return b;
  }

  /* ---------- confetti ----------
     Drawn on one full-screen canvas that is created on demand and thrown away
     when the last piece lands, so there is nothing sitting over the page
     catching taps the rest of the time. Motion is by delta time, not by frame,
     so it looks the same on a 60Hz iPad and a 120Hz one. */
  var confCanvas = null, confCtx = null, confPieces = [], confRAF = null;
  var CONF_COLOURS = ["#FFC43D","#FF5D8F","#2FB6E6","#35C48F","#9B7BFF","#FF8A5B","#FFFFFF"];

  function confettiBurst(count, originY){
    /* A child who would rather not have things flying about can turn it off,
       and anyone who has asked the system for less motion gets none. */
    if(state.motion === false) return;
    try{
      if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    }catch(e){}

    if(!confCanvas){
      confCanvas = el("canvas",{style:"position:fixed; inset:0; z-index:35; pointer-events:none"});
      document.body.appendChild(confCanvas);
      confCtx = confCanvas.getContext("2d");
    }
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    confCanvas.width = window.innerWidth * dpr;
    confCanvas.height = window.innerHeight * dpr;
    confCanvas.style.width = window.innerWidth + "px";
    confCanvas.style.height = window.innerHeight + "px";
    confCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var W = window.innerWidth, H = window.innerHeight;
    var y0 = originY == null ? H * 0.42 : originY;
    var i;
    for(i = 0; i < count; i++){
      var angle = (Math.PI * 2 * i) / count + Math.random() * .4;
      var speed = 260 + Math.random() * 420;
      confPieces.push({
        x: W / 2 + (Math.random() - .5) * 120,
        y: y0,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 220,
        size: 7 + Math.random() * 9,
        spin: (Math.random() - .5) * 14,
        rot: Math.random() * 6.3,
        life: 1.5 + Math.random() * 1.1,
        age: 0,
        c: pick(CONF_COLOURS)
      });
    }
    if(!confRAF) confRAF = requestAnimationFrame(confStep);
  }

  var confLast = 0;
  function confStep(now){
    if(!confLast) confLast = now;
    var dt = Math.min((now - confLast) / 1000, .05);
    confLast = now;
    confCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    var alive = [], i, p;
    for(i = 0; i < confPieces.length; i++){
      p = confPieces[i];
      p.age += dt;
      if(p.age >= p.life) continue;
      p.vy += 900 * dt;          // gravity
      p.vx *= (1 - 1.1 * dt);    // air
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.spin * dt;
      if(p.y > window.innerHeight + 40) continue;

      confCtx.save();
      confCtx.globalAlpha = Math.max(0, 1 - p.age / p.life);
      confCtx.translate(p.x, p.y);
      confCtx.rotate(p.rot);
      confCtx.fillStyle = p.c;
      confCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      confCtx.restore();
      alive.push(p);
    }
    confPieces = alive;

    if(confPieces.length){ confRAF = requestAnimationFrame(confStep); }
    else {
      confRAF = null; confLast = 0;
      if(confCanvas && confCanvas.parentNode){ confCanvas.parentNode.removeChild(confCanvas); }
      confCanvas = null; confCtx = null;
    }
  }

  /* A small shower of stars from a spot on the screen — used when a single
     answer is right, where full confetti would be too much every time. */
  function sparkle(atEl){
    if(state.motion === false || !atEl) return;
    var r = atEl.getBoundingClientRect(), i;
    for(i = 0; i < 7; i++){
      var sp = el("div",{"class":"spark", text: pick(["✨","⭐","🌟"])});
      sp.style.left = (r.left + r.width / 2) + "px";
      sp.style.top = (r.top + r.height / 2) + "px";
      sp.style.setProperty("--dx", ((Math.random() - .5) * 180) + "px");
      sp.style.setProperty("--dy", (-60 - Math.random() * 150) + "px");
      sp.style.animationDelay = (i * 0.04) + "s";
      document.body.appendChild(sp);
      (function(node){ setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, 1200); })(sp);
    }
  }

  function flash(sym){
    var f = $("flash");
    f.textContent = sym; f.classList.remove("show");
    void f.offsetWidth;
    f.classList.add("show");
  }

  /* ---------- content (see content.js) ---------- */
  /* The page and the banks file ship together. If a browser is holding an old
     copy of content.js, reading PC below throws and the whole app dies with a
     blank screen, so check first and say something a parent can act on. */
  var NEEDED = ["PICS","SPELL","QUIZ","ODD","SHAPES","COLOURS","CODE_LEVELS","COINS",
    "RHYMES","SORT_ADV","ANIMAL_CLUES","RIDDLES","SENSES","SENSE_ORGANS","HOMES",
    "LIFECYCLES","FOODCHAINS","STATE_CHANGES","PLANT_PARTS",
    "ZH_CHARS","ZH_NUMBERS","ZH_WORDS",
    "OPPOSITES","GRAMMAR","SENTENCES","PUNCT","MEANINGS","IDIOMS","AFFIXES","PASSAGES"];
  var missing = (typeof PC === "undefined" || !PC) ? ["everything"] :
    NEEDED.filter(function(k){ return !PC[k]; });
  if(missing.length){
    document.getElementById("screen").innerHTML =
      '<div style="padding:40px 20px; text-align:center; max-width:460px; margin:0 auto">' +
      '<div style="font-size:54px; margin-bottom:14px">\uD83D\uDD04</div>' +
      '<h2 class="display" style="margin:0 0 10px">Almost there \u2014 one refresh needed</h2>' +
      '<p style="color:#C9C4EE; font-weight:700; line-height:1.6">Your browser is holding an old copy of the games. ' +
      'Pull down to refresh this page and everything will come back.</p>' +
      '<button class="btn btn-lg btn-go" style="margin-top:18px" onclick="location.reload(true)">Refresh now</button>' +
      '</div>';
    return;
  }
  var PICS = PC.PICS, SPELL = PC.SPELL, QUIZ = PC.QUIZ, ODD = PC.ODD;
  var SHAPES = PC.SHAPES, COLOURS = PC.COLOURS, CODE_LEVELS = PC.CODE_LEVELS, COINS = PC.COINS;
  var RHYMES = PC.RHYMES, SORT_ADV = PC.SORT_ADV;
  var ANIMAL_CLUES = PC.ANIMAL_CLUES, RIDDLES = PC.RIDDLES;
  var SENSES = PC.SENSES, SENSE_ORGANS = PC.SENSE_ORGANS, HOMES = PC.HOMES;
  var LIFECYCLES = PC.LIFECYCLES, FOODCHAINS = PC.FOODCHAINS;
  var STATE_CHANGES = PC.STATE_CHANGES, PLANT_PARTS = PC.PLANT_PARTS;
  var ZH_CHARS = PC.ZH_CHARS, ZH_NUMBERS = PC.ZH_NUMBERS, ZH_WORDS = PC.ZH_WORDS;
  var OPPOSITES = PC.OPPOSITES, GRAMMAR = PC.GRAMMAR, SENTENCES = PC.SENTENCES, PUNCT = PC.PUNCT;
  var MEANINGS = PC.MEANINGS, IDIOMS = PC.IDIOMS, AFFIXES = PC.AFFIXES, PASSAGES = PC.PASSAGES;
  var SYNONYMS = PC.SYNONYMS, TENSES = PC.TENSES, PLURALS = PC.PLURALS;
  var ANIMAL_GROUPS = PC.ANIMAL_GROUPS, WP_NAMES = PC.WP_NAMES, WP_THINGS = PC.WP_THINGS;
  var HOMOPHONES = PC.HOMOPHONES, ZH_MEASURE = PC.ZH_MEASURE, ZH_STROKES = PC.ZH_STROKES;
  var MAGNETIC = PC.MAGNETIC;
  var POLES = PC.POLES, FORCES = PC.FORCES, MATERIALS = PC.MATERIALS;
  var CONDUCTORS = PC.CONDUCTORS, VERTEBRATES = PC.VERTEBRATES, LIVING = PC.LIVING;
  var SENTENCE_TYPES = PC.SENTENCE_TYPES;
  var READ_ALOUD_EN = PC.READ_ALOUD_EN, READ_ALOUD_ZH = PC.READ_ALOUD_ZH, READ_STORY_ZH = PC.READ_STORY_ZH;

  /* Age bands. Everything a child is shown is chosen against these. */
  var BANDS = [
    {id:0, range:"3–4",  label:"Little",   sg:"Nursery – K1"},
    {id:1, range:"5–6",  label:"Starter",  sg:"K1 – K2"},
    {id:2, range:"7–8",  label:"Growing",  sg:"P1 – P2"},
    {id:3, range:"9–12", label:"Big kid",  sg:"P3 – P6"}
  ];
  function bandOf(age){ return age <= 4 ? 0 : age <= 6 ? 1 : age <= 8 ? 2 : 3; }
  function band(){ return bandOf(state.age || 5); }

  /* Bands are four broad steps and they stop being enough at the top: P3, P4,
     P5 and P6 all land in band 3, so a twelve-year-old was being asked the
     same times tables as a nine-year-old. Where the syllabus actually diverges
     — ratio, percentage, speed, volume, algebra — the games ask for the exact
     level instead. */
  var LEVEL_RANK = {N:0, K1:1, K2:2, P1:3, P2:4, P3:5, P4:6, P5:7, P6:8};
  function rank(){ return LEVEL_RANK[schoolLevel()] || 0; }
  function isSenior(){ return rank() >= 7; }   // P5 and P6

  /* Difficulty still moves in four broad steps, but which games a child is
     shown follows their exact school level: nine years old means P3, not
     "somewhere between P3 and P6". */
  var LEVELS = ["N","K1","K2","P1","P2","P3","P4","P5","P6"];
  function levelForAge(age){
    if(age <= 4) return "N";
    if(age >= 12) return "P6";
    return LEVELS[age - 4];
  }
  function schoolLevel(){ return levelForAge(state.age || 5); }
  function levelName(l){ return l === "N" ? "Nursery" : l; }
  /* Pick items for this band, falling back to the nearest ones if a bank is thin. */

  /* ---------- not asking the same thing twice ----------
     Shuffling a pool at the start of a round is not enough. A round is eight
     questions and some of these banks hold six items for a child's age, so
     the same round asked one of them twice and the next sitting was the same
     six cards in a new order. A child notices that in about four minutes.

     So each game keeps a bag. Items are dealt out of it and not put back, so
     nothing is asked again until everything else has been; the bag lives in
     saved state, so closing the app and coming back tomorrow carries on where
     she left off rather than starting the same six questions again. When the
     bag empties a fresh cycle begins.

     If a bank is smaller than a round it must repeat, but only after every
     other item has had its turn.  */
  function bagOf(id){
    if(!state.bags) state.bags = {};
    var b = state.bags[id];
    return (b && b.length !== undefined) ? b : [];
  }
  function deal(id, pool, keyOf, n){
    if(!pool || !pool.length) return [];
    var bag = bagOf(id), out = [], i, left, it;
    for(i = 0; i < n; i++){
      left = pool.filter(function(x){ return bag.indexOf(keyOf(x)) < 0; });
      if(!left.length){
        /* The bag ran out. A new cycle carries the most recent quarter of the
           old one forward, and keeps what this round has already asked out of
           it, so the cycle boundary does not hand straight back the question
           before last. */
        bag = bag.slice(Math.max(0, bag.length - Math.floor(pool.length / 4)));
        left = pool.filter(function(x){
          return bag.indexOf(keyOf(x)) < 0 && out.indexOf(x) < 0; });
        if(!left.length) left = pool.filter(function(x){ return out.indexOf(x) < 0; });
        if(!left.length) left = pool.slice();
      }
      it = pick(left);
      out.push(it);
      bag.push(keyOf(it));
    }
    if(!state.bags) state.bags = {};
    state.bags[id] = bag;
    save();
    return out;
  }
  /* An item's identity is the whole item, not one of its fields. Picking a
     likely-looking field guesses wrong: in the measure-word bank "w" is the
     measure word, so every noun taking 只 counted as the same question and
     the bag thought it had dealt them all after three. Hashing the entry
     cannot collide that way, and the keys stay short enough to save. */
  function hashKey(str){
    var h = 5381, i;
    for(i = 0; i < str.length; i++) h = (((h << 5) + h) ^ str.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }
  function keyer(){
    return function(it){
      if(it == null) return "";
      return hashKey(typeof it === "object" ? JSON.stringify(it) : String(it));
    };
  }
  /* The usual call: deal a round's worth out of a band's pool. */
  function dealBand(id, list, n){
    return deal(id, forBand(list, band()), keyer(), n);
  }

  function forBand(list, b){
    var exact = list.filter(function(x){ return x.b === b; });
    if(exact.length >= 4) return exact;
    var near = list.filter(function(x){ return Math.abs(x.b - b) <= 1; });
    return near.length >= 4 ? near : list;
  }

  /* ---------- state ---------- */
  /* motion and sound default to on; a parent can turn either off in the player
     settings, and the app also honours the system "reduce motion" setting
     without being asked. */
  var DEFAULT = { name:"", age:5, avatar:"🦊", avatarHat:null, avatarBg:null, setup:false,
    stars:0, streak:0, perfects:0, allUnlocked:false, adsDisabled:false, roundsPlayed:0,
    lastPlayed:"", motion:true, sound:true, music:true, readAloud:true,
    quest:null, progress:{}, bags:{} };
  var state = JSON.parse(JSON.stringify(DEFAULT));
  var licence = null;
  var licenceExp = null;
  /* Set from the server on sign-in/verify (admin-controlled, global for every
     account); a sane default stands in for the handful of moments before
     that first response lands, or if the server is ever older than this
     client and does not send it at all. */
  var adsConfig = {enabled:true, everyRounds:10};

  /* ---------- saving ----------
     localStorage keeps the app instant and working offline; the account copy
     is what survives a cleared browser or a move to another iPad. Every save
     writes locally at once and pushes to the account a moment later, batched
     so a run of right answers is one request rather than ten. */
  var pushTimer = null, accountEmail = null;
  /* Whether the signed-in account has a password yet. Accounts from before
     passwords existed have none; the profile sheet nudges them to set one. */
  var accountHasPassword = false;
  /* Sentences other players' children have written and had approved,
     fetched once at boot and refreshed quietly each time the home screen is
     shown, so a newly-approved one appears without anyone reloading the
     page by hand. */
  var approvedWritings = [];
  function refreshWritings(){
    api("/api/writings/approved", null, "GET").then(function(res){
      if(res.status === 200 && res.body.ok) approvedWritings = res.body.writings || [];
    })["catch"](function(){});
  }

  /* ---------- staying signed in ----------
     Two stores, deliberately. localStorage is the "keep me signed in" box:
     it survives closing the app, which is what a family iPad wants.
     sessionStorage is the other answer — it is forgotten the moment the tab
     closes, which is what a shared or borrowed device wants. Reads check
     both, so nothing else in the app has to care which was used. */
  function getToken(){
    try{ return localStorage.getItem("papercub.token") || sessionStorage.getItem("papercub.token"); }
    catch(e){ return null; }
  }
  function setToken(tok, remember){
    try{
      if(remember === false){
        sessionStorage.setItem("papercub.token", tok);
        localStorage.removeItem("papercub.token");
      } else {
        localStorage.setItem("papercub.token", tok);
        sessionStorage.removeItem("papercub.token");
      }
    }catch(e){}
  }
  function clearToken(){
    try{ localStorage.removeItem("papercub.token"); }catch(e){}
    try{ sessionStorage.removeItem("papercub.token"); }catch(e){}
  }
  function rememberedHere(){
    try{ return !!localStorage.getItem("papercub.token"); }catch(e){ return false; }
  }

  /* Signing out leaves the device clean: a borrowed iPad should not hand the
     next child someone else's stars. The account copy on the server is
     untouched, so signing back in brings it all back. */
  function signOut(){
    clearToken();
    try{ localStorage.removeItem("papercub.player"); }catch(e){}
    try{ localStorage.removeItem("papercub.noinstall"); }catch(e){}
    accountEmail = null; accountHasPassword = false;
    licence = null; licenceExp = null;
    state = JSON.parse(JSON.stringify(DEFAULT));
    location.reload();
  }

  function save(){
    try{ localStorage.setItem("papercub.player", JSON.stringify(state)); }catch(e){}
    schedulePush();
  }

  function schedulePush(){
    if(PREVIEW) return;
    if(pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(pushProgress, 1800);
  }

  function pushProgress(){
    pushTimer = null;
    var token = null;
    token = getToken();
    if(!token) return;
    api("/api/progress", {token:token, state:state})["catch"](function(){
      /* Offline or the server is down: the local copy still holds everything,
         and the next save will try again. */
    });
  }

  /* Called once, after the licence is settled. Sends what this device has and
     takes back the merge, so a child who played on a phone this morning finds
     those stars here this afternoon. */
  function syncProgress(then){
    var token = null;
    token = getToken();
    if(!token){ if(then) then(); return; }
    api("/api/progress", {token:token, state:state}).then(function(res){
      if(res.status === 200 && res.body.ok){
        accountEmail = res.body.email || null;
        accountHasPassword = !!res.body.hasPassword;
      }
      if(res.status === 200 && res.body.ok && res.body.state){
        var incoming = res.body.state;
        var k;
        for(k in DEFAULT) if(incoming[k] !== undefined) state[k] = incoming[k];
        state.progress = incoming.progress || {};
        try{ localStorage.setItem("papercub.player", JSON.stringify(state)); }catch(e){}
      }
    })["catch"](function(){})
     .then(function(){ if(then) then(); });
  }

  /* Sending the whole state on every keystroke of a game is wasteful, so a
     page being closed gets one last push instead. */
  window.addEventListener("pagehide", function(){
    if(pushTimer){ clearTimeout(pushTimer); pushProgress(); }
  });
  function load(){
    try{
      var raw = localStorage.getItem("papercub.player");
      if(raw){
        var got = JSON.parse(raw), k;
        for(k in DEFAULT) if(got[k] !== undefined) state[k] = got[k];
      }
    }catch(e){}
  }
  function levelOf(id){ return (state.progress[id] && state.progress[id].level) || 1; }
  function starsOf(id){ return (state.progress[id] && state.progress[id].stars) || 0; }
  function award(id, stars, passed){
    var p = state.progress[id];
    if(!p){ p = {level:1, stars:0}; state.progress[id] = p; }
    p.stars += stars;
    state.stars += stars;
    if(passed) p.level = Math.min(10, p.level + 1);
    var today = new Date().toISOString().slice(0,10);
    if(state.lastPlayed !== today){
      var y = new Date(Date.now() - 86400000).toISOString().slice(0,10);
      state.streak = (state.lastPlayed === y) ? state.streak + 1 : 1;
      state.lastPlayed = today;
    }
    save();
  }

  /* ---------- the learning journey ----------
     Each subject is an ordered path, roughly the order the syllabus takes them
     in. Mastery is Level 5, which is four successful rounds past the start. */
  var JOURNEY = {
    /* Harbour Cannon sits second so it is open from the first day at every
       age: it is the game a child will want to show someone. */
    /* Number Quest is the backbone of the subject and stays open from day one
       at every age; the two showy games are worth earning. Adding them ahead
       of it quietly pushed the flagship game behind a 35-star gate. */
    maths:   ["tenframe","numbers","cannon","quest","race","patterns","bonds","numline","shapes","measure","wordprob","tower","joyboss","snake","sgmoney","money","picgraph","barmodel","fraction","decimal","areaperim","ratio","balance"],
    english: ["sounds","spell","rhyme","plural","opposites","synonym","grammar","tenses","homophone","sentence","punct","meaning","affix","idiom","reading"],
    think:   ["odd","sort","code"],
    /* Five Senses and Animal Homes suit the very youngest and open the
       path; Food Chains needs the vocabulary from Animal Groups and
       States of Matter first, so it closes it. All three carried a
       science category tag but were never added here, so they never
       featured in “what unlocks next” and sat outside the star gates
       every other science game answers to. */
    science: ["homes","senses","quiz","animals","magnet","lifecycle","plant","matter","circuit","foodchain"],
    inspect: ["spotdiff","findodd","shadow","detective"],
    music:   ["tune","musicmaker","highlow","beats","tempo"],
    guess:   ["guessnum","guessanimal","mystery","riddle","flags"],
    quick:   ["bubbles","catch","simon","memory"],
    chinese: ["zhpic","zhstroke","zhpinyin","zhnum","zhword","zhmeasure"],
    duo:     ["duomaths","duoword","duosquares","duomemory"]
  };
  var SUBJECTS = [
    {k:"maths",   nm:"Maths & Numbers"},
    {k:"english", nm:"English & Words"},
    {k:"chinese", nm:"华文 Chinese"},
    {k:"think",   nm:"Thinking & Logic"},
    {k:"science", nm:"Science"},
    {k:"inspect", nm:"Inspector Games"},
    {k:"music",   nm:"Sound & Music"},
    {k:"guess",   nm:"Guessing Games"},
    {k:"quick",   nm:"Quick Games"},
    {k:"duo",     nm:"Two Players"}
  ];
  var MASTER = 5;

  /* ---------- earning your way in ----------
   *
   * Stars open new games. The cost is worked out from a game's place on its
   * subject's path rather than written on each game, so it stays right as
   * games are added — and because it is per subject, the first two games of
   * every subject are always open. A child is never left staring at a wall of
   * locks, and never runs out of something to play in the subject they like.
   *
   * Locked games are shown, not hidden: seeing what is coming is most of the
   * reason to go and earn it.
   */
  /* The ladder has to be at least as long as the longest subject path, or
     every game past the end of it shares one gate: maths grew to twenty-odd
     games and a dozen of them all sat waiting on the same 320 stars, so
     nothing happened for weeks and then twelve cards opened at once. Beyond
     320 the steps are a steady 60, which is about two good sittings. */
  var STAR_GATES = [0, 0, 15, 35, 60, 90, 125, 165, 210, 260, 320,
                    380, 440, 500, 560, 620, 680, 740, 800, 860, 920, 980,
                    1040, 1100, 1160, 1220];
  var starGateCache = null, starGateLevel = null;

  /* ---------- avatar customization ----------
     Cheap on purpose: these do not gate any learning content, just a bit of
     personal flair to grow into alongside the star total a child already
     sees everywhere else in the app. */
  var AVATAR_HATS = [
    {id:"none",   e:"",   nm:"No hat",       cost:0},
    {id:"cap",    e:"🧢", nm:"Cap",           cost:10},
    {id:"sun",    e:"👒", nm:"Sun Hat",       cost:20},
    {id:"helmet", e:"⛑️", nm:"Helmet",        cost:40},
    {id:"grad",   e:"🎓", nm:"Grad Cap",      cost:70},
    {id:"top",    e:"🎩", nm:"Top Hat",       cost:110},
    {id:"crown",  e:"👑", nm:"Crown",         cost:160}
  ];
  var AVATAR_BGS = [
    {id:"none",   nm:"Plain",   cost:0,   css:"linear-gradient(145deg,var(--sun),var(--coral))"},
    {id:"sunny",  nm:"Sunny",   cost:15,  css:"linear-gradient(145deg,#FFD98A,#FF9E3D)"},
    {id:"ocean",  nm:"Ocean",   cost:35,  css:"linear-gradient(145deg,#7FD8FF,#2F7FD6)"},
    {id:"forest", nm:"Forest",  cost:55,  css:"linear-gradient(145deg,#A8E6C9,#2E8B4F)"},
    {id:"galaxy", nm:"Galaxy",  cost:90,  css:"linear-gradient(145deg,#C3B4FF,#6A2FC9)"},
    {id:"sunset", nm:"Sunset",  cost:140, css:"linear-gradient(145deg,#FF9AA2,#C2185B)"},
    {id:"gold",   nm:"Gold",    cost:200, css:"linear-gradient(145deg,#FFE9A0,#D9A21B)"}
  ];
  function avatarHatItem(id){
    return AVATAR_HATS.filter(function(h){ return h.id === id; })[0] || AVATAR_HATS[0];
  }
  function avatarBgItem(id){
    return AVATAR_BGS.filter(function(b){ return b.id === id; })[0] || AVATAR_BGS[0];
  }
  /* The same composite — base animal, background, hat — wherever an avatar
     shows: the topbar button and the My Progress preview alike. */
  function avatarNode(size){
    var wrap = el("div",{"class":"avatarc",
      style:"width:" + size + "px; height:" + size + "px; font-size:" + Math.round(size * 0.55) + "px; " +
        "background:" + avatarBgItem(state.avatarBg).css});
    wrap.appendChild(el("div",{"class":"avatarc-base", text: state.avatar}));
    var hat = avatarHatItem(state.avatarHat);
    if(hat.e){
      wrap.appendChild(el("div",{"class":"avatarc-hat", text: hat.e,

  /* Counted over the games this child can actually see, not the whole path.
     Ten Frame and Number Bonds sit before Number Quest on the maths journey,
     but a P3 child is never shown them — so counting the whole path put the
     first maths game a nine-year-old sees behind fifteen stars, with nothing
     open above it. Recomputed when the age changes. */
  function starGates(){
    var lvl = schoolLevel();
    if(starGateCache && starGateLevel === lvl) return starGateCache;
    starGateCache = {}; starGateLevel = lvl;

    var visible = {};
    WORLDS.filter(suitsAge).forEach(function(w){ visible[w.id] = true; });

    SUBJECTS.forEach(function(sub){
      var ids = (JOURNEY[sub.k] || []).filter(function(id){ return visible[id]; });
      ids.forEach(function(id, idx){
        starGateCache[id] = STAR_GATES[Math.min(idx, STAR_GATES.length - 1)];
      });
    });
    /* Anything not on a path stays open rather than being locked by accident. */
    WORLDS.forEach(function(w){ if(starGateCache[w.id] == null) starGateCache[w.id] = 0; });
    return starGateCache;
  }
  function starCost(id){ return starGates()[id] || 0; }
  function starLocked(w){
    if(licence && licence.trial) return false; // the trial shows the whole app, no star ladder
    if(state.allUnlocked) return false;       // an admin cleared every star gate for this child
    if(played(w.id)) return false;            // never take back a game already met
    return (state.stars || 0) < starCost(w.id);
  }
  function nextUnlock(){
    var best = null;
    WORLDS.filter(suitsAge).forEach(function(w){
      if(!starLocked(w)) return;
      var c = starCost(w.id);
      if(!best || c < best.cost) best = {w:w, cost:c};
    });
    return best;
  }

  function played(id){ return !!state.progress[id]; }
  function mastered(id){ return levelOf(id) >= MASTER; }
  function worldById(id){
    for(var i=0;i<WORLDS.length;i++) if(WORLDS[i].id === id) return WORLDS[i];
    return null;
  }
  function playedCount(){
    var n = 0, k;
    for(k in state.progress) if(state.progress[k]) n++;
    return n;
  }

  /* What to do next: the first game on the path, for this age, that is not yet
     mastered. Continuing something half-done beats starting something new. */
  function nextStep(){
    var fitIds = WORLDS.filter(suitsAge).map(function(w){ return w.id; });
    var i, j, ids, id;
    for(i = 0; i < SUBJECTS.length; i++){
      ids = JOURNEY[SUBJECTS[i].k] || [];
      for(j = 0; j < ids.length; j++){
        id = ids[j];
        if(fitIds.indexOf(id) < 0) continue;
        var cand = worldById(id);
        if(cand && starLocked(cand)) continue;
        if(!played(id)) return {w:cand, why:"You haven't tried this one yet."};
        if(!mastered(id)) return {w:worldById(id), why:"You're on Level " + levelOf(id) + ". Reach Level " + MASTER + " to master it."};
      }
    }
    return null;
  }

  var BADGES = [
    {id:"s10",  e:"⭐", nm:"Ten Stars",       hint:"Earn 10 stars",              test:function(){ return state.stars >= 10; }},
    {id:"s50",  e:"🌟", nm:"Fifty Stars",     hint:"Earn 50 stars",              test:function(){ return state.stars >= 50; }},
    {id:"s150", e:"✨", nm:"150 Stars",       hint:"Earn 150 stars",             test:function(){ return state.stars >= 150; }},
    {id:"p1",   e:"🎯", nm:"Perfect Round",   hint:"Get every answer right",     test:function(){ return (state.perfects||0) >= 1; }},
    {id:"p5",   e:"🏆", nm:"Five Perfect",    hint:"Five perfect rounds",        test:function(){ return (state.perfects||0) >= 5; }},
    {id:"k3",   e:"🔥", nm:"Three Days",      hint:"Play three days in a row",   test:function(){ return state.streak >= 3; }},
    {id:"k7",   e:"🚀", nm:"A Whole Week",    hint:"Play seven days in a row",   test:function(){ return state.streak >= 7; }},
    {id:"lv5",  e:"🥇", nm:"Level Five",      hint:"Reach Level 5 in any game",  test:function(){

    {id:"exp",  e:"🗺️", nm:"Explorer",        hint:"Try six different games",    test:function(){ return playedCount() >= 6; }},
    {id:"math", e:"🧮", nm:"Maths Fan",       hint:"Try four maths games",       test:function(){
      var n=0; JOURNEY.maths.forEach(function(id){ if(played(id)) n++; }); return n >= 4; }},
    {id:"word", e:"📚", nm:"Word Lover",      hint:"Try every English game",     test:function(){
      return JOURNEY.english.every(function(id){ return played(id); }); }},
    {id:"all",  e:"👑", nm:"Fun Game Champion", hint:"Master eight games",       test:function(){
      var n=0; for(var k in state.progress) if(mastered(k)) n++; return n >= 8; }}
  ];
  function earnedBadges(){ return BADGES.filter(function(bd){ try{ return bd.test(); }catch(e){ return false; } }); }

  /* ---------- the progress screen ---------- */

    var tiles = el("div",{"class":"stats"});

    /* What the next stars actually buy. Knowing a named game is three stars

    var up = nextUnlock();

      var goal = el("div",{"class":"unlocknext"});

      var mid = el("div",{"class":"un-mid"});
      mid.appendChild(el("div",{"class":"un-l", text:"Next to unlock"}));
      mid.appendChild(el("div",{"class":"un-n", text:up.w.nm}));
      mid.appendChild(el("div",{"class":"un-s", text:up.w.sub}));
      var bar = el("div",{"class":"un-track"});
      var got = el("div",{"class":"un-fill"});

      var prev = 0;

        el("div",{"class":"nw", text:nx.why})));
      card.appendChild(el("div",{"class":"go", text:"▶"}));
      card.addEventListener("click", function(){ sfx.tap(); startGame(nx.w); });

        el("div",{"class":"ne", text:"🎉"}),
        el("div",{}, el("div",{"class":"nn", text:"Every game mastered!"}),
                     el("div",{"class":"nw", text:"Change your age in the player settings for a harder set."}))));
    }

    SUBJECTS.forEach(function(sub){
      var ids = (JOURNEY[sub.k] || []).filter(function(id){
        var w = worldById(id); return w && suitsAge(w);
      });
      if(!ids.length) return;
      var done = ids.filter(mastered).length;
      pad.appendChild(el("h3",{"class":"subject", text:sub.nm}));
      var track = el("div",{"class":"track"});
      var fill = el("div",{"class":"fill"});
      fill.style.width = Math.round(done / ids.length * 100) + "%";
      track.appendChild(fill);
      pad.appendChild(track);
      pad.appendChild(el("div",{"class":"trackn", text: done + " of " + ids.length + " mastered"}));

      var path = el("div",{"class":"path"});
      ids.forEach(function(id){
        var w = worldById(id);
        var gatedStep = starLocked(w);
        var state2 = mastered(id) ? "done" : played(id) ? "doing" : "todo";
        var step = el("button",{"class":"step " + state2 + (gatedStep ? " gatedstep" : "")});
        step.appendChild(el("div",{"class":"pe", text: state2 === "done" ? "✓" : w.emo}));
        step.appendChild(el("div",{"class":"pn", text:w.nm}));
        /* The path is the map, so a locked game is named here even though the
           card on the home screen keeps it a mystery — but it still has to say
           it is locked, or the two screens contradict each other. */
        step.appendChild(el("div",{"class":"pl",
          text: gatedStep ? ("⭐ " + (starCost(id) - (state.stars || 0)) + " more")
              : played(id) ? ("Lv " + levelOf(id)) : "Not started"}));
        step.addEventListener("click", function(){
          sfx.tap();
          if(gatedStep){
            banner("⭐ " + (starCost(id) - (state.stars || 0)) + " more to open this one");
            return;
          }
          startGame(w);
        });
        path.appendChild(step);
      });
      pad.appendChild(path);
    });

    pad.appendChild(el("h3",{"class":"subject", text:"Badges"}));
    var got = earnedBadges().map(function(x){ return x.id; });
    var bg = el("div",{"class":"badges"});
    BADGES.forEach(function(bd){
      var has = got.indexOf(bd.id) >= 0;
      bg.appendChild(el("div",{"class":"badge" + (has ? " has" : ""), title:bd.hint},
        el("div",{"class":"be", text:bd.e}),
        el("div",{"class":"bn", text: has ? bd.nm : bd.hint})));
    });
    pad.appendChild(bg);

    wrap.appendChild(pad);
    show(wrap);
  }

  /* ---------- screens ---------- */
  /* The last game card that was opened, and how far down the list it sat.
     Coming back out of a game should put a child back where they were, not at
     the top of a list they have to scroll through again. */
  var lastOpened = null, lastScroll = 0;

  function show(node){
    var s = $("screen");
    s.textContent = "";
    s.scrollTop = 0;
    s.appendChild(node);
  }

  /* Called at the end of renderHome, once the cards are in the document and
     have a position to scroll to. */
  function restoreHomeView(){
    var s = $("screen");
    if(!lastOpened){ s.scrollTop = 0; return; }
    var card = s.querySelector('[data-world="' + lastOpened + '"]');
    if(!card){ s.scrollTop = lastScroll || 0; return; }
    /* Put the card a little above centre, so the ones after it are in view —
       that is usually where a child is heading next. */
    var top = card.offsetTop - (s.clientHeight / 2) + (card.offsetHeight / 2);
    s.scrollTop = Math.max(0, top);
    card.classList.add("justplayed");
    setTimeout(function(){ card.classList.remove("justplayed"); }, 1600);
  }

  function renderHome(){
    refreshWritings();
    /* Every way out of a game (the back arrow, "Choose another game" on the
       finish screen) lands here, so this is the one place that reliably
       catches a child leaving mid-narration — without it, a question or
       explanation that was still being read out keeps talking over the
       home screen it no longer belongs to. */
    if(CAN_SPEAK) try{ window.speechSynthesis.cancel(); }catch(e){}
    /* The game screens have had their own mood music for a while; the game
       picker itself stayed silent, which made arriving here after a round
       feel like the sound had cut out rather than like a menu. music.start
       is a no-op if it is already playing this same mood, and startGame()
       switches to the game's own mood the moment one is picked, so this
       only ever plays while a child is actually choosing. */
    music.start("calm");
    var wrap = el("div");
    wrap.appendChild(topbar());
    var pad = el("div",{"class":"pad"});

    if(licence){
      var pill = el("div",{"class":"pill " + (licence.trial || licence.limited ? "trial" : "full")});
      if(licence.trial || licence.limited){
        var d = licenceExp ? Math.max(0, Math.ceil((licenceExp*1000 - Date.now())/86400000)) : null;
        pill.textContent = licence.limited ? "Free trial ended"
          : d === null ? "Free trial · every game open"
          : d <= 0 ? "Free trial ends today"
          : d === 1 ? "Free trial · 1 day left"
          : "Free trial · " + d + " days left";
        var up = el("button",{"class":"linkbtn", id:"pc_upgrade", text: licence.limited ? "Unlock every game" : "About full access"});

        pad.appendChild(el("div",{style:"display:flex; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:8px"}, pill, up));
      } else {
        pill.textContent = "Everything unlocked";
        pad.appendChild(el("div",{style:"margin-bottom:8px"}, pill));
      }

    /* Only the games for this child's exact school level. Change the age in
       the player settings and a different set appears. */

    var nx = nextStep();

      card.addEventListener("click", function(){

          var short = starCost(w.id) - (state.stars || 0);

        c.appendChild(el("div",{"class":"sub", text:"by " + (w.childName || "a player")}));

    wrap.appendChild(pad);

  /* ---------- shell shared by every game ---------- */
  function gameShell(world, total){
    var wrap = el("div",{style:"flex:1; min-height:0; display:flex; flex-direction:column; position:relative"});
    var bar = el("div",{"class":"gamebar"});
    var back = el("button",{"class":"iconbtn","aria-label":"Back to the games", text:"←"});
    back.addEventListener("click", function(){ sfx.tap(); runStreak = 0; music.stop(); renderHome(); });
    bar.appendChild(back);
    var dots = el("div",{"class":"dots"});
    for(var i=0;i<total;i++) dots.appendChild(el("div",{"class":"dot"}));
    bar.appendChild(dots);
    bar.appendChild(el("div",{"class":"tally"}, world.emo, el("b",{text:"Lv " + levelOf(world.id)})));
    if(world.cat === "maths") bar.appendChild(scratchToggle(wrap));
    wrap.appendChild(bar);
    var stage = el("div",{"class":"stage"});
    wrap.appendChild(stage);
    show(wrap);
    return {stage:stage, dots:dots};
  }

  /* A place to work sums out by hand — every maths game gets a pencil icon
     in its bar that lays a sheet of paper over the stage. It sits as a
     sibling of .stage, not inside it, so a game clearing the stage between
     rounds (most of them do, via stage.textContent = "") never wipes out
     what a child is in the middle of working out. */
  function scratchToggle(wrap){
    var btn = el("button",{"class":"iconbtn", "aria-label":"Scratchpad for working out", text:"✏️"});
    var pad = null;
    btn.addEventListener("click", function(){
      sfx.tap();
      if(pad){ pad.remove(); pad = null; return; }
      pad = buildScratchpad(wrap, function(){ pad.remove(); pad = null; });
    });
    return btn;
  }
  /* The canvas has to be in the document, sized by CSS, before its pixel
     dimensions can be measured — appending it to wrap happens first, and
     only then is getBoundingClientRect() meaningful. */
  function buildScratchpad(wrap, onDone){
    var overlay = el("div",{"class":"scratchpad"});
    var toolbar = el("div",{"class":"scratch-bar"});
    toolbar.appendChild(el("div",{"class":"lbl", text:"Work it out here"}));
    var clearBtn = el("button",{"class":"btn btn-ghost btn-sm", text:"Clear"});
    var doneBtn = el("button",{"class":"btn btn-pink btn-sm", text:"Done"});
    toolbar.appendChild(clearBtn); toolbar.appendChild(doneBtn);
    overlay.appendChild(toolbar);
    var canvas = el("canvas");
    overlay.appendChild(canvas);
    wrap.appendChild(overlay);

    var ctx = canvas.getContext("2d");
    function sizeCanvas(){
      var r = canvas.getBoundingClientRect();
      var dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(r.width * dpr);
      canvas.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.strokeStyle = "#3A3286"; ctx.lineWidth = 4;
    }
    sizeCanvas();

    var drawing = false, lastX = 0, lastY = 0;
    function pos(e){
      var r = canvas.getBoundingClientRect();
      return {x: e.clientX - r.left, y: e.clientY - r.top};
    }
    canvas.addEventListener("pointerdown", function(e){
      drawing = true; canvas.setPointerCapture(e.pointerId);
      var p = pos(e); lastX = p.x; lastY = p.y;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill();
    });
    canvas.addEventListener("pointermove", function(e){
      if(!drawing) return;
      var p = pos(e);
      ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
      lastX = p.x; lastY = p.y;
    });
    ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
      canvas.addEventListener(ev, function(){ drawing = false; });
    });
    clearBtn.addEventListener("click", function(){ sfx.tap(); ctx.clearRect(0, 0, canvas.width, canvas.height); });
    doneBtn.addEventListener("click", function(){ sfx.tap(); onDone(); });
    return overlay;
  }
  function markDot(dots, i, ok){
    var d = dots.children[i];
    if(d) d.className = "dot " + (ok ? "on" : "bad");
  }

  /* A round finished every time this fires, across every game, so it is the
     one place that can count "every 10th round" without each game having to
     know about ads at all. The AdSense loader script (in <head>) is already
     wired to the real publisher account; ADSENSE_SLOT_ID is the one thing
     still missing, from creating a Display ad unit at
     adsense.google.com -> Ads -> By ad unit -> Display ads. Until that's
     set, a clearly-labelled placeholder stands in so the break, the timing
     and the on/off switches can all be built and tested without it. */
  var ADSENSE_CLIENT_ID = "ca-pub-3599555620047432";
  var ADSENSE_SLOT_ID = "8508143965";
  function showAdBreak(onDone){

    box.appendChild(el("div",{style:"font-weight:800; color:#8E88C4; font-size:13px; letter-spacing:.04em; text-transform:uppercase", text:"Advertisement"}));
    box.appendChild(el("div",{style:"font-weight:700; color:#C9C4EE; font-size:14.5px; margin-top:8px", text:"👀 Quick break — rest your eyes for a moment!"}));
